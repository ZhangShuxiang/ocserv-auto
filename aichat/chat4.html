  <div id="toastWrap"></div>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
  <script>
    (() => {
      'use strict';

      /* ============================================================
       * ★ 服务商配置（源码内置，开箱即用）
       * ============================================================ */
      const BUILTIN_PROVIDERS = [
        {
          name: 'llama-cpp',
          api_key: 'sk-123456789123456789',
          base_url: 'http://192.168.101.11:8888/v1',
          model: 'Qwen3.5-9B-Q4_K_M',
          temperature: 0.7,
          max_tokens: 32768,
          reasoning_effort: '',
        },
        {
          name: 'DeepSeek',
          api_key: '',
          base_url: 'https://api.deepseek.com/v1',
          model: 'deepseek-chat',
          temperature: 1.0,
          max_tokens: 2048,
          reasoning_effort: '',
        },
      ];

      const STORAGE_KEY = 'web_ai_chat_state_v2';
      const DEFAULT_PROVIDER = {
        name: '新服务商', api_key: '', base_url: 'https://api.openai.com/v1',
        model: 'gpt-4o-mini', temperature: 0.7, max_tokens: 2048, reasoning_effort: '',
      };
      const DEFAULT_SYSTEM_PROMPT = '你是一个有帮助的AI助手。';
      const IMG_TOKEN_EST = 85;
      const CODE_COLLAPSE_THRESHOLD = 15; // 超过该行数的代码块默认折叠

      /* ==================== 工具函数 ==================== */
      function genId() {
        return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
      }

      function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, c => ({
          '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
        }[c]));
      }

      function fmtNum(n) {
        n = Math.round(Number(n) || 0);
        if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
        if (n >= 10000) return (n / 1000).toFixed(1) + 'k';
        return n.toLocaleString('en-US');
      }

      function estimateTokens(text) {
        if (!text) return 0;
        const s = String(text);
        let cjk = 0;
        for (let i = 0; i < s.length; i++) {
          const c = s.charCodeAt(i);
          if (
            (c >= 0x4E00 && c <= 0x9FFF) ||
            (c >= 0x3400 && c <= 0x4DBF) ||
            (c >= 0x3040 && c <= 0x30FF) ||
            (c >= 0xAC00 && c <= 0xD7AF) ||
            (c >= 0xF900 && c <= 0xFAFF)
          ) {
            cjk++;
          }
        }
        const rest = s.length - cjk;
        return Math.ceil(cjk * 1.0 + rest / 4);
      }

      function nodeTokens(node) {
        if (!node) return 0;
        if (typeof node.tokens === 'number' && node.tokens >= 0) return node.tokens;
        let t = estimateTokens(node.content || '');
        if (Array.isArray(node.images) && node.images.length) {
          t += node.images.length * IMG_TOKEN_EST;
        }
        return t;
      }

      function nodeReasoningTokens(node) {
        if (!node || !node.reasoning) return 0;
        if (typeof node.reasoning_tokens === 'number') return node.reasoning_tokens;
        return estimateTokens(node.reasoning);
      }

      /* ==================== 数据模型 ==================== */
      function createConversation() {
        return {
          id: genId(),
          created_at: new Date().toISOString(),
          nodes: {},
          children: { root: [] },
          activeLeafId: null,
        };
      }

      function migrateConv(conv) {
        if (conv && conv.nodes && conv.children) {
          if (!conv.children.root) conv.children.root = [];
          return conv;
        }
        const oldMessages = (conv && conv.messages) || [];
        const nodes = {};
        const children = { root: [] };
        let parentId = 'root';
        let lastId = null;
        for (const m of oldMessages) {
          const id = genId();
          nodes[id] = {
            id,
            role: m.role,
            content: m.content || '',
            images: Array.isArray(m.images) ? m.images : [],
            parentId,
            createdAt: (conv && conv.created_at) || new Date().toISOString(),
          };
          children[id] = [];
          if (!children[parentId]) children[parentId] = [];
          children[parentId].push(id);
          parentId = id;
          lastId = id;
        }
        return {
          id: (conv && conv.id) || genId(),
          created_at: (conv && conv.created_at) || new Date().toISOString(),
          nodes,
          children,
          activeLeafId: lastId,
        };
      }

      function getPath(conv, leafId) {
        if (!conv || !leafId || !conv.nodes) return [];
        const path = [];
        let cur = leafId;
        const seen = new Set();
        while (cur && conv.nodes[cur] && !seen.has(cur)) {
          seen.add(cur);
          path.unshift(conv.nodes[cur]);
          cur = conv.nodes[cur].parentId;
        }
        return path;
      }

      function getLeafFrom(conv, nodeId) {
        if (!conv || !nodeId || !conv.nodes) return null;
        let cur = nodeId;
        const seen = new Set();
        while (cur && !seen.has(cur)) {
          seen.add(cur);
          const kids = conv.children[cur] || [];
          if (!kids.length) return cur;
          cur = kids[kids.length - 1];
        }
        return cur;
      }

      /* ==================== 状态 ==================== */
      function defaultState() {
        return {
          theme: 'light',
          system_prompt: DEFAULT_SYSTEM_PROMPT,
          providers: BUILTIN_PROVIDERS.map(p => ({ ...p })),
          current_provider: 0,
          conversations: [],
          current_conv_id: null,
        };
      }

      let state = defaultState();
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
        if (saved && typeof saved === 'object') state = Object.assign(defaultState(), saved);
      } catch (e) {
        console.warn('加载本地状态失败:', e);
      }

      if (!Array.isArray(state.providers) || !state.providers.length) {
        state.providers = BUILTIN_PROVIDERS.map(p => ({ ...p }));
      }
      state.providers = state.providers.map(p => ({
        ...p,
        reasoning_effort: p.reasoning_effort || '',
      }));

      if (!Array.isArray(state.conversations)) state.conversations = [];
      if (typeof state.current_provider !== 'number' ||
        state.current_provider < 0 || state.current_provider >= state.providers.length) {
        state.current_provider = 0;
      }
      if (typeof state.system_prompt !== 'string') state.system_prompt = DEFAULT_SYSTEM_PROMPT;

      state.conversations = state.conversations.map(migrateConv);

      if (state.current_conv_id && !state.conversations.some(c => c.id === state.current_conv_id)) {
        state.current_conv_id = null;
      }

      let quotaWarned = false;
      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch (e) {
          console.warn('保存状态失败:', e);
          if (!quotaWarned) {
            quotaWarned = true;
            toast('本地存储空间不足，含图片的对话可能无法保存。', 'warn');
          }
        }
      }

      const provider = () => state.providers[state.current_provider] || state.providers[0] || null;
      const currentConv = () => state.conversations.find(c => c.id === state.current_conv_id) || null;

      /* ==================== DOM ==================== */
      const $ = id => document.getElementById(id);
      const els = {
        sidebar: $('sidebar'), sidebarOverlay: $('sidebarOverlay'),
        convList: $('convList'), btnNew: $('btnNew'), convSearch: $('convSearch'),
        btnCloseSidebar: $('btnCloseSidebar'),
        providerSelect: $('providerSelect'), btnSettings: $('btnSettings'),
        btnMenu: $('btnMenu'), btnClear: $('btnClear'), btnTheme: $('btnTheme'),
        headerModel: $('headerModel'), headerProvider: $('headerProvider'),
        messages: $('messages'), btnScrollBottom: $('btnScrollBottom'),
        input: $('input'), btnSend: $('btnSend'), btnStop: $('btnStop'),
        btnImage: $('btnImage'), fileInput: $('fileInput'), imagePreview: $('imagePreview'),
        tokenStats: $('tokenStats'),
        settingsModal: $('settingsModal'), settingsForm: $('settingsForm'),
        settingsClose: $('settingsClose'), settingsSave: $('settingsSave'),
        resetProviders: $('resetProviders'),
        providerRows: $('providerRows'), btnAddProvider: $('btnAddProvider'),
        toastWrap: $('toastWrap'),
      };

      let busy = false;
      let abortController = null;
      let pendingImages = [];
      let convFilter = '';
      let stickToBottom = true;
      let draft = null;

      /* ==================== Toast ==================== */
      function toast(msg, type = 'info', duration = 2600) {
        const el = document.createElement('div');
        el.className = 'toast' + (type !== 'info' ? ' ' + type : '');
        el.textContent = msg;
        els.toastWrap.appendChild(el);
        setTimeout(() => {
          el.classList.add('out');
          setTimeout(() => el.remove(), 260);
        }, duration);
      }

      /* ==================== 复制 ==================== */
      async function copyText(text) {
        try {
          if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(text);
            return true;
          }
        } catch (e) { /* 降级 */ }
        try {
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.setAttribute('readonly', '');
          ta.style.cssText = 'position:fixed;top:-1000px;opacity:0';
          document.body.appendChild(ta);
          ta.select();
          const ok = document.execCommand('copy');
          ta.remove();
          return ok;
        } catch (e) {
          return false;
        }
      }

      /* ==================== 主题 ==================== */
      function applyTheme() {
        const dark = state.theme === 'dark';
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        const lightLink = $('hljs-light');
        const darkLink = $('hljs-dark');
        if (lightLink) lightLink.disabled = dark;
        if (darkLink) darkLink.disabled = !dark;
        els.btnTheme.textContent = dark ? '☀️' : '🌙';
        els.btnTheme.title = dark ? '切换到白天模式' : '切换到黑夜模式';
      }

      /* ==================== Markdown ==================== */
      function renderMarkdown(text) {
        if (typeof marked === 'undefined') {
          return `<p>${escapeHtml(text).replace(/\n/g, '<br>')}</p>`;
        }
        const html = marked.parse(text, { gfm: true, breaks: true });
        if (typeof DOMPurify === 'undefined') {
          return `<p>${escapeHtml(text).replace(/\n/g, '<br>')}</p>`;
        }
        return DOMPurify.sanitize(html, { ADD_ATTR: ['target', 'rel'] });
      }

      /**
       * 对渲染后的容器做后处理。
       * @param {HTMLElement} container
       * @param {Object} opts
       * @param {boolean} opts.highlight     是否立即执行代码高亮（默认 true）
       * @param {boolean} opts.allowCollapse 是否允许默认折叠长代码块（默认 true）
       */
      function postRender(container, opts = {}) {
        const { highlight = true, allowCollapse = true } = opts;

        container.querySelectorAll('a[href]').forEach(a => {
          const href = a.getAttribute('href') || '';
          if (/^https?:\/\//i.test(href)) {
            a.target = '_blank';
            a.rel = 'noopener noreferrer';
          }
        });

        container.querySelectorAll('pre').forEach(pre => {
          if (pre.parentElement && pre.parentElement.classList.contains('code-block')) return;
          const code = pre.querySelector('code');
          if (!code) return;

          // 统计行数（去掉末尾换行）
          const codeText = code.textContent || '';
          const trimmed = codeText.replace(/\n+$/, '');
          const lineCount = trimmed ? trimmed.split('\n').length : 0;

          const wrap = document.createElement('div');
          wrap.className = 'code-block';

          const head = document.createElement('div');
          head.className = 'code-head';

          /* --- 折叠切换按钮 --- */
          const toggleBtn = document.createElement('button');
          toggleBtn.type = 'button';
          toggleBtn.className = 'code-toggle';
          toggleBtn.title = '折叠 / 展开';
          toggleBtn.setAttribute('aria-label', '折叠 / 展开');
          toggleBtn.innerHTML = '<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>';
          head.appendChild(toggleBtn);

          /* --- 语言标签 --- */
          const langEl = document.createElement('span');
          langEl.className = 'code-lang';
          const m = (code.className || '').match(/language-([^\s]+)/);
          langEl.textContent = m ? m[1] : 'text';
          head.appendChild(langEl);

          /* --- 行数统计 --- */
          const metaEl = document.createElement('span');
          metaEl.className = 'code-meta';
          metaEl.textContent = lineCount ? `${lineCount} 行` : '';
          head.appendChild(metaEl);

          /* --- 复制按钮 --- */
          const copyBtn = document.createElement('button');
          copyBtn.type = 'button';
          copyBtn.className = 'copy-btn';
          copyBtn.textContent = '复制';
          head.appendChild(copyBtn);

          /* --- 折叠提示 --- */
          const hint = document.createElement('div');
          hint.className = 'code-collapsed-hint';
          hint.textContent = lineCount ? `已折叠 · 共 ${lineCount} 行 · 点击展开` : '已折叠 · 点击展开';

          pre.parentNode.insertBefore(wrap, pre);
          wrap.appendChild(head);
          wrap.appendChild(pre);
          wrap.appendChild(hint);

          /* --- 默认折叠长代码块 --- */
          if (allowCollapse && lineCount >= CODE_COLLAPSE_THRESHOLD) {
            wrap.classList.add('collapsed');
          }

          /* --- 高亮（延迟到首次展开） --- */
          const doHighlight = () => {
            if (!highlight || typeof hljs === 'undefined') return;
            if (code.dataset.hljsDone) return;
            try { hljs.highlightElement(code); } catch (e) { /* 忽略非法语言 */ }
            code.dataset.hljsDone = '1';
          };

          if (highlight) {
            if (!wrap.classList.contains('collapsed')) {
              doHighlight();
            } else {
              // 首次展开时再高亮，避免折叠状态下的无谓开销
              toggleBtn.addEventListener('click', doHighlight, { once: true });
              hint.addEventListener('click', doHighlight, { once: true });
            }
          }

          /* --- 切换行为 --- */
          const updateAria = () => {
            toggleBtn.setAttribute('aria-expanded',
              String(!wrap.classList.contains('collapsed')));
          };
          const toggle = () => {
            wrap.classList.toggle('collapsed');
            updateAria();
          };
          updateAria();

          toggleBtn.addEventListener('click', e => {
            e.stopPropagation();
            toggle();
          });
          hint.addEventListener('click', toggle);
        });
      }

      /* ==================== 思考块 ==================== */
      const CHEVRON_SVG = '<svg class="think-chevron" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>';

      function makeThinkBlock(reasoning, open = false) {
        const block = document.createElement('div');
        block.className = 'think-block' + (open ? ' open' : '');

        const head = document.createElement('div');
        head.className = 'think-head';
        head.innerHTML = CHEVRON_SVG;

        const status = document.createElement('span');
        status.className = 'think-status';
        const rTokens = estimateTokens(reasoning);
        status.textContent = rTokens > 0 ? `思考过程 · ${fmtNum(rTokens)} tokens` : '思考过程';
        head.appendChild(status);

        const bodyEl = document.createElement('div');
        bodyEl.className = 'think-body';
        bodyEl.textContent = reasoning || '';

        head.addEventListener('click', () => block.classList.toggle('open'));

        block.appendChild(head);
        block.appendChild(bodyEl);
        return block;
      }

      /* ==================== Token 统计 ==================== */
      function updateTokenStats() {
        const el = els.tokenStats;
        if (!el) return;

        const conv = currentConv();
        const path = conv ? getPath(conv, conv.activeLeafId) : [];

        const sysT = estimateTokens(state.system_prompt || '');
        let userT = 0, asstT = 0, thinkT = 0;
        for (const node of path) {
          const t = nodeTokens(node);
          if (node.role === 'user') userT += t;
          else {
            asstT += t;
            thinkT += nodeReasoningTokens(node);
          }
        }
        const total = sysT + userT + asstT + thinkT;

        el.innerHTML = `上下文 ≈ <b>${fmtNum(total)}</b> tokens`;
        el.title = [
          `系统提示：${fmtNum(sysT)} tokens`,
          `用户输入：${fmtNum(userT)} tokens`,
          `模型输出：${fmtNum(asstT)} tokens`,
          `思考过程：${fmtNum(thinkT)} tokens`,
          `合计：${fmtNum(total)} tokens`,
          '',
          '（估算值，实际以服务端计费为准）',
        ].join('\n');
      }

      /* ==================== 分支导航 ==================== */
      function makeBranchNav(conv, node, siblings) {
        const idx = siblings.indexOf(node.id);
        const nav = document.createElement('div');
        nav.className = 'branch-nav';

        const prev = document.createElement('button');
        prev.type = 'button';
        prev.className = 'branch-btn';
        prev.textContent = '‹';
        prev.disabled = idx <= 0;
        prev.title = '上一个版本';
        prev.setAttribute('aria-label', '上一个版本');

        const label = document.createElement('span');
        label.className = 'branch-label';
        label.textContent = (idx + 1) + '/' + siblings.length;

        const next = document.createElement('button');
        next.type = 'button';
        next.className = 'branch-btn';
        next.textContent = '›';
        next.disabled = idx >= siblings.length - 1;
        next.title = '下一个版本';
        next.setAttribute('aria-label', '下一个版本');

        prev.addEventListener('click', e => {
          e.stopPropagation();
          switchBranch(node.id, idx - 1);
        });
        next.addEventListener('click', e => {
          e.stopPropagation();
          switchBranch(node.id, idx + 1);
        });

        nav.append(prev, label, next);
        return nav;
      }

      function switchBranch(nodeId, targetIdx) {
        const conv = currentConv();
        if (!conv || busy) return;
        const node = conv.nodes[nodeId];
        if (!node) return;
        const siblings = conv.children[node.parentId] || [];
        if (targetIdx < 0 || targetIdx >= siblings.length) return;

        const targetId = siblings[targetIdx];
        conv.activeLeafId = getLeafFrom(conv, targetId);
        saveState();
        renderConvList();
        renderMessages();
      }

      /* ==================== 消息元素 ==================== */
      function makeTokenBadge(node) {
        const badge = document.createElement('span');
        badge.className = 'token-badge';
        const t = nodeTokens(node);
        const rt = nodeReasoningTokens(node);
        badge.textContent = `≈ ${fmtNum(t + rt)} tokens`;
        badge.title = [
          `估算 token 数：${fmtNum(t + rt)}`,
          rt > 0 ? `其中思考过程：${fmtNum(rt)}` : '',
          node.images && node.images.length ? `（含 ${node.images.length} 张图片，按每张 ${IMG_TOKEN_EST} 估算）` : '',
          '实际以服务端计费为准',
        ].filter(Boolean).join('\n');
        return badge;
      }

      function makeMessageEl(conv, node, isLastAssistant) {
        const wrap = document.createElement('div');
        wrap.className = 'msg msg-' + node.role;
        wrap.dataset.nodeId = node.id;

        const avatar = document.createElement('div');
        avatar.className = 'avatar';
        avatar.textContent = node.role === 'user' ? '我' : 'AI';

        const msgWrap = document.createElement('div');
        msgWrap.className = 'msg-wrap';

        const siblings = conv.children[node.parentId] || [];
        if (siblings.length > 1) {
          msgWrap.appendChild(makeBranchNav(conv, node, siblings));
        }

        if (node.role === 'assistant' && node.reasoning) {
          msgWrap.appendChild(makeThinkBlock(node.reasoning, false));
        }

        const body = document.createElement('div');
        body.className = 'msg-body';

        if (node.role === 'user') {
          if (node.images && node.images.length) {
            const imgs = document.createElement('div');
            imgs.className = 'msg-images';
            node.images.forEach(img => {
              const el = document.createElement('img');
              el.src = img.data;
              el.alt = '发送的图片';
              el.loading = 'lazy';
              imgs.appendChild(el);
            });
            body.appendChild(imgs);
          }
          const p = document.createElement('div');
          p.className = 'user-text';
          p.textContent = node.content || '';
          body.appendChild(p);
        } else {
          const md = document.createElement('div');
          md.className = 'md';
          md.innerHTML = renderMarkdown(node.content || '');
          postRender(md);
          body.appendChild(md);
        }

        const actions = document.createElement('div');
        actions.className = 'msg-actions';

        const copyBtn = document.createElement('button');
        copyBtn.type = 'button';
        copyBtn.className = 'act-btn';
        copyBtn.dataset.act = 'copy-msg';
        copyBtn.textContent = '复制';
        actions.appendChild(copyBtn);

        if (node.role === 'user') {
          const editBtn = document.createElement('button');
          editBtn.type = 'button';
          editBtn.className = 'act-btn';
          editBtn.dataset.act = 'edit';
          editBtn.textContent = '编辑';
          actions.appendChild(editBtn);
        } else if (isLastAssistant) {
          const regenBtn = document.createElement('button');
          regenBtn.type = 'button';
          regenBtn.className = 'act-btn';
          regenBtn.dataset.act = 'regen';
          regenBtn.textContent = '重新生成';
          actions.appendChild(regenBtn);
        }

        actions.appendChild(makeTokenBadge(node));

        msgWrap.appendChild(body);
        msgWrap.appendChild(actions);
        wrap.appendChild(avatar);
        wrap.appendChild(msgWrap);
        return wrap;
      }

      /* ==================== 渲染：会话列表 ==================== */
      function convTitle(conv) {
        const path = getPath(conv, conv.activeLeafId);
        const first = path.find(n => n.role === 'user');
        if (!first) return '新对话';
        const t = (first.content || '').replace(/\s+/g, ' ').trim();
        if (!t) return (first.images && first.images.length) ? '[图片消息]' : '新对话';
        return t.length > 16 ? t.slice(0, 16) + '…' : t;
      }

      function renderConvList() {
        const q = convFilter.trim().toLowerCase();
        const list = q
          ? state.conversations.filter(c => {
            if (convTitle(c).toLowerCase().includes(q)) return true;
            return Object.values(c.nodes || {}).some(n =>
              (n.content || '').toLowerCase().includes(q));
          })
          : state.conversations;

        els.convList.innerHTML = '';

        if (!list.length) {
          const div = document.createElement('div');
          div.className = 'conv-empty';
          div.textContent = q ? '没有匹配的对话' : '暂无对话';
          els.convList.appendChild(div);
          return;
        }

        const frag = document.createDocumentFragment();
        for (const conv of list) {
          const item = document.createElement('div');
          item.className = 'conv-item' + (conv.id === state.current_conv_id ? ' active' : '');

          const icon = document.createElement('span');
          icon.className = 'conv-icon';
          icon.innerHTML = '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>';

          const title = document.createElement('span');
          title.className = 'conv-title';
          title.textContent = convTitle(conv);
          title.title = convTitle(conv);

          const del = document.createElement('button');
          del.className = 'conv-del';
          del.type = 'button';
          del.textContent = '✕';
          del.title = '删除对话';
          del.setAttribute('aria-label', '删除对话');
          del.addEventListener('click', e => {
            e.stopPropagation();
            deleteConv(conv.id);
          });

          item.appendChild(icon);
          item.appendChild(title);
          item.appendChild(del);
          item.addEventListener('click', () => switchConv(conv.id));
          frag.appendChild(item);
        }
        els.convList.appendChild(frag);
      }

      /* ==================== 渲染：消息 ==================== */
      function renderEmpty() {
        els.messages.innerHTML = `
        <div class="empty">
          <div class="big-icon">✦</div>
          <h2>开始新对话</h2>
          <p>支持 OpenAI 兼容接口 · Markdown · 流式输出 · 图片 · 对话分支 · 思考模式 · 代码折叠</p>
          <div class="suggest-chips">
            <button class="suggest-chip" type="button">写一首关于秋天的诗</button>
            <button class="suggest-chip" type="button">用 Python 写一个快速排序</button>
            <button class="suggest-chip" type="button">解释什么是 RESTful API</button>
          </div>
        </div>`;
      }

      function renderMessages() {
        const conv = currentConv();
        if (!conv) {
          renderEmpty();
          updateTokenStats();
          return;
        }
        const path = getPath(conv, conv.activeLeafId);
        if (!path.length) {
          renderEmpty();
          updateTokenStats();
          return;
        }

        let lastAssistantIdx = -1;
        for (let i = path.length - 1; i >= 0; i--) {
          if (path[i].role === 'assistant') { lastAssistantIdx = i; break; }
        }

        const frag = document.createDocumentFragment();
        path.forEach((node, i) => {
          frag.appendChild(makeMessageEl(conv, node, i === lastAssistantIdx));
        });

        els.messages.innerHTML = '';
        els.messages.appendChild(frag);
        stickToBottom = true;
        scrollToBottom(false);
        updateTokenStats();
      }

      function scrollToBottom(smooth = false) {
        els.messages.scrollTo({ top: els.messages.scrollHeight, behavior: smooth ? 'smooth' : 'auto' });
      }

      function isNearBottom() {
        const el = els.messages;
        return el.scrollHeight - el.scrollTop - el.clientHeight < 120;
      }

      /* ==================== 渲染：服务商 ==================== */
      function renderProviders() {
        els.providerSelect.innerHTML = '';
        state.providers.forEach((p, i) => {
          const opt = document.createElement('option');
          opt.value = String(i);
          opt.textContent = p.name || ('服务商 ' + (i + 1));
          els.providerSelect.appendChild(opt);
        });
        els.providerSelect.value = String(state.current_provider);
        updateHeader();
      }

      function updateHeader() {
        const p = provider();
        if (p) {
          els.headerModel.textContent = p.model || '未指定模型';
          let sub = p.name || '未命名服务商';
          if (p.reasoning_effort) sub += ' · 思考:' + p.reasoning_effort;
          els.headerProvider.textContent = sub;
        } else {
          els.headerModel.textContent = '未配置服务商';
          els.headerProvider.textContent = '请点击右下角设置';
        }
      }

      /* ==================== 对话操作 ==================== */
      function newConversation() {
        if (busy) return null;
        const existing = currentConv();
        if (existing && (!existing.activeLeafId || Object.keys(existing.nodes).length === 0)) {
          els.input.focus();
          return existing;
        }
        const conv = createConversation();
        state.conversations.unshift(conv);
        state.current_conv_id = conv.id;
        saveState();
        renderConvList();
        renderMessages();
        els.input.focus();
        return conv;
      }

      function switchConv(id) {
        if (busy) return;
        if (state.current_conv_id === id) { closeSidebar(); return; }
        state.current_conv_id = id;
        saveState();
        renderConvList();
        renderMessages();
        closeSidebar();
      }

      function deleteConv(id) {
        if (busy) return;
        const idx = state.conversations.findIndex(c => c.id === id);
        if (idx < 0) return;
        state.conversations.splice(idx, 1);
        if (state.current_conv_id === id) {
          const next = state.conversations[Math.min(idx, state.conversations.length - 1)];
          state.current_conv_id = next ? next.id : null;
        }
        saveState();
        renderConvList();
        renderMessages();
      }

      function clearCurrentConv() {
        if (busy) return;
        const conv = currentConv();
        if (!conv) { toast('当前没有对话', 'info'); return; }
        const path = getPath(conv, conv.activeLeafId);
        if (!path.length) { toast('当前对话已经是空的', 'info'); return; }
        if (!confirm('确定要清空当前对话的所有消息吗？所有分支都会被删除。')) return;
        conv.nodes = {};
        conv.children = { root: [] };
        conv.activeLeafId = null;
        saveState();
        renderConvList();
        renderMessages();
      }

      /* ==================== 图片处理 ==================== */
      async function compressImage(file) {
        let bmp;
        try {
          bmp = await createImageBitmap(file, { imageOrientation: 'from-image' });
        } catch (e) {
          bmp = await createImageBitmap(file);
        }
        const MAX = 1024;
        let { width, height } = bmp;
        if (width > MAX || height > MAX) {
          const scale = MAX / Math.max(width, height);
          width = Math.max(1, Math.round(width * scale));
          height = Math.max(1, Math.round(height * scale));
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(bmp, 0, 0, width, height);
        if (typeof bmp.close === 'function') bmp.close();
        const mime = (file.type === 'image/png' || file.type === 'image/gif') ? 'image/png' : 'image/jpeg';
        return { data: canvas.toDataURL(mime, 0.85) };
      }

      async function addImages(files) {
        const list = Array.from(files || []);
        let failed = 0;
        for (const file of list) {
          if (!file || !file.type || !file.type.startsWith('image/')) continue;
          try {
            pendingImages.push(await compressImage(file));
          } catch (e) {
            failed++;
            console.warn('图片处理失败:', file.name, e);
          }
        }
        if (failed) toast(`${failed} 张图片处理失败`, 'warn');
        renderImagePreview();
      }

      function renderImagePreview() {
        els.imagePreview.innerHTML = '';
        pendingImages.forEach((img, i) => {
          const wrap = document.createElement('div');
          wrap.className = 'thumb';

          const im = document.createElement('img');
          im.src = img.data;
          im.alt = '待发送图片';

          const rm = document.createElement('button');
          rm.className = 'thumb-rm';
          rm.type = 'button';
          rm.textContent = '✕';
          rm.title = '移除图片';
          rm.setAttribute('aria-label', '移除图片');
          rm.addEventListener('click', () => {
            pendingImages.splice(i, 1);
            renderImagePreview();
          });

          wrap.appendChild(im);
          wrap.appendChild(rm);
          els.imagePreview.appendChild(wrap);
        });
        els.imagePreview.style.display = pendingImages.length ? 'flex' : 'none';
      }

      function buildContent(text, images) {
        if (!images || !images.length) return text;
        const content = [{ type: 'text', text: text || '' }];
        for (const img of images) {
          content.push({ type: 'image_url', image_url: { url: img.data } });
        }
        return content;
      }

      /* ==================== 请求 ==================== */
      function toApiMessages(conv, leafId) {
        const path = getPath(conv, leafId);
        const msgs = [];
        const sys = (state.system_prompt || '').trim();
        if (sys) msgs.push({ role: 'system', content: sys });

        for (const node of path) {
          if (node.role === 'user') {
            msgs.push({ role: 'user', content: buildContent(node.content || '', node.images) });
          } else if (node.role === 'assistant') {
            if (node.content) msgs.push({ role: 'assistant', content: node.content });
          }
        }
        return msgs;
      }

      async function streamChat(apiMessages, signal, onDelta, onReasoning) {
        const p = provider();
        if (!p) throw new Error('未配置服务商');
        if (!p.base_url) throw new Error('请先在设置中填写 Base URL');
        if (!p.model) throw new Error('请先在设置中填写模型名称');

        const url = p.base_url.replace(/\/+$/, '') + '/chat/completions';
        const headers = { 'Content-Type': 'application/json' };
        if (p.api_key) headers['Authorization'] = 'Bearer ' + p.api_key;

        const body = { model: p.model, messages: apiMessages, stream: true };
        const temp = Number(p.temperature);
        if (Number.isFinite(temp)) body.temperature = Math.min(Math.max(temp, 0), 2);
        const mt = Number(p.max_tokens);
        if (Number.isFinite(mt) && mt > 0) body.max_tokens = Math.floor(mt);

        if (p.reasoning_effort && ['low', 'medium', 'high'].includes(p.reasoning_effort)) {
          body.reasoning_effort = p.reasoning_effort;
        }

        const res = await fetch(url, {
          method: 'POST',
          headers,
          body: JSON.stringify(body),
          signal,
        });

        if (!res.ok) {
          let detail = '';
          try {
            const txt = await res.text();
            try {
              const j = JSON.parse(txt);
              detail = (j && j.error && j.error.message) || (j && j.message) || '';
            } catch (e) {
              detail = txt.slice(0, 200);
            }
          } catch (e) { /* 忽略 */ }
          throw new Error(`HTTP ${res.status}${detail ? ' - ' + detail : ''}`);
        }

        const ct = (res.headers.get('content-type') || '').toLowerCase();

        if (!ct.includes('event-stream') && !ct.includes('ndjson')) {
          const txt = await res.text();
          let json;
          try { json = JSON.parse(txt); } catch (e) { throw new Error('响应不是有效的 JSON'); }
          const choice = json && json.choices && json.choices[0];
          const msg = (choice && choice.message) || {};
          if (msg.reasoning_content && onReasoning) onReasoning(msg.reasoning_content);
          else if (msg.reasoning && onReasoning) onReasoning(msg.reasoning);
          const content = msg.content || (choice && choice.text) || '';
          if (content) onDelta(content);
          return;
        }

        if (!res.body) throw new Error('当前浏览器不支持流式响应读取');

        const reader = res.body.getReader();
        const decoder = new TextDecoder('utf-8');
        let buf = '';

        for (; ;) {
          const { done, value } = await reader.read();
          if (done) break;
          buf += decoder.decode(value, { stream: true });

          const lines = buf.split(/\r?\n/);
          buf = lines.pop() || '';

          for (const line of lines) {
            const t = line.trim();
            if (!t || t.startsWith(':')) continue;
            if (!t.startsWith('data:')) continue;

            const data = t.slice(5).trim();
            if (data === '[DONE]') return;
            if (!data) continue;

            let j;
            try { j = JSON.parse(data); } catch (e) { continue; }

            const choice = j && j.choices && j.choices[0];
            if (!choice) continue;

            const d = choice.delta || choice.message || {};

            const dr = typeof d.reasoning_content === 'string' && d.reasoning_content
              ? d.reasoning_content
              : (typeof d.reasoning === 'string' && d.reasoning ? d.reasoning : '');
            if (dr && onReasoning) onReasoning(dr);

            const dc = typeof d.content === 'string' ? d.content
              : (typeof choice.text === 'string' ? choice.text : '');
            if (dc) onDelta(dc);
          }
        }
      }

      /* ==================== 完成流程 ==================== */
      function setBusyUI(on) {
        busy = on;
        els.btnSend.style.display = on ? 'none' : '';
        els.btnStop.style.display = on ? '' : 'none';
        els.btnSend.disabled = on;
        els.input.disabled = on;
      }

      async function runCompletion(conv, fromNodeId) {
        setBusyUI(true);

        const wrap = document.createElement('div');
        wrap.className = 'msg msg-assistant';
        const avatar = document.createElement('div');
        avatar.className = 'avatar';
        avatar.textContent = 'AI';
        const msgWrap = document.createElement('div');
        msgWrap.className = 'msg-wrap';

        const body = document.createElement('div');
        body.className = 'msg-body';
        body.innerHTML = '<div class="typing"><i></i><i></i><i></i></div>';
        msgWrap.appendChild(body);

        const actions = document.createElement('div');
        actions.className = 'msg-actions';
        msgWrap.appendChild(actions);

        wrap.appendChild(avatar);
        wrap.appendChild(msgWrap);
        els.messages.appendChild(wrap);
        stickToBottom = true;
        scrollToBottom();

        let thinkBlock = null;
        let thinkBodyEl = null;
        let thinkStatusEl = null;
        let thinkMetaEl = null;
        let userToggledThink = false;
        let reasoningFinished = false;

        const ensureThinkBlock = () => {
          if (thinkBlock) return;
          thinkBlock = document.createElement('div');
          thinkBlock.className = 'think-block open';

          const head = document.createElement('div');
          head.className = 'think-head';
          head.innerHTML = CHEVRON_SVG;

          thinkStatusEl = document.createElement('span');
          thinkStatusEl.className = 'think-status';
          thinkStatusEl.innerHTML = '思考中<span class="dots"><span>.</span><span>.</span><span>.</span></span>';
          head.appendChild(thinkStatusEl);

          thinkMetaEl = document.createElement('span');
          thinkMetaEl.className = 'think-meta';
          head.appendChild(thinkMetaEl);

          head.addEventListener('click', () => {
            userToggledThink = true;
            thinkBlock.classList.toggle('open');
          });

          thinkBodyEl = document.createElement('div');
          thinkBodyEl.className = 'think-body';

          thinkBlock.appendChild(head);
          thinkBlock.appendChild(thinkBodyEl);
          msgWrap.insertBefore(thinkBlock, body);
        };

        let raw = '';
        let reasoning = '';
        let rafPending = false;

        const paint = () => {
          if (reasoning) {
            ensureThinkBlock();
            if (thinkBodyEl.textContent !== reasoning) {
              thinkBodyEl.textContent = reasoning;
              thinkBodyEl.scrollTop = thinkBodyEl.scrollHeight;
            }
            const rT = estimateTokens(reasoning);
            thinkMetaEl.textContent = fmtNum(rT) + ' tokens';
          }

          if (raw) {
            const md = document.createElement('div');
            md.className = 'md';
            md.innerHTML = renderMarkdown(raw);
            // 流式过程中不折叠长代码块，避免反复跳动
            postRender(md, { highlight: false, allowCollapse: false });
            if (!reasoningFinished && reasoning) {
              // 思考中，不显示正文光标
            } else {
              const cur = document.createElement('span');
              cur.className = 'cursor';
              md.appendChild(cur);
            }
            body.replaceChildren(md);
          } else if (!reasoning) {
            body.innerHTML = '<div class="typing"><i></i><i></i><i></i></div>';
          } else {
            body.innerHTML = '';
          }

          if (stickToBottom) scrollToBottom();
        };

        const schedule = () => {
          if (rafPending) return;
          rafPending = true;
          requestAnimationFrame(() => {
            rafPending = false;
            paint();
          });
        };

        const markReasoningDone = () => {
          if (reasoningFinished || !reasoning) return;
          reasoningFinished = true;
          const rT = estimateTokens(reasoning);
          if (thinkStatusEl) {
            thinkStatusEl.textContent = '思考过程';
          }
          if (thinkMetaEl) thinkMetaEl.textContent = fmtNum(rT) + ' tokens';
          if (!userToggledThink && thinkBlock) thinkBlock.classList.remove('open');
        };

        abortController = new AbortController();
        let errored = false;
        let errorMsg = '';

        try {
          await streamChat(
            toApiMessages(conv, fromNodeId),
            abortController.signal,
            delta => {
              raw += delta;
              if (reasoning && !reasoningFinished) markReasoningDone();
              schedule();
            },
            rdelta => {
              reasoning += rdelta;
              schedule();
            }
          );
        } catch (err) {
          if (err && err.name === 'AbortError') {
            // 保留已生成部分
          } else {
            errored = true;
            errorMsg = (err && err.message) ? err.message : '未知错误';
            console.error('请求失败:', err);
          }
        } finally {
          abortController = null;
          setBusyUI(false);
        }

        markReasoningDone();

        if (raw) {
          const md = document.createElement('div');
          md.className = 'md';
          md.innerHTML = renderMarkdown(raw);
          // 最终渲染：允许折叠长代码块
          postRender(md, { highlight: true, allowCollapse: true });
          body.replaceChildren(md);

          const aid = genId();
          const node = {
            id: aid,
            role: 'assistant',
            content: raw,
            images: [],
            parentId: fromNodeId,
            createdAt: new Date().toISOString(),
            tokens: estimateTokens(raw),
          };
          if (reasoning) {
            node.reasoning = reasoning;
            node.reasoning_tokens = estimateTokens(reasoning);
          }

          conv.nodes[aid] = node;
          conv.children[aid] = [];
          if (!conv.children[fromNodeId]) conv.children[fromNodeId] = [];
          conv.children[fromNodeId].push(aid);
          conv.activeLeafId = aid;

          wrap.dataset.nodeId = aid;

          const siblings = conv.children[fromNodeId] || [];
          if (siblings.length > 1) {
            const nav = makeBranchNav(conv, node, siblings);
            msgWrap.insertBefore(nav, thinkBlock && thinkBlock.parentNode === msgWrap ? thinkBlock : body);
          }

          const copyBtn = document.createElement('button');
          copyBtn.type = 'button';
          copyBtn.className = 'act-btn';
          copyBtn.textContent = '复制';
          copyBtn.addEventListener('click', async () => {
            const ok = await copyText(raw);
            copyBtn.textContent = ok ? '已复制 ✓' : '复制失败';
            copyBtn.classList.toggle('ok', ok);
            setTimeout(() => {
              copyBtn.textContent = '复制';
              copyBtn.classList.remove('ok');
            }, 1500);
          });

          const regenBtn = document.createElement('button');
          regenBtn.type = 'button';
          regenBtn.className = 'act-btn';
          regenBtn.textContent = '重新生成';
          regenBtn.addEventListener('click', () => regenerateAt(aid));

          actions.appendChild(copyBtn);
          actions.appendChild(regenBtn);
          actions.appendChild(makeTokenBadge(node));

          saveState();
          renderConvList();
          updateTokenStats();
          if (stickToBottom) scrollToBottom();
        } else if (errored) {
          body.innerHTML = '<div class="msg-error">请求失败：' + escapeHtml(errorMsg) + '</div>';
          toast('请求失败：' + errorMsg, 'error');
        } else {
          if (reasoning) {
            const aid = genId();
            const node = {
              id: aid,
              role: 'assistant',
              content: '',
              reasoning,
              reasoning_tokens: estimateTokens(reasoning),
              images: [],
              parentId: fromNodeId,
              createdAt: new Date().toISOString(),
              tokens: 0,
            };
            conv.nodes[aid] = node;
            conv.children[aid] = [];
            if (!conv.children[fromNodeId]) conv.children[fromNodeId] = [];
            conv.children[fromNodeId].push(aid);
            conv.activeLeafId = aid;
            wrap.dataset.nodeId = aid;
            body.innerHTML = '<div class="msg-error">模型只返回了思考过程，没有输出正文。</div>';
            saveState();
            renderConvList();
            updateTokenStats();
          } else {
            wrap.remove();
          }
        }

        els.input.focus();
      }

      /* ==================== 发送消息 ==================== */
      async function sendMessage() {
        if (busy) return;
        const text = els.input.value.trim();
        const images = pendingImages.slice();
        if (!text && !images.length) return;

        let conv = currentConv();
        if (!conv) conv = newConversation();
        if (!conv) return;

        const uid = genId();
        const parentId = conv.activeLeafId || 'root';
        const userTokens = estimateTokens(text) + (images.length ? images.length * IMG_TOKEN_EST : 0);

        conv.nodes[uid] = {
          id: uid,
          role: 'user',
          content: text,
          images: images.length ? images : [],
          parentId,
          createdAt: new Date().toISOString(),
          tokens: userTokens,
        };
        conv.children[uid] = [];
        if (!conv.children[parentId]) conv.children[parentId] = [];
        conv.children[parentId].push(uid);
        conv.activeLeafId = uid;

        els.input.value = '';
        els.input.style.height = 'auto';
        pendingImages = [];
        renderImagePreview();
        saveState();
        renderConvList();
        renderMessages();

        await runCompletion(conv, uid);
      }

      /* ==================== 重新生成 ==================== */
      async function regenerateAt(assistantNodeId) {
        const conv = currentConv();
        if (!conv || busy) return;
        const node = conv.nodes[assistantNodeId];
        if (!node || node.role !== 'assistant') return;

        const parentId = node.parentId;
        if (!parentId || parentId === 'root') return;

        await runCompletion(conv, parentId);
      }

      /* ==================== 编辑消息（创建分支） ==================== */
      function enableEdit(msgEl, nodeId) {
        const conv = currentConv();
        if (!conv || busy) return;
        const node = conv.nodes[nodeId];
        if (!node || node.role !== 'user') return;

        const body = msgEl.querySelector('.msg-body');
        if (!body || body.querySelector('.edit-box')) return;

        const textEl = body.querySelector('.user-text');
        const actions = msgEl.querySelector('.msg-actions');
        if (!textEl) return;

        const box = document.createElement('div');
        box.className = 'edit-box';

        const ta = document.createElement('textarea');
        ta.className = 'edit-textarea';
        ta.value = node.content || '';
        ta.rows = 2;

        const btnRow = document.createElement('div');
        btnRow.className = 'edit-actions';

        const hint = document.createElement('span');
        hint.className = 'edit-hint';
        hint.textContent = 'Esc 取消 · Ctrl+Enter 发送 · 编辑会创建新分支';

        const cancelBtn = document.createElement('button');
        cancelBtn.type = 'button';
        cancelBtn.className = 'edit-btn';
        cancelBtn.textContent = '取消';

        const saveBtn = document.createElement('button');
        saveBtn.type = 'button';
        saveBtn.className = 'edit-btn primary';
        saveBtn.textContent = '发送';

        btnRow.append(hint, cancelBtn, saveBtn);
        box.append(ta, btnRow);

        textEl.style.display = 'none';
        if (actions) actions.style.display = 'none';
        body.appendChild(box);

        const autoSize = () => {
          ta.style.height = 'auto';
          ta.style.height = Math.min(ta.scrollHeight, 260) + 'px';
        };
        autoSize();
        ta.focus();
        try {
          ta.setSelectionRange(ta.value.length, ta.value.length);
        } catch (e) { /* 忽略 */ }

        ta.addEventListener('input', autoSize);

        const cleanup = () => {
          box.remove();
          textEl.style.display = '';
          if (actions) actions.style.display = '';
        };

        cancelBtn.addEventListener('click', cleanup);

        saveBtn.addEventListener('click', () => {
          const newContent = ta.value.trim();
          if (!newContent && !(node.images && node.images.length)) {
            toast('内容不能为空', 'warn');
            return;
          }
          if (newContent === (node.content || '')) {
            cleanup();
            return;
          }
          cleanup();
          editMessageBranch(nodeId, newContent);
        });

        ta.addEventListener('keydown', e => {
          if (e.key === 'Escape') {
            e.preventDefault();
            cleanup();
          } else if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
            e.preventDefault();
            saveBtn.click();
          }
        });
      }

      async function editMessageBranch(originalNodeId, newContent) {
        const conv = currentConv();
        if (!conv || busy) return;
        const orig = conv.nodes[originalNodeId];
        if (!orig) return;

        const newId = genId();
        const parentId = orig.parentId;
        const imgList = Array.isArray(orig.images) ? orig.images.slice() : [];

        conv.nodes[newId] = {
          id: newId,
          role: 'user',
          content: newContent,
          images: imgList,
          parentId,
          createdAt: new Date().toISOString(),
          tokens: estimateTokens(newContent) + (imgList.length ? imgList.length * IMG_TOKEN_EST : 0),
        };
        conv.children[newId] = [];

        const siblings = conv.children[parentId] || [];
        const idx = siblings.indexOf(originalNodeId);
        if (idx >= 0) siblings.splice(idx + 1, 0, newId);
        else siblings.push(newId);
        conv.children[parentId] = siblings;

        conv.activeLeafId = newId;
        saveState();
        renderConvList();
        renderMessages();

        await runCompletion(conv, newId);
      }

      /* ==================== 设置弹窗 ==================== */
      function field(labelText, name, type, placeholder, value, opts = {}) {
        const label = document.createElement('label');
        label.className = 'field' + (opts.full ? ' full' : '');

        const span = document.createElement('span');
        span.className = 'field-label';
        span.textContent = labelText;

        const input = document.createElement('input');
        input.name = name;
        input.type = type;
        input.placeholder = placeholder;
        input.value = value === undefined || value === null ? '' : String(value);
        input.autocomplete = 'off';
        if (opts.step) input.step = opts.step;
        if (opts.min !== undefined) input.min = opts.min;
        if (opts.max !== undefined) input.max = opts.max;

        label.append(span, input);
        return label;
      }

      function selectField(labelText, name, value, options, opts = {}) {
        const label = document.createElement('label');
        label.className = 'field' + (opts.full ? ' full' : '');

        const span = document.createElement('span');
        span.className = 'field-label';
        span.textContent = labelText;

        const sel = document.createElement('select');
        sel.name = name;
        options.forEach(o => {
          const opt = document.createElement('option');
          opt.value = o.value;
          opt.textContent = o.label;
          if (o.value === value) opt.selected = true;
          sel.appendChild(opt);
        });

        label.append(span, sel);
        return label;
      }

      function syncDraftFromDOM() {
        if (!draft) return;
        const sysEl = els.settingsForm.elements.system_prompt;
        if (sysEl) draft.system_prompt = sysEl.value;

        draft.providers = Array.from(els.providerRows.querySelectorAll('.provider-row')).map((row, i) => {
          const get = sel => {
            const el = row.querySelector(sel);
            return el ? String(el.value).trim() : '';
          };
          const tempRaw = parseFloat(get('[name="temperature"]'));
          const mtRaw = parseInt(get('[name="max_tokens"]'), 10);
          const re = get('[name="reasoning_effort"]');
          return {
            name: get('[name="name"]') || ('服务商' + (i + 1)),
            base_url: get('[name="base_url"]'),
            api_key: get('[name="api_key"]'),
            model: get('[name="model"]') || 'gpt-4o-mini',
            temperature: Number.isFinite(tempRaw) ? Math.min(Math.max(tempRaw, 0), 2) : 0.7,
            max_tokens: Number.isFinite(mtRaw) && mtRaw > 0 ? mtRaw : 2048,
            reasoning_effort: ['low', 'medium', 'high'].includes(re) ? re : '',
          };
        });
      }

      function renderProviderRows() {
        if (!draft) return;
        els.providerRows.innerHTML = '';

        draft.providers.forEach((p, i) => {
          const row = document.createElement('div');
          row.className = 'provider-row';

          const head = document.createElement('div');
          head.className = 'provider-head';

          const left = document.createElement('div');
          left.className = 'provider-head-left';
          const nameEl = document.createElement('strong');
          nameEl.textContent = p.name || ('服务商 ' + (i + 1));
          left.appendChild(nameEl);
          if (i === draft.current) {
            const badge = document.createElement('span');
            badge.className = 'badge';
            badge.textContent = '默认';
            left.appendChild(badge);
          }
          head.appendChild(left);

          const actions = document.createElement('div');
          actions.className = 'provider-actions';

          const setDefaultBtn = document.createElement('button');
          setDefaultBtn.type = 'button';
          setDefaultBtn.className = 'btn-mini';
          setDefaultBtn.textContent = i === draft.current ? '当前默认' : '设为默认';
          setDefaultBtn.disabled = i === draft.current;
          setDefaultBtn.addEventListener('click', () => {
            syncDraftFromDOM();
            draft.current = i;
            renderProviderRows();
          });

          const delBtn = document.createElement('button');
          delBtn.type = 'button';
          delBtn.className = 'btn-mini danger';
          delBtn.textContent = '删除';
          delBtn.addEventListener('click', () => {
            syncDraftFromDOM();
            if (draft.providers.length <= 1) {
              toast('至少需要保留一个服务商', 'warn');
              return;
            }
            draft.providers.splice(i, 1);
            if (draft.current === i) draft.current = 0;
            else if (draft.current > i) draft.current--;
            renderProviderRows();
          });

          actions.append(setDefaultBtn, delBtn);
          head.appendChild(actions);
          row.appendChild(head);

          const grid = document.createElement('div');
          grid.className = 'provider-grid';
          grid.appendChild(field('名称', 'name', 'text', '例如：OpenAI', p.name));
          grid.appendChild(field('模型', 'model', 'text', 'gpt-4o-mini', p.model));
          grid.appendChild(field('Base URL', 'base_url', 'text', 'https://api.openai.com/v1', p.base_url, { full: true }));
          grid.appendChild(field('API Key', 'api_key', 'password', '本地服务可留空', p.api_key, { full: true }));
          grid.appendChild(field('Temperature', 'temperature', 'number', '0.7',
            p.temperature === undefined ? 0.7 : p.temperature, { step: '0.1', min: '0', max: '2' }));
          grid.appendChild(field('Max Tokens', 'max_tokens', 'number', '2048',
            p.max_tokens === undefined ? 2048 : p.max_tokens, { step: '1', min: '1' }));
          grid.appendChild(selectField('思考模式（reasoning_effort）',
            'reasoning_effort',
            p.reasoning_effort || '',
            [
              { value: '', label: '关闭（不请求思考）' },
              { value: 'low', label: '低强度' },
              { value: 'medium', label: '中强度' },
              { value: 'high', label: '高强度' },
            ],
            { full: true }));
          row.appendChild(grid);

          els.providerRows.appendChild(row);
        });
      }

      function openSettings() {
        draft = {
          system_prompt: state.system_prompt,
          providers: state.providers.map(p => ({ ...p })),
          current: state.current_provider,
        };
        els.settingsForm.elements.system_prompt.value = draft.system_prompt;
        renderProviderRows();
        els.settingsModal.classList.add('open');
      }

      function closeSettings() {
        els.settingsModal.classList.remove('open');
        draft = null;
      }

      function saveSettings() {
        if (!draft) return;
        syncDraftFromDOM();

        if (!draft.providers.length) {
          toast('至少需要一个服务商', 'warn');
          return;
        }

        state.system_prompt = (draft.system_prompt || '').trim() || DEFAULT_SYSTEM_PROMPT;
        state.providers = draft.providers;
        state.current_provider = Math.min(Math.max(draft.current, 0), draft.providers.length - 1);

        saveState();
        renderProviders();
        updateTokenStats();
        closeSettings();
        toast('设置已保存', 'success');
      }

      /* ==================== 侧边栏 ==================== */
      function openSidebar() { document.body.classList.add('sidebar-open'); }
      function closeSidebar() { document.body.classList.remove('sidebar-open'); }

      /* ==================== 事件绑定 ==================== */
      els.btnNew.addEventListener('click', () => {
        newConversation();
        closeSidebar();
      });

      els.convSearch.addEventListener('input', () => {
        convFilter = els.convSearch.value;
        renderConvList();
      });

      els.btnMenu.addEventListener('click', openSidebar);
      els.btnCloseSidebar.addEventListener('click', closeSidebar);
      els.sidebarOverlay.addEventListener('click', closeSidebar);

      els.btnTheme.addEventListener('click', () => {
        state.theme = state.theme === 'dark' ? 'light' : 'dark';
        saveState();
        applyTheme();
      });

      els.btnClear.addEventListener('click', clearCurrentConv);

      els.providerSelect.addEventListener('change', () => {
        const idx = parseInt(els.providerSelect.value, 10);
        if (Number.isFinite(idx) && idx >= 0 && idx < state.providers.length) {
          state.current_provider = idx;
          saveState();
          updateHeader();
          toast('已切换到 ' + (provider() ? provider().name : ''), 'info', 1600);
        }
      });

      els.btnSettings.addEventListener('click', openSettings);
      els.settingsClose.addEventListener('click', closeSettings);
      els.settingsSave.addEventListener('click', saveSettings);
      els.settingsForm.addEventListener('submit', e => {
        e.preventDefault();
        saveSettings();
      });

      els.settingsModal.addEventListener('click', e => {
        if (e.target === els.settingsModal) closeSettings();
      });

      document.addEventListener('keydown', e => {
        if (e.key === 'Escape' && els.settingsModal.classList.contains('open')) {
          closeSettings();
        }
      });

      els.btnAddProvider.addEventListener('click', () => {
        if (!draft) return;
        syncDraftFromDOM();
        draft.providers.push({
          ...DEFAULT_PROVIDER,
          name: '服务商 ' + (draft.providers.length + 1),
        });
        renderProviderRows();
      });

      els.resetProviders.addEventListener('click', () => {
        if (!draft) return;
        if (!confirm('将服务商列表重置为源码内置配置？')) return;
        syncDraftFromDOM();
        draft.providers = BUILTIN_PROVIDERS.map(p => ({ ...p }));
        draft.current = 0;
        renderProviderRows();
        toast('已重置，点击「保存」后生效', 'info');
      });

      els.btnSend.addEventListener('click', sendMessage);
      els.btnStop.addEventListener('click', () => {
        if (abortController) abortController.abort();
      });

      els.input.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
          e.preventDefault();
          sendMessage();
        }
      });

      els.input.addEventListener('input', () => {
        els.input.style.height = 'auto';
        els.input.style.height = Math.min(els.input.scrollHeight, 200) + 'px';
      });

      els.btnImage.addEventListener('click', () => els.fileInput.click());
      els.fileInput.addEventListener('change', () => {
        addImages(els.fileInput.files);
        els.fileInput.value = '';
      });

      els.input.addEventListener('paste', e => {
        const items = e.clipboardData && e.clipboardData.items;
        if (!items) return;
        const files = [];
        for (const item of items) {
          if (item.kind === 'file' && item.type && item.type.startsWith('image/')) {
            const f = item.getAsFile();
            if (f) files.push(f);
          }
        }
        if (files.length) {
          e.preventDefault();
          addImages(files);
        }
      });

      ['dragover', 'drop'].forEach(type => {
        document.addEventListener(type, e => e.preventDefault());
      });
      els.input.addEventListener('drop', e => {
        const files = e.dataTransfer && e.dataTransfer.files;
        if (files && files.length) {
          const imgs = Array.from(files).filter(f => f.type && f.type.startsWith('image/'));
          if (imgs.length) {
            e.preventDefault();
            addImages(imgs);
          }
        }
      });

      els.messages.addEventListener('click', async e => {
        const chip = e.target.closest('.suggest-chip');
        if (chip) {
          els.input.value = chip.textContent;
          els.input.dispatchEvent(new Event('input'));
          els.input.focus();
          return;
        }

        const copyBtn = e.target.closest('.copy-btn');
        if (copyBtn) {
          const code = copyBtn.closest('.code-block')?.querySelector('code');
          if (!code) return;
          const ok = await copyText(code.textContent);
          copyBtn.textContent = ok ? '已复制 ✓' : '复制失败';
          copyBtn.classList.toggle('ok', ok);
          setTimeout(() => {
            copyBtn.textContent = '复制';
            copyBtn.classList.remove('ok');
          }, 1500);
          return;
        }

        const actBtn = e.target.closest('[data-act]');
        if (actBtn) {
          const msgEl = actBtn.closest('.msg');
          if (!msgEl) return;
          const nodeId = msgEl.dataset.nodeId;
          const conv = currentConv();
          if (!conv || !nodeId) return;
          const node = conv.nodes[nodeId];
          if (!node) return;

          if (actBtn.dataset.act === 'copy-msg') {
            const ok = await copyText(node.content || '');
            actBtn.textContent = ok ? '已复制 ✓' : '复制失败';
            actBtn.classList.toggle('ok', ok);
            setTimeout(() => {
              actBtn.textContent = '复制';
              actBtn.classList.remove('ok');
            }, 1500);
          } else if (actBtn.dataset.act === 'edit') {
            enableEdit(msgEl, nodeId);
          } else if (actBtn.dataset.act === 'regen') {
            regenerateAt(nodeId);
          }
        }
      });

      els.messages.addEventListener('scroll', () => {
        stickToBottom = isNearBottom();
        els.btnScrollBottom.classList.toggle('show', !stickToBottom);
      }, { passive: true });

      els.btnScrollBottom.addEventListener('click', () => {
        stickToBottom = true;
        scrollToBottom(true);
        els.btnScrollBottom.classList.remove('show');
      });

      if (window.visualViewport) {
        let vvTimer = null;
        window.visualViewport.addEventListener('resize', () => {
          clearTimeout(vvTimer);
          vvTimer = setTimeout(() => {
            if (stickToBottom) scrollToBottom();
          }, 120);
        });
      }

      let lastWidth = window.innerWidth;
      window.addEventListener('resize', () => {
        if (window.innerWidth !== lastWidth) {
          lastWidth = window.innerWidth;
          if (window.innerWidth > 860) closeSidebar();
        }
      });

      let touchStartX = 0, touchStartY = 0, touchTracking = false;
      document.addEventListener('touchstart', e => {
        if (!document.body.classList.contains('sidebar-open')) return;
        const t = e.touches[0];
        touchStartX = t.clientX;
        touchStartY = t.clientY;
        touchTracking = true;
      }, { passive: true });

      document.addEventListener('touchend', e => {
        if (!touchTracking) return;
        touchTracking = false;
        if (!document.body.classList.contains('sidebar-open')) return;
        const t = e.changedTouches[0];
        const dx = t.clientX - touchStartX;
        const dy = Math.abs(t.clientY - touchStartY);
        if (dx < -60 && dy < 60) closeSidebar();
      }, { passive: true });

      /* ==================== 初始化 ==================== */
      applyTheme();
      renderProviders();
      renderConvList();
      renderMessages();
      updateTokenStats();
      els.input.focus();
    })();
  </script>
</body>

</html>
