<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b0d12" media="(prefers-color-scheme: dark)">
  <title>AI 对话</title>
  <link id="hljs-light" rel="stylesheet"
    href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github.min.css">
  <link id="hljs-dark" rel="stylesheet"
    href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark.min.css" disabled>
  <style>
    /* ==================== 设计变量 ==================== */
    :root {
      color-scheme: light;
      --bg: #f5f6fa;
      --bg-side: #ffffff;
      --bg-card: #ffffff;
      --bg-hover: #f2f3f7;
      --bg-active: #eef1ff;
      --bg-input: #ffffff;
      --border: #e6e8ef;
      --border-strong: #d8dbe4;
      --text: #14161c;
      --text-dim: #6b7280;
      --text-mute: #9ca3af;
      --accent: #5b6ef5;
      --accent-hover: #4a5ee8;
      --accent-soft: #eef1ff;
      --danger: #ef4444;
      --success: #16a34a;
      --code-bg: #f7f8fa;
      --inline-code: #f0f1f5;
      --shadow-sm: 0 1px 2px rgba(16, 24, 40, .06);
      --shadow: 0 4px 16px rgba(16, 24, 40, .08);
      --shadow-lg: 0 20px 50px rgba(16, 24, 40, .16);
      --grad-brand: linear-gradient(135deg, #5b6ef5, #8b5cf6);
      --grad-user: linear-gradient(135deg, #5b6ef5, #7c5cf6);
      --think-bg: #fbfbfe;
      --think-border: #e3e5f0;
      --sidebar-w: 280px;
    }

    [data-theme="dark"] {
      color-scheme: dark;
      --bg: #0b0d12;
      --bg-side: #111318;
      --bg-card: #171a21;
      --bg-hover: #1d2129;
      --bg-active: #1f2740;
      --bg-input: #171a21;
      --border: #262a34;
      --border-strong: #333846;
      --text: #e8eaed;
      --text-dim: #9aa1ad;
      --text-mute: #6b7280;
      --accent: #6b7cff;
      --accent-hover: #7f8dff;
      --accent-soft: #1a2036;
      --danger: #f05252;
      --success: #34d399;
      --code-bg: #0d1015;
      --inline-code: #22262f;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, .5);
      --shadow: 0 4px 16px rgba(0, 0, 0, .45);
      --shadow-lg: 0 20px 50px rgba(0, 0, 0, .6);
      --grad-brand: linear-gradient(135deg, #4a5ee8, #7c3aed);
      --grad-user: linear-gradient(135deg, #4a5ee8, #6d3fe0);
      --think-bg: #131620;
      --think-border: #232838;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    * {
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
    }

    body {
      font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }

    ::selection {
      background: var(--accent);
      color: #fff;
    }

    button {
      font: inherit;
      color: inherit;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    input,
    textarea,
    select {
      font: inherit;
    }

    body,
    #sidebar,
    .conv-item,
    .msg-body,
    .code-block,
    .thumb,
    #settingsCard,
    .provider-row,
    #input,
    #inputCard,
    .icon-btn,
    .act-btn,
    .suggest-chip,
    #imagePreview {
      transition: background-color .22s ease, color .22s ease, border-color .22s ease;
    }

    /* 滚动条 */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border-strong);
      border-radius: 4px;
      border: 2px solid transparent;
      background-clip: content-box;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--text-mute);
      background-clip: content-box;
    }

    /* ==================== 布局 ==================== */
    #app {
      display: flex;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    /* ==================== 侧边栏 ==================== */
    #sidebar {
      width: var(--sidebar-w);
      min-width: var(--sidebar-w);
      background: var(--bg-side);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      height: 100%;
      z-index: 60;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px 16px 12px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: .2px;
    }

    .brand .logo {
      width: 34px;
      height: 34px;
      border-radius: 11px;
      background: var(--grad-brand);
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 16px;
      box-shadow: 0 6px 16px rgba(91, 110, 245, .35);
      flex-shrink: 0;
    }

    .brand .brand-sub {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-mute);
      letter-spacing: 0;
    }

    #btnCloseSidebar {
      display: none;
      margin-left: auto;
    }

    #btnNew {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      margin: 4px 12px 10px;
      padding: 11px;
      border: none;
      border-radius: 12px;
      background: var(--grad-brand);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(91, 110, 245, .28);
      transition: transform .18s, box-shadow .18s, filter .18s;
    }

    #btnNew:hover {
      transform: translateY(-1px);
      box-shadow: 0 9px 22px rgba(91, 110, 245, .36);
      filter: brightness(1.04);
    }

    #btnNew:active {
      transform: translateY(0) scale(.99);
    }

    .search-wrap {
      position: relative;
      margin: 0 12px 8px;
    }

    .search-wrap svg {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-mute);
      pointer-events: none;
    }

    #convSearch {
      width: 100%;
      padding: 8px 10px 8px 32px;
      border-radius: 10px;
      border: 1px solid transparent;
      background: var(--bg-hover);
      color: var(--text);
      font-size: 13px;
      outline: none;
      transition: border-color .15s, background-color .15s;
    }

    #convSearch::placeholder {
      color: var(--text-mute);
    }

    #convSearch:focus {
      border-color: var(--accent);
      background: var(--bg-card);
    }

    #convList {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 4px 10px 10px;
    }

    .conv-item {
      position: relative;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 9px 10px;
      border-radius: 10px;
      cursor: pointer;
      margin-bottom: 2px;
      color: var(--text-dim);
    }

    .conv-item:hover {
      background: var(--bg-hover);
      color: var(--text);
    }

    .conv-item.active {
      background: var(--bg-active);
      color: var(--accent);
    }

    .conv-icon {
      flex-shrink: 0;
      display: flex;
      opacity: .8;
    }

    .conv-title {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 13.5px;
    }

    .conv-item.active .conv-title {
      font-weight: 600;
    }

    .conv-del {
      flex-shrink: 0;
      border: none;
      background: none;
      color: var(--text-mute);
      cursor: pointer;
      font-size: 11px;
      width: 22px;
      height: 22px;
      border-radius: 7px;
      display: grid;
      place-items: center;
      opacity: 0;
      transition: opacity .15s, background-color .15s, color .15s;
    }

    .conv-item:hover .conv-del {
      opacity: 1;
    }

    .conv-del:hover {
      color: var(--danger);
      background: color-mix(in srgb, var(--danger) 14%, transparent);
    }

    .conv-empty {
      color: var(--text-mute);
      text-align: center;
      padding: 30px 12px;
      font-size: 13px;
    }

    #sidebar-footer {
      border-top: 1px solid var(--border);
      padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
      display: flex;
      gap: 8px;
    }

    #sidebar-footer select {
      flex: 1;
      min-width: 0;
      background: var(--bg-card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 13px;
      outline: none;
      cursor: pointer;
    }

    #sidebar-footer select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      flex-shrink: 0;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-dim);
      border-radius: 10px;
      cursor: pointer;
      font-size: 15px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all .15s;
    }

    .icon-btn:hover {
      color: var(--accent);
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .icon-btn.ghost {
      border-color: transparent;
      background: transparent;
    }

    .icon-btn.ghost:hover {
      background: var(--bg-hover);
    }

    /* ==================== 主区域 ==================== */
    #main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      height: 100%;
      position: relative;
    }

    #chatHeader {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      background: color-mix(in srgb, var(--bg-card) 78%, transparent);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      z-index: 20;
    }

    #btnMenu {
      display: none;
    }

    #headerLeft {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex: 1;
    }

    #headerLeft .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 0 3px rgba(34, 197, 94, .16);
      flex-shrink: 0;
    }

    .header-meta {
      display: flex;
      flex-direction: column;
      min-width: 0;
      line-height: 1.25;
    }

    .header-meta .model {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .header-meta .provider-name {
      font-size: 11.5px;
      color: var(--text-mute);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .header-actions {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
    }

    /* ==================== 消息区 ==================== */
    #messages {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 20px 0 10px;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
    }

    .msg {
      display: flex;
      gap: 12px;
      max-width: 880px;
      margin: 0 auto;
      padding: 9px 20px;
      animation: fadeUp .24s ease both;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .avatar {
      width: 34px;
      height: 34px;
      min-width: 34px;
      border-radius: 11px;
      display: grid;
      place-items: center;
      font-size: 12.5px;
      font-weight: 700;
      color: #fff;
      margin-top: 2px;
      user-select: none;
    }

    .msg-user .avatar {
      background: var(--grad-user);
      box-shadow: 0 4px 12px rgba(91, 110, 245, .28);
    }

    .msg-assistant .avatar {
      background: linear-gradient(135deg, #8b5cf6, #d946ef);
      box-shadow: 0 4px 12px rgba(139, 92, 246, .28);
    }

    .msg-wrap {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .msg-user .msg-wrap {
      align-items: flex-end;
    }

    .msg-body {
      min-width: 0;
      max-width: 100%;
      word-break: break-word;
      overflow-wrap: anywhere;
    }

    .msg-user .msg-body {
      background: var(--grad-user);
      color: #fff;
      border-radius: 16px 6px 16px 16px;
      padding: 10px 15px;
      max-width: 78%;
      box-shadow: 0 6px 18px rgba(91, 110, 245, .22);
    }

    .user-text {
      white-space: pre-wrap;
      font-size: 14.5px;
    }

    .msg-assistant .msg-body {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 6px 16px 16px 16px;
      padding: 12px 16px;
      box-shadow: var(--shadow-sm);
      font-size: 14.5px;
    }

    .msg-images {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }

    .msg-images img {
      max-width: 220px;
      max-height: 170px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, .3);
      object-fit: cover;
      display: block;
    }

    /* ==================== 思考块 ==================== */
    .think-block {
      margin-bottom: 8px;
      border: 1px solid var(--think-border);
      border-radius: 12px;
      background: var(--think-bg);
      overflow: hidden;
      animation: fadeUp .22s ease;
    }

    .think-head {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      cursor: pointer;
      font-size: 12.5px;
      color: var(--text-dim);
      user-select: none;
      transition: color .15s, background-color .15s;
    }

    .think-head:hover {
      color: var(--accent);
      background: var(--bg-hover);
    }

    .think-chevron {
      flex-shrink: 0;
      transition: transform .22s cubic-bezier(.3, .8, .3, 1);
    }

    .think-block.open .think-chevron {
      transform: rotate(90deg);
    }

    .think-status {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 500;
    }

    .think-status .dots span {
      display: inline-block;
      animation: thinkDots 1.4s infinite;
    }

    .think-status .dots span:nth-child(2) {
      animation-delay: .2s;
    }

    .think-status .dots span:nth-child(3) {
      animation-delay: .4s;
    }

    @keyframes thinkDots {

      0%,
      60%,
      100% {
        opacity: .3;
      }

      30% {
        opacity: 1;
      }
    }

    .think-meta {
      flex-shrink: 0;
      font-size: 11px;
      color: var(--text-mute);
      font-variant-numeric: tabular-nums;
    }

    .think-body {
      display: none;
      padding: 8px 14px 12px;
      border-top: 1px dashed var(--think-border);
      font-size: 13px;
      line-height: 1.65;
      color: var(--text-dim);
      white-space: pre-wrap;
      word-break: break-word;
      overflow-wrap: anywhere;
      max-height: 42vh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .think-block.open .think-body {
      display: block;
    }

    .think-empty {
      color: var(--text-mute);
      font-style: italic;
    }

    /* ==================== 分支导航 ==================== */
    .branch-nav {
      display: inline-flex;
      align-items: center;
      gap: 1px;
      padding: 0 3px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 999px;
      box-shadow: var(--shadow-sm);
      font-size: 11px;
      color: var(--text-dim);
      user-select: none;
      align-self: flex-start;
      height: 20px;
    }

    .msg-user .branch-nav {
      align-self: flex-end;
    }

    .branch-btn {
      width: 18px;
      height: 18px;
      border: none;
      background: transparent;
      color: var(--text-dim);
      border-radius: 50%;
      cursor: pointer;
      display: grid;
      place-items: center;
      font-size: 13px;
      line-height: 1;
      padding: 0;
      transition: background-color .15s, color .15s;
    }

    .branch-btn:hover:not(:disabled) {
      background: var(--bg-hover);
      color: var(--accent);
    }

    .branch-btn:disabled {
      opacity: .3;
      cursor: default;
    }

    .branch-label {
      padding: 0 2px;
      font-variant-numeric: tabular-nums;
      font-weight: 600;
      font-size: 10.5px;
      letter-spacing: .2px;
    }

    /* ==================== 消息操作栏 ==================== */
    .msg-actions {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 5px;
      min-height: 20px;
    }

    .act-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-mute);
      border-radius: 6px;
      padding: 0 7px;
      height: 20px;
      font-size: 11px;
      line-height: 1;
      cursor: pointer;
      white-space: nowrap;
      transition: color .15s, border-color .15s, background-color .15s;
    }

    .act-btn:hover {
      color: var(--accent);
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .act-btn.ok {
      color: var(--success);
      border-color: color-mix(in srgb, var(--success) 45%, transparent);
    }

    .token-badge {
      margin-left: auto;
      display: inline-flex;
      align-items: center;
      height: 20px;
      padding: 0 7px;
      border-radius: 6px;
      background: var(--bg-hover);
      color: var(--text-mute);
      font-size: 10.5px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      user-select: none;
      cursor: help;
    }

    /* ==================== 编辑模式 ==================== */
    .edit-box {
      display: flex;
      flex-direction: column;
      gap: 8px;
      animation: fadeUp .18s ease;
    }

    .edit-textarea {
      width: 100%;
      min-height: 56px;
      max-height: 260px;
      padding: 9px 11px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, .35);
      background: rgba(0, 0, 0, .16);
      color: #fff;
      font: inherit;
      font-size: 14.5px;
      line-height: 1.5;
      resize: none;
      outline: none;
      transition: border-color .15s, background-color .15s;
    }

    .edit-textarea:focus {
      border-color: rgba(255, 255, 255, .8);
      background: rgba(0, 0, 0, .22);
    }

    .edit-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .edit-hint {
      flex: 1;
      min-width: 100px;
      font-size: 11px;
      color: rgba(255, 255, 255, .7);
    }

    .edit-btn {
      border: 1px solid rgba(255, 255, 255, .3);
      background: transparent;
      color: rgba(255, 255, 255, .92);
      border-radius: 8px;
      padding: 4px 12px;
      font-size: 12px;
      cursor: pointer;
      transition: all .15s;
    }

    .edit-btn:hover {
      background: rgba(255, 255, 255, .15);
      border-color: rgba(255, 255, 255, .65);
      color: #fff;
    }

    .edit-btn.primary {
      background: #fff;
      color: #5b6ef5;
      border-color: #fff;
      font-weight: 600;
    }

    .edit-btn.primary:hover {
      background: rgba(255, 255, 255, .92);
      color: #4a5ee8;
    }

    /* ==================== Markdown ==================== */
    .md>*:first-child {
      margin-top: 0;
    }

    .md>*:last-child {
      margin-bottom: 0;
    }

    .md p {
      margin: 8px 0;
    }

    .md h1,
    .md h2,
    .md h3,
    .md h4,
    .md h5 {
      margin: 18px 0 8px;
      line-height: 1.35;
      font-weight: 650;
    }

    .md h1 {
      font-size: 1.36em;
    }

    .md h2 {
      font-size: 1.2em;
    }

    .md h3 {
      font-size: 1.08em;
    }

    .md h4,
    .md h5 {
      font-size: 1em;
    }

    .md ul,
    .md ol {
      padding-left: 1.45em;
      margin: 8px 0;
    }

    .md li {
      margin: 3px 0;
    }

    .md li::marker {
      color: var(--text-mute);
    }

    .md a {
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px solid color-mix(in srgb, var(--accent) 40%, transparent);
    }

    .md a:hover {
      border-bottom-color: var(--accent);
    }

    .md blockquote {
      margin: 10px 0;
      padding: 6px 14px;
      border-left: 3px solid var(--accent);
      background: var(--accent-soft);
      color: var(--text-dim);
      border-radius: 0 8px 8px 0;
    }

    .md blockquote p {
      margin: 4px 0;
    }

    .md hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 16px 0;
    }

    .md table {
      border-collapse: collapse;
      margin: 10px 0;
      font-size: 13.5px;
      display: block;
      overflow-x: auto;
      max-width: 100%;
      -webkit-overflow-scrolling: touch;
    }

    .md th,
    .md td {
      border: 1px solid var(--border);
      padding: 7px 12px;
      text-align: left;
    }

    .md th {
      background: var(--bg-hover);
      font-weight: 600;
    }

    .md img {
      max-width: 100%;
      border-radius: 10px;
    }

    .md :not(pre)>code {
      background: var(--inline-code);
      color: var(--accent);
      padding: 2px 6px;
      border-radius: 6px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Courier New", monospace;
      font-size: .88em;
    }

    /* ==================== 代码块 + 折叠 ==================== */
    .code-block {
      margin: 12px 0;
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      background: var(--code-bg);
    }

    .code-head {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 8px;
      background: var(--bg-hover);
      border-bottom: 1px solid var(--border);
    }

    /* 折叠切换按钮 */
    .code-toggle {
      flex-shrink: 0;
      width: 20px;
      height: 20px;
      border: none;
      background: transparent;
      color: var(--text-mute);
      border-radius: 5px;
      cursor: pointer;
      display: grid;
      place-items: center;
      padding: 0;
      transition: color .15s, background-color .15s;
    }

    .code-toggle:hover {
      color: var(--accent);
      background: var(--bg-card);
    }

    .code-toggle svg {
      transition: transform .22s cubic-bezier(.3, .8, .3, 1);
    }

    .code-block.collapsed .code-toggle svg {
      transform: rotate(-90deg);
    }

    .code-lang {
      flex-shrink: 0;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .6px;
      text-transform: uppercase;
      color: var(--text-mute);
    }

    .code-meta {
      flex: 1;
      min-width: 0;
      font-size: 11px;
      color: var(--text-mute);
      font-variant-numeric: tabular-nums;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .copy-btn {
      flex-shrink: 0;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-dim);
      font-size: 12px;
      padding: 3px 10px;
      border-radius: 7px;
      cursor: pointer;
      transition: all .15s;
    }

    .copy-btn:hover {
      background: var(--bg-card);
      border-color: var(--border);
      color: var(--text);
    }

    .copy-btn.ok {
      color: var(--success);
      border-color: color-mix(in srgb, var(--success) 45%, transparent);
    }

    .code-block pre {
      margin: 0;
    }

    .code-block pre code {
      display: block;
      padding: 14px;
      overflow-x: auto;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Courier New", monospace;
      font-size: 13px;
      line-height: 1.6;
      background: transparent !important;
      -webkit-overflow-scrolling: touch;
    }

    /* 折叠状态 */
    .code-block.collapsed pre {
      display: none;
    }

    .code-collapsed-hint {
      display: none;
      padding: 9px 14px;
      font-size: 12px;
      color: var(--text-mute);
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: color .15s, background-color .15s;
    }

    .code-block.collapsed .code-collapsed-hint {
      display: block;
    }

    .code-collapsed-hint:hover {
      color: var(--accent);
      background: var(--bg-hover);
    }

    .cursor {
      display: inline-block;
      width: 7px;
      height: 15px;
      margin-left: 3px;
      border-radius: 2px;
      background: var(--accent);
      vertical-align: -2px;
      animation: blink 1s steps(2, start) infinite;
    }

    @keyframes blink {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0;
      }
    }

    .typing {
      display: inline-flex;
      gap: 5px;
      padding: 6px 2px;
    }

    .typing i {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--text-mute);
      animation: bounce 1.3s infinite ease-in-out;
    }

    .typing i:nth-child(2) {
      animation-delay: .16s;
    }

    .typing i:nth-child(3) {
      animation-delay: .32s;
    }

    @keyframes bounce {

      0%,
      75%,
      100% {
        transform: translateY(0);
        opacity: .45;
      }

      35% {
        transform: translateY(-5px);
        opacity: 1;
      }
    }

    .msg-error {
      color: var(--danger);
      background: color-mix(in srgb, var(--danger) 10%, transparent);
      border: 1px solid color-mix(in srgb, var(--danger) 35%, transparent);
      padding: 10px 14px;
      border-radius: 10px;
      white-space: pre-wrap;
      font-size: 13.5px;
    }

    /* ==================== 空状态 ==================== */
    .empty {
      text-align: center;
      padding: 9vh 20px 20px;
      animation: fadeUp .35s ease both;
    }

    .empty .big-icon {
      width: 76px;
      height: 76px;
      margin: 0 auto 20px;
      border-radius: 24px;
      background: var(--grad-brand);
      color: #fff;
      font-size: 34px;
      display: grid;
      place-items: center;
      box-shadow: 0 16px 36px rgba(91, 110, 245, .35);
    }

    .empty h2 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .empty p {
      font-size: 13.5px;
      color: var(--text-dim);
      margin-bottom: 26px;
    }

    .suggest-chips {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 640px;
      margin: 0 auto;
    }

    .suggest-chip {
      padding: 11px 16px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text);
      font-size: 13px;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: all .18s;
    }

    .suggest-chip:hover {
      border-color: var(--accent);
      color: var(--accent);
      transform: translateY(-2px);
      box-shadow: var(--shadow);
    }

    /* ==================== 回到底部 ==================== */
    #btnScrollBottom {
      position: absolute;
      right: 24px;
      bottom: 140px;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-dim);
      display: grid;
      place-items: center;
      cursor: pointer;
      box-shadow: var(--shadow);
      opacity: 0;
      pointer-events: none;
      transform: translateY(8px);
      transition: opacity .2s, transform .2s, color .15s, border-color .15s;
      z-index: 15;
    }

    #btnScrollBottom.show {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    #btnScrollBottom:hover {
      color: var(--accent);
      border-color: var(--accent);
    }

    /* ==================== 输入区 ==================== */
    #inputArea {
      flex-shrink: 0;
      padding: 6px 20px calc(10px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    #inputCard {
      width: 100%;
      max-width: 880px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 8px 10px 10px;
      transition: border-color .18s, box-shadow .18s;
    }

    #inputCard:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px var(--accent-soft), var(--shadow);
    }

    #imagePreview {
      display: none;
      gap: 8px;
      flex-wrap: wrap;
      padding: 2px 2px 10px;
    }

    .thumb {
      position: relative;
      width: 64px;
      height: 64px;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--border);
      animation: fadeUp .2s ease;
    }

    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .thumb-rm {
      position: absolute;
      top: 3px;
      right: 3px;
      width: 18px;
      height: 18px;
      border: none;
      border-radius: 50%;
      background: rgba(0, 0, 0, .66);
      color: #fff;
      font-size: 10px;
      line-height: 1;
      cursor: pointer;
      display: grid;
      place-items: center;
      backdrop-filter: blur(4px);
    }

    .thumb-rm:hover {
      background: var(--danger);
    }

    .input-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }

    #input {
      flex: 1;
      min-width: 0;
      resize: none;
      border: none;
      outline: none;
      background: transparent;
      color: var(--text);
      padding: 8px 4px;
      line-height: 1.55;
      font-size: 14.5px;
      max-height: 200px;
    }

    #input::placeholder {
      color: var(--text-mute);
    }

    #input:disabled {
      opacity: .55;
    }

    #btnSend,
    #btnStop {
      width: 38px;
      height: 38px;
      flex-shrink: 0;
      border: none;
      border-radius: 11px;
      display: grid;
      place-items: center;
      cursor: pointer;
      color: #fff;
      transition: transform .15s, opacity .15s, filter .15s, box-shadow .15s;
    }

    #btnSend {
      background: var(--grad-brand);
      box-shadow: 0 4px 12px rgba(91, 110, 245, .32);
    }

    #btnSend:hover:not(:disabled) {
      transform: translateY(-1px);
      filter: brightness(1.06);
      box-shadow: 0 7px 18px rgba(91, 110, 245, .4);
    }

    #btnSend:disabled {
      opacity: .4;
      cursor: not-allowed;
      box-shadow: none;
    }

    #btnStop {
      background: var(--danger);
      box-shadow: 0 4px 12px rgba(239, 68, 68, .32);
    }

    #btnStop:hover {
      filter: brightness(1.08);
      transform: translateY(-1px);
    }

    /* ==================== 底部统计栏 ==================== */
    .input-hint {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      font-size: 11.5px;
      color: var(--text-mute);
      padding: 0 4px;
      text-align: center;
    }

    .hint-sep {
      opacity: .45;
    }

    .token-stats {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 10px;
      border-radius: 999px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      font-variant-numeric: tabular-nums;
      font-size: 11px;
      color: var(--text-dim);
      cursor: help;
      transition: border-color .15s, color .15s;
    }

    .token-stats:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .token-stats b {
      color: var(--accent);
      font-weight: 700;
    }

    /* ==================== 设置弹窗 ==================== */
    #settingsModal {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(8, 10, 16, .52);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 100;
      padding: 20px;
    }

    #settingsModal.open {
      display: flex;
      animation: fadeIn .18s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes popIn {
      from {
        opacity: 0;
        transform: scale(.96) translateY(10px);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    #settingsCard {
      width: min(680px, 100%);
      max-height: min(88vh, 880px);
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: var(--shadow-lg);
      animation: popIn .24s cubic-bezier(.2, .9, .3, 1.15);
    }

    #settingsHead {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      font-size: 15.5px;
      font-weight: 700;
    }

    #settingsClose {
      width: 30px;
      height: 30px;
      border: none;
      background: transparent;
      color: var(--text-dim);
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: all .15s;
    }

    #settingsClose:hover {
      background: var(--bg-hover);
      color: var(--text);
    }

    #settingsForm {
      flex: 1;
      overflow-y: auto;
      padding: 18px 20px;
      -webkit-overflow-scrolling: touch;
    }

    .section-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-mute);
      letter-spacing: .5px;
      text-transform: uppercase;
      margin: 4px 0 10px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .field-label {
      font-size: 12.5px;
      color: var(--text-dim);
      font-weight: 500;
    }

    .field input,
    .field textarea,
    .field select {
      width: 100%;
      background: var(--bg-card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 8px 11px;
      font-size: 13.5px;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }

    .field select {
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' width='12' height='12' fill='none' stroke='%236b7280' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><path d='m6 9 6 6 6-6'/></svg>");
      background-repeat: no-repeat;
      background-position: right 11px center;
      padding-right: 32px;
    }

    .field input:focus,
    .field textarea:focus,
    .field select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .field textarea {
      resize: vertical;
      min-height: 68px;
      line-height: 1.55;
    }

    .provider-row {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
      background: var(--bg-hover);
    }

    .provider-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }

    .provider-head-left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .provider-head-left strong {
      font-size: 14px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .badge {
      font-size: 10.5px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      flex-shrink: 0;
    }

    .provider-actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .btn-mini {
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-dim);
      border-radius: 8px;
      padding: 5px 11px;
      font-size: 12px;
      cursor: pointer;
      transition: all .15s;
    }

    .btn-mini:hover:not(:disabled) {
      border-color: var(--accent);
      color: var(--accent);
    }

    .btn-mini.danger:hover:not(:disabled) {
      border-color: var(--danger);
      color: var(--danger);
      background: color-mix(in srgb, var(--danger) 10%, transparent);
    }

    .btn-mini:disabled {
      opacity: .45;
      cursor: default;
    }

    .provider-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px 12px;
      margin-bottom: 10px;
    }

    .provider-grid .full {
      grid-column: 1 / -1;
    }

    #btnAddProvider {
      width: 100%;
      padding: 11px;
      border: 1px dashed var(--border-strong);
      background: transparent;
      color: var(--text-dim);
      border-radius: 12px;
      cursor: pointer;
      font-size: 13px;
      transition: all .15s;
    }

    #btnAddProvider:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-soft);
    }

    #settingsFoot {
      flex-shrink: 0;
      padding: 14px 20px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    #settingsSave {
      border: none;
      background: var(--grad-brand);
      color: #fff;
      padding: 10px 30px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(91, 110, 245, .32);
      transition: transform .15s, filter .15s;
    }

    #settingsSave:hover {
      filter: brightness(1.06);
      transform: translateY(-1px);
    }

    #resetProviders {
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-dim);
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 13px;
      cursor: pointer;
      transition: all .15s;
    }

    #resetProviders:hover {
      border-color: var(--danger);
      color: var(--danger);
    }

    /* ==================== Toast ==================== */
    #toastWrap {
      position: fixed;
      top: calc(18px + env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      z-index: 200;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
      pointer-events: none;
      width: max-content;
      max-width: 100vw;
    }

    .toast {
      padding: 10px 18px;
      border-radius: 12px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 13.5px;
      box-shadow: var(--shadow-lg);
      animation: toastIn .25s cubic-bezier(.2, .9, .3, 1.15);
      max-width: 86vw;
    }

    .toast.error {
      border-color: color-mix(in srgb, var(--danger) 50%, transparent);
      color: var(--danger);
    }

    .toast.success {
      border-color: color-mix(in srgb, var(--success) 50%, transparent);
      color: var(--success);
    }

    .toast.warn {
      border-color: #f59e0b;
      color: #d97706;
    }

    .toast.out {
      animation: toastOut .25s ease forwards;
    }

    @keyframes toastIn {
      from {
        opacity: 0;
        transform: translateY(-12px) scale(.96);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    @keyframes toastOut {
      to {
        opacity: 0;
        transform: translateY(-10px) scale(.97);
      }
    }

    /* ==================== 移动端遮罩 ==================== */
    #sidebarOverlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(8, 10, 16, .5);
      z-index: 55;
      opacity: 0;
      transition: opacity .25s;
    }

    /* ==================== 响应式：平板 ==================== */
    @media (max-width: 860px) {
      #sidebar {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        transform: translateX(-100%);
        transition: transform .28s cubic-bezier(.3, .8, .3, 1);
        box-shadow: none;
        padding-top: env(safe-area-inset-top);
      }

      body.sidebar-open #sidebar {
        transform: translateX(0);
        box-shadow: var(--shadow-lg);
      }

      #sidebarOverlay {
        display: block;
      }

      body.sidebar-open #sidebarOverlay {
        opacity: 1;
      }

      #btnMenu {
        display: inline-flex;
      }

      #btnCloseSidebar {
        display: inline-flex;
      }

      .msg {
        padding: 8px 14px;
      }

      .msg-user .msg-body {
        max-width: 84%;
      }

      #inputArea {
        padding-left: 12px;
        padding-right: 12px;
      }

      #btnScrollBottom {
        right: 16px;
        bottom: 130px;
      }

      .provider-grid {
        grid-template-columns: 1fr;
      }

      .empty {
        padding-top: 6vh;
      }

      .token-badge {
        margin-left: 0;
      }
    }

    /* ==================== 响应式：手机 ==================== */
    @media (max-width: 640px) {
      :root {
        --sidebar-w: 82vw;
      }

      .brand {
        padding: 12px 12px 8px;
        font-size: 14px;
      }

      .brand .logo {
        width: 30px;
        height: 30px;
        border-radius: 9px;
        font-size: 14px;
      }

      #btnNew {
        margin: 2px 10px 8px;
        padding: 10px;
        font-size: 13.5px;
        border-radius: 10px;
      }

      .search-wrap {
        margin: 0 10px 6px;
      }

      #convSearch {
        font-size: 14px;
        padding: 9px 10px 9px 32px;
      }

      #convList {
        padding: 2px 8px 8px;
      }

      .conv-item {
        padding: 10px;
        border-radius: 9px;
      }

      .conv-del {
        opacity: 1;
        width: 26px;
        height: 26px;
        font-size: 12px;
      }

      #sidebar-footer {
        padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
      }

  <!-- ==================== 设置弹窗 ==================== -->
  <div id="settingsModal">
