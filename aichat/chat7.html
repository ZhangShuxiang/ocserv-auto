      }
      /* ==================================================================
       * 21. 发送 / 重新生成 / 编辑分支
       * ================================================================== */
      async function sendMessage() {
        if (busy) return;
        const text = els.input.value.trim();
        const images = pendingImages.slice();
        if (!text && !images.length) return;
        let conv = currentConv();
        if (!conv) conv = newConversation();
        if (!conv) return;
        const parentId = conv.activeLeafId || 'root';
        const userTokens = estimateTokens(text) +
          (images.length ? images.length * CONFIG.IMG_TOKEN_EST : 0);
        const node = appendNode(conv, parentId, {
          role: 'user',
          content: text,
          images: images.length ? images : [],
          tokens: userTokens,
        });
        els.input.value = '';
        resetInputHeight();
        pendingImages = [];
        renderImagePreview();
        saveState();
        renderConvList();
        renderMessages();
        await runCompletion(conv, node.id);
      }
      async function regenerateAt(assistantNodeId) {
        const conv = currentConv();
        if (!conv || busy) return;
        const node = conv.nodes[assistantNodeId];
        if (!node || node.role !== 'assistant') return;
        const parentId = node.parentId;
        if (!parentId || parentId === 'root') {
          toast('无法重新生成：找不到对应的用户消息', 'warn');
          return;
        }
        await runCompletion(conv, parentId);
      }
      function enableEdit(msgEl, nodeId) {
        const conv = currentConv();
        if (!conv || busy) return;
        const node = conv.nodes[nodeId];
        if (!node || node.role !== 'user') return;
        const body = msgEl.querySelector('.msg-body');
        if (!body || body.querySelector('.edit-box')) return;
        const textEl = body.querySelector('.user-text');
        const actions = msgEl.querySelector('.msg-actions');
        if (!textEl) return;
        const ta = h('textarea', { class: 'edit-textarea', rows: 2 });
        ta.value = node.content || '';
        const cancelBtn = h('button', { type: 'button', class: 'edit-btn', text: '取消' });
        const saveBtn = h('button', { type: 'button', class: 'edit-btn primary', text: '发送' });
        const btnRow = h('div', { class: 'edit-actions' },
          h('span', { class: 'edit-hint', text: 'Esc 取消 · Ctrl+Enter 发送 · 编辑会创建新分支' }),
          cancelBtn, saveBtn
        );
        const box = h('div', { class: 'edit-box' }, ta, btnRow);
        textEl.style.display = 'none';
        if (actions) actions.style.display = 'none';
        body.appendChild(box);
        const autoSize = () => {
          ta.style.height = 'auto';
          ta.style.height = Math.min(ta.scrollHeight, 260) + 'px';
        };
        autoSize();
        ta.focus();
        try { ta.setSelectionRange(ta.value.length, ta.value.length); } catch (e) { /* 忽略 */ }
        ta.addEventListener('input', autoSize);
        const cleanup = () => {
          box.remove();
          textEl.style.display = '';
          if (actions) actions.style.display = '';
        };
        cancelBtn.addEventListener('click', cleanup);
        saveBtn.addEventListener('click', () => {
          const newContent = ta.value.trim();
          if (!newContent && !(node.images && node.images.length)) {
            toast('内容不能为空', 'warn');
            return;
          }
          if (newContent === (node.content || '')) {
            cleanup();
            return;
          }
          cleanup();
          editMessageBranch(nodeId, newContent);
        });
        ta.addEventListener('keydown', e => {
          if (e.key === 'Escape') {
            e.preventDefault();
            cleanup();
          } else if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
            e.preventDefault();
            saveBtn.click();
          }
        });
      }
      async function editMessageBranch(originalNodeId, newContent) {
        const conv = currentConv();
        if (!conv || busy) return;
        const orig = conv.nodes[originalNodeId];
        if (!orig) return;
        const imgList = Array.isArray(orig.images) ? orig.images.slice() : [];
        const node = appendNode(conv, orig.parentId, {
          role: 'user',
          content: newContent,
          images: imgList,
          tokens: estimateTokens(newContent) +
            (imgList.length ? imgList.length * CONFIG.IMG_TOKEN_EST : 0),
        }, { afterId: originalNodeId });
        saveState();
        renderConvList();
        renderMessages();
        await runCompletion(conv, node.id);
      }
      /* ==================================================================
       * 22. 设置弹窗
       * ================================================================== */
      function makeField({ label, name, type = 'text', value = '', placeholder = '',
        full = false, step, min, max, options }) {
        const wrap = h('label', { class: 'field' + (full ? ' full' : '') });
        wrap.appendChild(h('span', { class: 'field-label', text: label }));
        let input;
        if (options) {
          input = h('select', { name });
          for (const o of options) {
            const opt = h('option', { value: o.value, text: o.label });
            if (o.value === value) opt.selected = true;
            input.appendChild(opt);
          }
        } else {
          input = h('input', { name, type, placeholder, autocomplete: 'off' });
          input.value = value === null || value === undefined ? '' : String(value);
          if (step !== undefined) input.step = step;
          if (min !== undefined) input.min = min;
          if (max !== undefined) input.max = max;
        }
        wrap.appendChild(input);
        return wrap;
      }
      function syncDraftFromDOM() {
        if (!draft) return;
        const sysEl = els.settingsForm.elements.system_prompt;
        if (sysEl) draft.system_prompt = sysEl.value;
        draft.providers = Array.from(els.providerRows.querySelectorAll('.provider-row')).map((row, i) => {
          const get = sel => {
            const el = row.querySelector(sel);
            return el ? String(el.value).trim() : '';
          };
          const tempRaw = parseFloat(get('[name="temperature"]'));
          const mtRaw = parseInt(get('[name="max_tokens"]'), 10);
          const re = get('[name="reasoning_effort"]');
          const mode = get('[name="api_mode"]');
          const mt = Number.isFinite(mtRaw) && mtRaw > 0
            ? clamp(mtRaw, CONFIG.MAX_TOKENS_MIN, CONFIG.MAX_TOKENS_MAX)
            : CONFIG.DEFAULT_MAX_TOKENS;
          return {
            name: get('[name="name"]') || ('服务商' + (i + 1)),
            base_url: get('[name="base_url"]'),
            api_key: get('[name="api_key"]'),
            model: get('[name="model"]') || 'gpt-4o-mini',
            api_mode: mode === 'responses' ? 'responses' : 'chat',
            temperature: Number.isFinite(tempRaw) ? clamp(tempRaw, 0, 2) : 0.7,
            max_tokens: mt,
            reasoning_effort: isValidEffort(re) ? re : '',
          };
        });
      }
      function renderProviderRows() {
        if (!draft) return;
        els.providerRows.innerHTML = '';
        draft.providers.forEach((p, i) => {
          const isDefault = i === draft.current;
          const setDefaultBtn = h('button', {
            type: 'button', class: 'btn-mini',
            text: isDefault ? '当前默认' : '设为默认',
          });
          setDefaultBtn.disabled = isDefault;
          setDefaultBtn.addEventListener('click', () => {
            syncDraftFromDOM();
            draft.current = i;
            renderProviderRows();
          });
          const delBtn = h('button', { type: 'button', class: 'btn-mini danger', text: '删除' });
          delBtn.addEventListener('click', () => {
            syncDraftFromDOM();
            if (draft.providers.length <= 1) {
              toast('至少需要保留一个服务商', 'warn');
              return;
            }
            draft.providers.splice(i, 1);
            if (draft.current === i) draft.current = 0;
            else if (draft.current > i) draft.current--;
            renderProviderRows();
          });
          const head = h('div', { class: 'provider-head' },
            h('div', { class: 'provider-head-left' },
              h('strong', { text: p.name || ('服务商 ' + (i + 1)) }),
              isDefault ? h('span', { class: 'badge', text: '默认' }) : null
            ),
            h('div', { class: 'provider-actions' }, setDefaultBtn, delBtn)
          );
          const grid = h('div', { class: 'provider-grid' },
            makeField({ label: '名称', name: 'name', placeholder: '例如：OpenAI', value: p.name }),
            makeField({ label: '模型', name: 'model', placeholder: 'deepseek-flash', value: p.model }),
            makeField({
              label: '接口类型', name: 'api_mode', full: true,
              value: p.api_mode === 'responses' ? 'responses' : 'chat',
              options: [
                { value: 'chat', label: 'Chat Completions（/chat/completions）' },
                { value: 'responses', label: 'Responses（/responses）' },
              ],
            }),
            makeField({
              label: 'Base URL', name: 'base_url', full: true,
              placeholder: 'https://api.openai.com/v1', value: p.base_url,
            }),
            makeField({
              label: 'API Key', name: 'api_key', type: 'password', full: true,
              placeholder: '本地服务可留空', value: p.api_key,
            }),
            makeField({
              label: 'Temperature', name: 'temperature', type: 'number',
              placeholder: '0.7', value: p.temperature === undefined ? 0.7 : p.temperature,
              step: '0.1', min: '0', max: '2',
            }),
            makeField({
              label: `Max Tokens（${CONFIG.MAX_TOKENS_MIN}~${CONFIG.MAX_TOKENS_MAX}）`,
              name: 'max_tokens', type: 'number', placeholder: String(CONFIG.DEFAULT_MAX_TOKENS),
              value: p.max_tokens === undefined ? CONFIG.DEFAULT_MAX_TOKENS : p.max_tokens,
              step: '1', min: String(CONFIG.MAX_TOKENS_MIN), max: String(CONFIG.MAX_TOKENS_MAX),
            }),
            makeField({
              label: '思考模式（reasoning_effort）', name: 'reasoning_effort', full: true,
              value: p.reasoning_effort || '',
              options: [
                { value: '', label: '关闭（不请求思考）' },
                { value: 'low', label: '低强度' },
                { value: 'medium', label: '中强度' },
                { value: 'high', label: '高强度' },
              ],
            })
          );
          els.providerRows.appendChild(h('div', { class: 'provider-row' }, head, grid));
        });
      }
      function openSettings() {
        draft = {
          system_prompt: state.system_prompt,
          providers: state.providers.map(p => ({ ...p })),
          current: state.current_provider,
        };
        els.settingsForm.elements.system_prompt.value = draft.system_prompt;
        renderProviderRows();
        els.settingsModal.classList.add('open');
      }
      function closeSettings() {
        els.settingsModal.classList.remove('open');
        draft = null;
      }
      function saveSettings() {
        if (!draft) return;
        syncDraftFromDOM();
        if (!draft.providers.length) {
          toast('至少需要一个服务商', 'warn');
          return;
        }
        state.system_prompt = (draft.system_prompt || '').trim() || CONFIG.DEFAULT_SYSTEM_PROMPT;
        state.providers = draft.providers;
        state.current_provider = clamp(draft.current, 0, draft.providers.length - 1);
        saveState();
        renderProviders();
        updateTokenStats();
        closeSettings();
        toast('设置已保存', 'success');
      }
      /* ==================================================================
       * 23. 侧边栏
       * ================================================================== */
      const openSidebar = () => document.body.classList.add('sidebar-open');
      const closeSidebar = () => document.body.classList.remove('sidebar-open');
      /* ==================================================================
       * 24. 输入框自适应高度
       * ================================================================== */
      let inputComposing = false;
      let inputRafId = null;
      let lastInputHeight = 0;
      function applyInputHeight() {
        const el = els.input;
        const maxH = window.innerWidth <= 640 ? 140 : 200;
        if (el.value.length > CONFIG.INPUT_AUTOSIZE_MAX_LEN) {
          if (lastInputHeight !== maxH) {
            lastInputHeight = maxH;
            el.style.height = maxH + 'px';
          }
          return;
        }
        el.style.height = 'auto';
        const next = Math.min(el.scrollHeight, maxH);
        lastInputHeight = next;
        el.style.height = next + 'px';
      }
      function scheduleInputResize() {
        if (inputRafId !== null) return;
        inputRafId = requestAnimationFrame(() => {
          inputRafId = null;
          if (inputComposing) return;
          applyInputHeight();
        });
      }
      function resetInputHeight() {
        lastInputHeight = 0;
        els.input.style.height = 'auto';
        scheduleInputResize();
      }
      /* ==================================================================
       * 25. 事件绑定
       * ================================================================== */
      function bindEvents() {
        /* ---------- 侧边栏 ---------- */
        els.btnNew.addEventListener('click', () => {
          newConversation();
          closeSidebar();
        });
        els.convSearch.addEventListener('input', () => {
          convFilter = els.convSearch.value;
          renderConvList();
        });
        els.btnMenu.addEventListener('click', openSidebar);
        els.btnCloseSidebar.addEventListener('click', closeSidebar);
        els.sidebarOverlay.addEventListener('click', closeSidebar);
        /* ---------- 顶栏 ---------- */
        els.btnTheme.addEventListener('click', () => {
          state.theme = state.theme === 'dark' ? 'light' : 'dark';
          saveState();
          applyTheme();
        });
        els.btnClear.addEventListener('click', clearCurrentConv);
        /* ---------- 服务商切换 ---------- */
        els.providerSelect.addEventListener('change', () => {
          const idx = parseInt(els.providerSelect.value, 10);
          if (Number.isFinite(idx) && idx >= 0 && idx < state.providers.length) {
            state.current_provider = idx;
            saveState();
            updateHeader();
            const p = provider();
            toast('已切换到 ' + (p ? p.name : ''), 'info', 1600);
          }
        });
        /* ---------- 设置弹窗 ---------- */
        els.btnSettings.addEventListener('click', openSettings);
        els.settingsClose.addEventListener('click', closeSettings);
        els.settingsSave.addEventListener('click', saveSettings);
        els.settingsForm.addEventListener('submit', e => {
          e.preventDefault();
          saveSettings();
        });
        els.settingsModal.addEventListener('click', e => {
          if (e.target === els.settingsModal) closeSettings();
        });
        document.addEventListener('keydown', e => {
          if (e.key === 'Escape' && els.settingsModal.classList.contains('open')) {
            closeSettings();
          }
        });
        els.btnAddProvider.addEventListener('click', () => {
          if (!draft) return;
          syncDraftFromDOM();
          draft.providers.push({
            ...DEFAULT_PROVIDER,
            name: '服务商 ' + (draft.providers.length + 1),
          });
          renderProviderRows();
        });
        els.resetProviders.addEventListener('click', () => {
          if (!draft) return;
          if (!confirm('将服务商列表重置为源码内置配置？')) return;
          syncDraftFromDOM();
          draft.providers = BUILTIN_PROVIDERS.map(p => ({ ...p }));
          draft.current = 0;
          renderProviderRows();
          toast('已重置，点击「保存」后生效', 'info');
        });
        /* ---------- 输入与发送 ---------- */
        els.btnSend.addEventListener('click', sendMessage);
        els.btnStop.addEventListener('click', () => {
          if (abortController) abortController.abort();
        });
        els.input.addEventListener('keydown', e => {
          if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && e.keyCode !== 229) {
            e.preventDefault();
            sendMessage();
          }
        });
        els.input.addEventListener('compositionstart', () => { inputComposing = true; });
        els.input.addEventListener('compositionend', () => {
          inputComposing = false;
          scheduleInputResize();
        });
        els.input.addEventListener('input', scheduleInputResize);
        /* ---------- 图片 ---------- */
        els.btnImage.addEventListener('click', () => els.fileInput.click());
        els.fileInput.addEventListener('change', () => {
          addImages(els.fileInput.files);
          els.fileInput.value = '';
        });
        els.input.addEventListener('paste', e => {
          const items = e.clipboardData && e.clipboardData.items;
          if (!items) return;
          const files = [];
          for (const item of items) {
            if (item.kind === 'file' && item.type && item.type.startsWith('image/')) {
              const f = item.getAsFile();
              if (f) files.push(f);
            }
          }
          if (files.length) {
            e.preventDefault();
            addImages(files);
          }
        });
        ['dragover', 'drop'].forEach(type => {
          document.addEventListener(type, e => e.preventDefault());
        });
        els.input.addEventListener('drop', e => {
          const files = e.dataTransfer && e.dataTransfer.files;
          if (!files || !files.length) return;
          const imgs = Array.from(files).filter(f => f.type && f.type.startsWith('image/'));
          if (imgs.length) {
            e.preventDefault();
            addImages(imgs);
          }
        });
        /* ---------- 消息区事件委托 ---------- */
        els.messages.addEventListener('click', async e => {
          const chip = e.target.closest('.suggest-chip');
          if (chip) {
            els.input.value = chip.textContent;
            resetInputHeight();
            els.input.focus();
            return;
          }
          const copyBtn = e.target.closest('.copy-btn');
          if (copyBtn) {
            const code = copyBtn.closest('.code-block')?.querySelector('code');
            if (!code) return;
            await copyWithFeedback(copyBtn, code.textContent);
            return;
          }
          const actBtn = e.target.closest('[data-act]');
          if (!actBtn) return;
          const msgEl = actBtn.closest('.msg');
          if (!msgEl) return;
          const nodeId = msgEl.dataset.nodeId;
          const conv = currentConv();
          if (!conv || !nodeId) return;
          const node = conv.nodes[nodeId];
          if (!node) return;
          const act = actBtn.dataset.act;
          if (act === 'copy-msg') {
            await copyWithFeedback(actBtn, node.content || '');
          } else if (act === 'edit') {
            enableEdit(msgEl, nodeId);
          } else if (act === 'regen') {
            regenerateAt(nodeId);
          }
        });
        /* ---------- 滚动 ---------- */
        els.messages.addEventListener('scroll', () => {
          stickToBottom = isNearBottom();
          els.btnScrollBottom.classList.toggle('show', !stickToBottom);
        }, { passive: true });
        els.btnScrollBottom.addEventListener('click', () => {
          stickToBottom = true;
          scrollToBottom(true);
          els.btnScrollBottom.classList.remove('show');
        });
        /* ---------- 视口变化 ---------- */
        if (window.visualViewport) {
          let vvTimer = null;
          window.visualViewport.addEventListener('resize', () => {
            clearTimeout(vvTimer);
            vvTimer = setTimeout(() => {
              if (stickToBottom) scrollToBottom();
            }, 120);
          });
        }
        let lastWidth = window.innerWidth;
        window.addEventListener('resize', () => {
          if (window.innerWidth === lastWidth) return;
          lastWidth = window.innerWidth;
          if (window.innerWidth > 860) closeSidebar();
          lastInputHeight = 0;
          scheduleInputResize();
        });
        /* ---------- 移动端侧滑关闭 ---------- */
        let touchStartX = 0, touchStartY = 0, touchTracking = false;
        document.addEventListener('touchstart', e => {
          if (!document.body.classList.contains('sidebar-open')) return;
          const t = e.touches[0];
          touchStartX = t.clientX;
          touchStartY = t.clientY;
          touchTracking = true;
        }, { passive: true });
        document.addEventListener('touchend', e => {
          if (!touchTracking) return;
          touchTracking = false;
          if (!document.body.classList.contains('sidebar-open')) return;
          const t = e.changedTouches[0];
          const dx = t.clientX - touchStartX;
          const dy = Math.abs(t.clientY - touchStartY);
          if (dx < -60 && dy < 60) closeSidebar();
        }, { passive: true });
      }
      /* ==================================================================
       * 26. 初始化
       * ================================================================== */
      function init() {
        applyTheme();
        renderProviders();
        renderConvList();
        renderMessages();
        updateTokenStats();
        resetInputHeight();
        bindEvents();
        els.input.focus();
      }
      init();
    })();
  </script>
</body>
</html>
