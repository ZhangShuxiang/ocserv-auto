<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b0d12" media="(prefers-color-scheme: dark)">
  <title>AI 对话</title>
  <link id="hljs-light" rel="stylesheet"
    href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github.min.css">
  <link id="hljs-dark" rel="stylesheet"
    href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark.min.css" disabled>
  <style>
    /* ==================== 设计变量 ==================== */
    :root {
      color-scheme: light;
      --bg: #f5f6fa;
      --bg-side: #ffffff;
      --bg-card: #ffffff;
      --bg-hover: #f2f3f7;
      --bg-active: #eef1ff;
      --bg-input: #ffffff;
      --border: #e6e8ef;
      --border-strong: #d8dbe4;
      --text: #14161c;
      --text-dim: #6b7280;
      --text-mute: #9ca3af;
      --accent: #5b6ef5;
      --accent-hover: #4a5ee8;
      --accent-soft: #eef1ff;
      --danger: #ef4444;
      --success: #16a34a;
      --code-bg: #f7f8fa;
      --inline-code: #f0f1f5;
      --shadow-sm: 0 1px 2px rgba(16, 24, 40, .06);
      --shadow: 0 4px 16px rgba(16, 24, 40, .08);
      --shadow-lg: 0 20px 50px rgba(16, 24, 40, .16);
      --grad-brand: linear-gradient(135deg, #5b6ef5, #8b5cf6);
      --grad-user: linear-gradient(135deg, #5b6ef5, #7c5cf6);
      --think-bg: #fbfbfe;
      --think-border: #e3e5f0;
      --sidebar-w: 280px;
      --code-scroll-max: 340px;
    }
    [data-theme="dark"] {
      color-scheme: dark;
      --bg: #0b0d12;
      --bg-side: #111318;
      --bg-card: #171a21;
      --bg-hover: #1d2129;
      --bg-active: #1f2740;
      --bg-input: #171a21;
      --border: #262a34;
      --border-strong: #333846;
      --text: #e8eaed;
      --text-dim: #9aa1ad;
      --text-mute: #6b7280;
      --accent: #6b7cff;
      --accent-hover: #7f8dff;
      --accent-soft: #1a2036;
      --danger: #f05252;
      --success: #34d399;
      --code-bg: #0d1015;
      --inline-code: #22262f;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, .5);
      --shadow: 0 4px 16px rgba(0, 0, 0, .45);
      --shadow-lg: 0 20px 50px rgba(0, 0, 0, .6);
      --grad-brand: linear-gradient(135deg, #4a5ee8, #7c3aed);
      --grad-user: linear-gradient(135deg, #4a5ee8, #6d3fe0);
      --think-bg: #131620;
      --think-border: #232838;
    }
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }
    * {
      margin: 0;
      padding: 0;
    }
    html,
    body {
      height: 100%;
    }
    body {
      font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }
    ::selection {
      background: var(--accent);
      color: #fff;
    }
    button {
      font: inherit;
      color: inherit;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    input,
    textarea,
    select {
      font: inherit;
    }
    body,
    #sidebar,
    .conv-item,
    .msg-body,
    .code-block,
    .thumb,
    #settingsCard,
    .provider-row,
    #input,
    #inputCard,
    .icon-btn,
    .act-btn,
    .suggest-chip,
    #imagePreview {
      transition: background-color .22s ease, color .22s ease, border-color .22s ease;
    }
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--border-strong);
      border-radius: 4px;
      border: 2px solid transparent;
      background-clip: content-box;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--text-mute);
      background-clip: content-box;
    }
    /* ==================== 布局 ==================== */
    #app {
      display: flex;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }
    /* ==================== 侧边栏 ==================== */
    #sidebar {
      width: var(--sidebar-w);
      min-width: var(--sidebar-w);
      background: var(--bg-side);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      height: 100%;
      z-index: 60;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px 16px 12px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: .2px;
    }
    .brand .logo {
      width: 34px;
      height: 34px;
      border-radius: 11px;
      background: var(--grad-brand);
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 16px;
      box-shadow: 0 6px 16px rgba(91, 110, 245, .35);
      flex-shrink: 0;
    }
    .brand .brand-sub {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-mute);
      letter-spacing: 0;
    }
    #btnCloseSidebar {
      display: none;
      margin-left: auto;
    }
    #btnNew {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      margin: 4px 12px 10px;
      padding: 11px;
      border: none;
      border-radius: 12px;
      background: var(--grad-brand);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(91, 110, 245, .28);
      transition: transform .18s, box-shadow .18s, filter .18s;
    }
    #btnNew:hover {
      transform: translateY(-1px);
      box-shadow: 0 9px 22px rgba(91, 110, 245, .36);
      filter: brightness(1.04);
    }
    #btnNew:active {
      transform: translateY(0) scale(.99);
    }
    .search-wrap {
      position: relative;
      margin: 0 12px 8px;
    }
    .search-wrap svg {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-mute);
      pointer-events: none;
    }
    #convSearch {
      width: 100%;
      padding: 8px 10px 8px 32px;
      border-radius: 10px;
      border: 1px solid transparent;
      background: var(--bg-hover);
      color: var(--text);
      font-size: 13px;
      outline: none;
      transition: border-color .15s, background-color .15s;
    }
    #convSearch::placeholder {
      color: var(--text-mute);
    }
    #convSearch:focus {
      border-color: var(--accent);
      background: var(--bg-card);
    }
    #convList {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 4px 10px 10px;
    }
    .conv-item {
      position: relative;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 9px 10px;
      border-radius: 10px;
      cursor: pointer;
      margin-bottom: 2px;
      color: var(--text-dim);
    }
    .conv-item:hover {
      background: var(--bg-hover);
      color: var(--text);
    }
    .conv-item.active {
      background: var(--bg-active);
      color: var(--accent);
    }
    .conv-icon {
      flex-shrink: 0;
      display: flex;
      opacity: .8;
    }
    .conv-title {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 13.5px;
    }
    .conv-item.active .conv-title {
      font-weight: 600;
    }
    .conv-del {
      flex-shrink: 0;
      border: none;
      background: none;
      color: var(--text-mute);
      cursor: pointer;
      font-size: 11px;
      width: 22px;
      height: 22px;
      border-radius: 7px;
      display: grid;
      place-items: center;
      opacity: 0;
      transition: opacity .15s, background-color .15s, color .15s;
    }
    .conv-item:hover .conv-del {
      opacity: 1;
    }
    .conv-del:hover {
      color: var(--danger);
      background: color-mix(in srgb, var(--danger) 14%, transparent);
    }
    .conv-empty {
      color: var(--text-mute);
      text-align: center;
      padding: 30px 12px;
      font-size: 13px;
    }
    #sidebar-footer {
      border-top: 1px solid var(--border);
      padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
      display: flex;
      gap: 8px;
    }
    #sidebar-footer select {
      flex: 1;
      min-width: 0;
      background: var(--bg-card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 13px;
      outline: none;
      cursor: pointer;
    }
    #sidebar-footer select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }
    .icon-btn {
      width: 38px;
      height: 38px;
      flex-shrink: 0;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-dim);
      border-radius: 10px;
      cursor: pointer;
      font-size: 15px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all .15s;
    }
    .icon-btn:hover {
      color: var(--accent);
      border-color: var(--accent);
      background: var(--accent-soft);
    }
    .icon-btn.ghost {
      border-color: transparent;
      background: transparent;
    }
    .icon-btn.ghost:hover {
      background: var(--bg-hover);
    }
    /* ==================== 主区域 ==================== */
    #main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      height: 100%;
      position: relative;
    }
    #chatHeader {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      background: color-mix(in srgb, var(--bg-card) 78%, transparent);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      z-index: 20;
    }
    #btnMenu {
      display: none;
    }
    #headerLeft {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex: 1;
    }
    #headerLeft .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 0 3px rgba(34, 197, 94, .16);
      flex-shrink: 0;
    }
    .header-meta {
      display: flex;
      flex-direction: column;
      min-width: 0;
      line-height: 1.25;
    }
    .header-meta .model {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .header-meta .provider-name {
      font-size: 11.5px;
      color: var(--text-mute);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .header-actions {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
    }
    /* ==================== 消息区 ==================== */
    #messages {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 20px 0 10px;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
    }
    .msg {
      display: flex;
      gap: 12px;
      max-width: 880px;
      margin: 0 auto;
      padding: 9px 20px;
      animation: fadeUp .24s ease both;
    }
    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .avatar {
      width: 34px;
      height: 34px;
      min-width: 34px;
      border-radius: 11px;
      display: grid;
      place-items: center;
      font-size: 12.5px;
      font-weight: 700;
      color: #fff;
      margin-top: 2px;
      user-select: none;
    }
    .msg-user .avatar {
      background: var(--grad-user);
      box-shadow: 0 4px 12px rgba(91, 110, 245, .28);
    }
    .msg-assistant .avatar {
      background: linear-gradient(135deg, #8b5cf6, #d946ef);
      box-shadow: 0 4px 12px rgba(139, 92, 246, .28);
    }
    .msg-wrap {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .msg-user .msg-wrap {
      align-items: flex-end;
    }
    .msg-body {
      min-width: 0;
      max-width: 100%;
      word-break: break-word;
      overflow-wrap: anywhere;
    }
    .msg-user .msg-body {
      background: var(--grad-user);
      color: #fff;
      border-radius: 16px 6px 16px 16px;
      padding: 10px 15px;
      max-width: 78%;
      box-shadow: 0 6px 18px rgba(91, 110, 245, .22);
    }
    .user-text {
      white-space: pre-wrap;
      font-size: 14.5px;
    }
    .msg-assistant .msg-body {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 6px 16px 16px 16px;
      padding: 12px 16px;
      box-shadow: var(--shadow-sm);
      font-size: 14.5px;
    }
    .msg-images {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }
    .msg-images img {
      max-width: 220px;
      max-height: 170px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, .3);
      object-fit: cover;
      display: block;
    }
    /* ==================== 思考块 ==================== */
    .think-block {
      margin-bottom: 8px;
      border: 1px solid var(--think-border);
      border-radius: 12px;
      background: var(--think-bg);
      overflow: hidden;
      animation: fadeUp .22s ease;
    }
    .think-head {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      cursor: pointer;
      font-size: 12.5px;
      color: var(--text-dim);
      user-select: none;
      transition: color .15s, background-color .15s;
    }
    .think-head:hover {
      color: var(--accent);
      background: var(--bg-hover);
    }
    .think-chevron {
      flex-shrink: 0;
      transition: transform .22s cubic-bezier(.3, .8, .3, 1);
    }
    .think-block.open .think-chevron {
      transform: rotate(90deg);
    }
    .think-status {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 500;
    }
    .think-status .dots span {
      display: inline-block;
      animation: thinkDots 1.4s infinite;
    }
    .think-status .dots span:nth-child(2) {
      animation-delay: .2s;
    }
    .think-status .dots span:nth-child(3) {
      animation-delay: .4s;
    }
    @keyframes thinkDots {
      0%,
      60%,
      100% {
        opacity: .3;
      }
      30% {
        opacity: 1;
      }
    }
    .think-meta {
      flex-shrink: 0;
      font-size: 11px;
      color: var(--text-mute);
      font-variant-numeric: tabular-nums;
    }
    .think-body {
      display: none;
      padding: 8px 14px 12px;
      border-top: 1px dashed var(--think-border);
      font-size: 13px;
      line-height: 1.65;
      color: var(--text-dim);
      white-space: pre-wrap;
      word-break: break-word;
      overflow-wrap: anywhere;
      max-height: 42vh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .think-block.open .think-body {
      display: block;
    }
    .think-empty {
      color: var(--text-mute);
      font-style: italic;
    }
    /* ==================== 分支导航 ==================== */
    .branch-nav {
      display: inline-flex;
      align-items: center;
      gap: 1px;
      padding: 0 3px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 999px;
      box-shadow: var(--shadow-sm);
      font-size: 11px;
      color: var(--text-dim);
      user-select: none;
      align-self: flex-start;
      height: 20px;
    }
    .msg-user .branch-nav {
      align-self: flex-end;
    }
    .branch-btn {
      width: 18px;
      height: 18px;
      border: none;
      background: transparent;
      color: var(--text-dim);
      border-radius: 50%;
      cursor: pointer;
      display: grid;
      place-items: center;
      font-size: 13px;
      line-height: 1;
      padding: 0;
      transition: background-color .15s, color .15s;
    }
    .branch-btn:hover:not(:disabled) {
      background: var(--bg-hover);
      color: var(--accent);
    }
    .branch-btn:disabled {
      opacity: .3;
      cursor: default;
    }
    .branch-label {
      padding: 0 2px;
      font-variant-numeric: tabular-nums;
      font-weight: 600;
      font-size: 10.5px;
      letter-spacing: .2px;
    }
    /* ==================== 消息操作栏 ==================== */
    .msg-actions {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 5px;
      min-height: 20px;
    }
    .act-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-mute);
      border-radius: 6px;
      padding: 0 7px;
      height: 20px;
      font-size: 11px;
      line-height: 1;
      cursor: pointer;
      white-space: nowrap;
      transition: color .15s, border-color .15s, background-color .15s;
    }
    .act-btn:hover {
      color: var(--accent);
      border-color: var(--accent);
      background: var(--accent-soft);
    }
    .act-btn.ok {
      color: var(--success);
      border-color: color-mix(in srgb, var(--success) 45%, transparent);
    }
    .token-badge {
      margin-left: auto;
      display: inline-flex;
      align-items: center;
      height: 20px;
      padding: 0 7px;
      border-radius: 6px;
      background: var(--bg-hover);
      color: var(--text-mute);
      font-size: 10.5px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      user-select: none;
      cursor: help;
    }
    /* ==================== 编辑模式 ==================== */
    .edit-box {
      display: flex;
      flex-direction: column;
      gap: 8px;
      animation: fadeUp .18s ease;
    }
    .edit-textarea {
      width: 100%;
      min-height: 56px;
      max-height: 260px;
      padding: 9px 11px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, .35);
      background: rgba(0, 0, 0, .16);
      color: #fff;
      font: inherit;
      font-size: 14.5px;
      line-height: 1.5;
      resize: none;
      outline: none;
      transition: border-color .15s, background-color .15s;
    }
    .edit-textarea:focus {
      border-color: rgba(255, 255, 255, .8);
      background: rgba(0, 0, 0, .22);
    }
    .edit-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .edit-hint {
      flex: 1;
      min-width: 100px;
      font-size: 11px;
      color: rgba(255, 255, 255, .7);
    }
    .edit-btn {
      border: 1px solid rgba(255, 255, 255, .3);
      background: transparent;
      color: rgba(255, 255, 255, .92);
      border-radius: 8px;
      padding: 4px 12px;
      font-size: 12px;
      cursor: pointer;
      transition: all .15s;
    }
    .edit-btn:hover {
      background: rgba(255, 255, 255, .15);
      border-color: rgba(255, 255, 255, .65);
      color: #fff;
    }
    .edit-btn.primary {
      background: #fff;
      color: #5b6ef5;
      border-color: #fff;
      font-weight: 600;
    }
    .edit-btn.primary:hover {
      background: rgba(255, 255, 255, .92);
      color: #4a5ee8;
    }
    /* ==================== Markdown ==================== */
    .md>*:first-child {
      margin-top: 0;
    }
    .md>*:last-child {
      margin-bottom: 0;
    }
    .md p {
      margin: 8px 0;
    }
    .md h1,
    .md h2,
    .md h3,
    .md h4,
    .md h5 {
      margin: 18px 0 8px;
      line-height: 1.35;
      font-weight: 650;
    }
    .md h1 {
      font-size: 1.36em;
    }
    .md h2 {
      font-size: 1.2em;
    }
    .md h3 {
      font-size: 1.08em;
    }
    .md h4,
    .md h5 {
      font-size: 1em;
    }
    .md ul,
    .md ol {
      padding-left: 1.45em;
      margin: 8px 0;
    }
    .md li {
      margin: 3px 0;
    }
    .md li::marker {
      color: var(--text-mute);
    }
    .md a {
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px solid color-mix(in srgb, var(--accent) 40%, transparent);
    }
    .md a:hover {
      border-bottom-color: var(--accent);
    }
    .md blockquote {
      margin: 10px 0;
      padding: 6px 14px;
      border-left: 3px solid var(--accent);
      background: var(--accent-soft);
      color: var(--text-dim);
      border-radius: 0 8px 8px 0;
    }
    .md blockquote p {
      margin: 4px 0;
    }
    .md hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 16px 0;
    }
    .md table {
      border-collapse: collapse;
      margin: 10px 0;
      font-size: 13.5px;
      display: block;
      overflow-x: auto;
      max-width: 100%;
      -webkit-overflow-scrolling: touch;
    }
    .md th,
    .md td {
      border: 1px solid var(--border);
      padding: 7px 12px;
      text-align: left;
    }
    .md th {
      background: var(--bg-hover);
      font-weight: 600;
    }
    .md img {
      max-width: 100%;
      border-radius: 10px;
    }
    .md :not(pre)>code {
      background: var(--inline-code);
      color: var(--accent);
      padding: 2px 6px;
      border-radius: 6px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Courier New", monospace;
      font-size: .88em;
    }
    /* ==================== 代码块 ==================== */
    .code-block {
      margin: 12px 0;
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      background: var(--code-bg);
    }
    .code-head {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 8px;
      background: var(--bg-hover);
      border-bottom: 1px solid var(--border);
    }
    .code-toggle {
      flex-shrink: 0;
      width: 20px;
      height: 20px;
      border: none;
      background: transparent;
      color: var(--text-mute);
      border-radius: 5px;
      cursor: pointer;
      display: grid;
      place-items: center;
      padding: 0;
      transition: color .15s, background-color .15s;
    }
    .code-toggle:hover {
      color: var(--accent);
      background: var(--bg-card);
    }
    .code-toggle svg {
      transition: transform .22s cubic-bezier(.3, .8, .3, 1);
    }
    .code-block.collapsed .code-toggle svg {
      transform: rotate(-90deg);
    }
    .code-lang {
      flex-shrink: 0;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .6px;
      text-transform: uppercase;
      color: var(--text-mute);
    }
    .code-meta {
      flex: 1;
      min-width: 0;
      font-size: 11px;
      color: var(--text-mute);
      font-variant-numeric: tabular-nums;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .code-mode-btn {
      flex-shrink: 0;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-dim);
      font-size: 12px;
      padding: 3px 8px;
      border-radius: 7px;
      cursor: pointer;
      white-space: nowrap;
      transition: background-color .15s, border-color .15s, color .15s;
    }
    .code-mode-btn:hover {
      background: var(--bg-card);
      border-color: var(--border);
      color: var(--accent);
    }
    .copy-btn {
      flex-shrink: 0;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-dim);
      font-size: 12px;
      padding: 3px 10px;
      border-radius: 7px;
      cursor: pointer;
      transition: all .15s;
    }
    .copy-btn:hover {
      background: var(--bg-card);
      border-color: var(--border);
      color: var(--text);
    }
    .copy-btn.ok {
      color: var(--success);
      border-color: color-mix(in srgb, var(--success) 45%, transparent);
    }
    .code-block pre {
      margin: 0;
    }
    .code-block pre code {
      display: block;
      padding: 14px;
      overflow-x: auto;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Courier New", monospace;
      font-size: 13px;
      line-height: 1.6;
      background: transparent !important;
      -webkit-overflow-scrolling: touch;
    }
    .code-block.streaming pre {
      max-height: var(--code-scroll-max);
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
    }
    .code-block.streaming pre code {
      overflow: visible;
    }
    .code-block.mode-scroll:not(.collapsed) pre {
      max-height: var(--code-scroll-max);
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
    }
    .code-block.mode-scroll:not(.collapsed) pre code {
      overflow: visible;
    }
    .code-block.collapsed pre {
      display: none;
    }
    .code-collapsed-hint {
      display: none;
      padding: 9px 14px;
      font-size: 12px;
      color: var(--text-mute);
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: color .15s, background-color .15s;
    }
    .code-block.collapsed .code-collapsed-hint {
      display: block;
    }
    .code-collapsed-hint:hover {
      color: var(--accent);
      background: var(--bg-hover);
    }
    .cursor {
      display: inline-block;
      width: 7px;
      height: 15px;
      margin-left: 3px;
      border-radius: 2px;
      background: var(--accent);
      vertical-align: -2px;
      animation: blink 1s steps(2, start) infinite;
    }
    @keyframes blink {
      0%,
      100% {
        opacity: 1;
      }
      50% {
        opacity: 0;
      }
    }
    .typing {
      display: inline-flex;
      gap: 5px;
      padding: 6px 2px;
    }
    .typing i {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--text-mute);
      animation: bounce 1.3s infinite ease-in-out;
    }
    .typing i:nth-child(2) {
      animation-delay: .16s;
    }
    .typing i:nth-child(3) {
      animation-delay: .32s;
    }
    @keyframes bounce {
      0%,
      75%,
      100% {
        transform: translateY(0);
        opacity: .45;
      }
      35% {
        transform: translateY(-5px);
        opacity: 1;
      }
    }
    .msg-error {
      color: var(--danger);
      background: color-mix(in srgb, var(--danger) 10%, transparent);
      border: 1px solid color-mix(in srgb, var(--danger) 35%, transparent);
      padding: 10px 14px;
      border-radius: 10px;
      white-space: pre-wrap;
      font-size: 13.5px;
    }
    /* ==================== 空状态 ==================== */
    .empty {
      text-align: center;
      padding: 9vh 20px 20px;
      animation: fadeUp .35s ease both;
    }
    .empty .big-icon {
      width: 76px;
      height: 76px;
      margin: 0 auto 20px;
      border-radius: 24px;
      background: var(--grad-brand);
      color: #fff;
      font-size: 34px;
      display: grid;
      place-items: center;
      box-shadow: 0 16px 36px rgba(91, 110, 245, .35);
    }
    .empty h2 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .empty p {
      font-size: 13.5px;
      color: var(--text-dim);
      margin-bottom: 26px;
    }
    .suggest-chips {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 640px;
      margin: 0 auto;
    }
    .suggest-chip {
      padding: 11px 16px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text);
      font-size: 13px;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: all .18s;
    }
    .suggest-chip:hover {
      border-color: var(--accent);
      color: var(--accent);
      transform: translateY(-2px);
      box-shadow: var(--shadow);
    }
    /* ==================== 回到底部 ==================== */
    #btnScrollBottom {
      position: absolute;
      right: 24px;
      bottom: 140px;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-dim);
      display: grid;
      place-items: center;
      cursor: pointer;
      box-shadow: var(--shadow);
      opacity: 0;
      pointer-events: none;
      transform: translateY(8px);
      transition: opacity .2s, transform .2s, color .15s, border-color .15s;
      z-index: 15;
    }
    #btnScrollBottom.show {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }
    #btnScrollBottom:hover {
      color: var(--accent);
      border-color: var(--accent);
    }
    /* ==================== 输入区 ==================== */
    #inputArea {
      flex-shrink: 0;
      padding: 6px 20px calc(10px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    #inputCard {
      width: 100%;
      max-width: 880px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 8px 10px 10px;
      transition: border-color .18s, box-shadow .18s;
    }
    #inputCard:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px var(--accent-soft), var(--shadow);
    }
    #imagePreview {
      display: none;
      gap: 8px;
      flex-wrap: wrap;
      padding: 2px 2px 10px;
    }
    .thumb {
      position: relative;
      width: 64px;
      height: 64px;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--border);
      animation: fadeUp .2s ease;
    }
    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .thumb-rm {
      position: absolute;
      top: 3px;
      right: 3px;
      width: 18px;
      height: 18px;
      border: none;
      border-radius: 50%;
      background: rgba(0, 0, 0, .66);
      color: #fff;
      font-size: 10px;
      line-height: 1;
      cursor: pointer;
      display: grid;
      place-items: center;
      backdrop-filter: blur(4px);
    }
    .thumb-rm:hover {
      background: var(--danger);
    }
    .input-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }
    #input {
      flex: 1;
      min-width: 0;
      resize: none;
      border: none;
      outline: none;
      background: transparent;
      color: var(--text);
      padding: 8px 4px;
      line-height: 1.55;
      font-size: 14.5px;
      max-height: 200px;
      contain: content;
    }
    #input::placeholder {
      color: var(--text-mute);
    }
    #input:disabled {
      opacity: .55;
    }
    #btnSend,
    #btnStop {
      width: 38px;
      height: 38px;
      flex-shrink: 0;
      border: none;
      border-radius: 11px;
      display: grid;
      place-items: center;
      cursor: pointer;
      color: #fff;
      transition: transform .15s, opacity .15s, filter .15s, box-shadow .15s;
    }
    #btnSend {
      background: var(--grad-brand);
      box-shadow: 0 4px 12px rgba(91, 110, 245, .32);
    }
    #btnSend:hover:not(:disabled) {
      transform: translateY(-1px);
      filter: brightness(1.06);
      box-shadow: 0 7px 18px rgba(91, 110, 245, .4);
    }
    #btnSend:disabled {
      opacity: .4;
      cursor: not-allowed;
      box-shadow: none;
    }
    #btnStop {
      background: var(--danger);
      box-shadow: 0 4px 12px rgba(239, 68, 68, .32);
    }
    #btnStop:hover {
      filter: brightness(1.08);
      transform: translateY(-1px);
    }
    /* ==================== 底部统计栏 ==================== */
    .input-hint {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      font-size: 11.5px;
      color: var(--text-mute);
      padding: 0 4px;
      text-align: center;
    }
    .hint-sep {
      opacity: .45;
    }
    .token-stats {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 10px;
      border-radius: 999px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      font-variant-numeric: tabular-nums;
      font-size: 11px;
      color: var(--text-dim);
      cursor: help;
      transition: border-color .15s, color .15s;
    }
    .token-stats:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    .token-stats b {
      color: var(--accent);
      font-weight: 700;
    }
    /* ==================== 设置弹窗 ==================== */
    #settingsModal {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(8, 10, 16, .52);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 100;
      padding: 20px;
    }
    #settingsModal.open {
      display: flex;
      animation: fadeIn .18s ease;
    }
    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }
    @keyframes popIn {
      from {
        opacity: 0;
        transform: scale(.96) translateY(10px);
      }
      to {
        opacity: 1;
        transform: none;
      }
    }
    #settingsCard {
      width: min(680px, 100%);
      max-height: min(88vh, 880px);
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: var(--shadow-lg);
      animation: popIn .24s cubic-bezier(.2, .9, .3, 1.15);
    }
    #settingsHead {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      font-size: 15.5px;
      font-weight: 700;
    }
    #settingsClose {
      width: 30px;
      height: 30px;
      border: none;
      background: transparent;
      color: var(--text-dim);
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: all .15s;
    }
    #settingsClose:hover {
      background: var(--bg-hover);
      color: var(--text);
    }
    #settingsForm {
      flex: 1;
      overflow-y: auto;
      padding: 18px 20px;
      -webkit-overflow-scrolling: touch;
    }
    .section-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-mute);
      letter-spacing: .5px;
      text-transform: uppercase;
      margin: 4px 0 10px;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .field-label {
      font-size: 12.5px;
      color: var(--text-dim);
      font-weight: 500;
    }
    .field input,
    .field textarea,
    .field select {
      width: 100%;
      background: var(--bg-card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 8px 11px;
      font-size: 13.5px;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    .field select {
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' width='12' height='12' fill='none' stroke='%236b7280' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><path d='m6 9 6 6 6-6'/></svg>");
      background-repeat: no-repeat;
      background-position: right 11px center;
      padding-right: 32px;
    }
    .field input:focus,
    .field textarea:focus,
    .field select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }
    .field textarea {
      resize: vertical;
      min-height: 68px;
      line-height: 1.55;
    }
    .provider-row {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
      background: var(--bg-hover);
    }
    .provider-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }
    .provider-head-left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }
    .provider-head-left strong {
      font-size: 14px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .badge {
      font-size: 10.5px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      flex-shrink: 0;
    }
    .provider-actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }
    .btn-mini {
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-dim);
      border-radius: 8px;
      padding: 5px 11px;
      font-size: 12px;
      cursor: pointer;
      transition: all .15s;
    }
    .btn-mini:hover:not(:disabled) {
      border-color: var(--accent);
      color: var(--accent);
    }
    .btn-mini.danger:hover:not(:disabled) {
      border-color: var(--danger);
      color: var(--danger);
      background: color-mix(in srgb, var(--danger) 10%, transparent);
    }
    .btn-mini:disabled {
      opacity: .45;
      cursor: default;
    }
    .provider-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px 12px;
      margin-bottom: 10px;
    }
    .provider-grid .full {
      grid-column: 1 / -1;
    }
    #btnAddProvider {
      width: 100%;
      padding: 11px;
      border: 1px dashed var(--border-strong);
      background: transparent;
      color: var(--text-dim);
      border-radius: 12px;
      cursor: pointer;
      font-size: 13px;
      transition: all .15s;
    }
    #btnAddProvider:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-soft);
    }
    #settingsFoot {
      flex-shrink: 0;
      padding: 14px 20px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    #settingsSave {
      border: none;
      background: var(--grad-brand);
      color: #fff;
      padding: 10px 30px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(91, 110, 245, .32);
      transition: transform .15s, filter .15s;
    }
    #settingsSave:hover {
      filter: brightness(1.06);
      transform: translateY(-1px);
    }
    #resetProviders {
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-dim);
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 13px;
      cursor: pointer;
      transition: all .15s;
    }
    #resetProviders:hover {
      border-color: var(--danger);
      color: var(--danger);
    }
    /* ==================== Toast ==================== */
    #toastWrap {
      position: fixed;
      top: calc(18px + env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      z-index: 200;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
      pointer-events: none;
      width: max-content;
      max-width: 100vw;
    }
    .toast {
      padding: 10px 18px;
      border-radius: 12px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 13.5px;
      box-shadow: var(--shadow-lg);
      animation: toastIn .25s cubic-bezier(.2, .9, .3, 1.15);
      max-width: 86vw;
    }
    .toast.error {
      border-color: color-mix(in srgb, var(--danger) 50%, transparent);
      color: var(--danger);
    }
    .toast.success {
      border-color: color-mix(in srgb, var(--success) 50%, transparent);
      color: var(--success);
    }
    .toast.warn {
      border-color: #f59e0b;
      color: #d97706;
    }
    .toast.out {
      animation: toastOut .25s ease forwards;
    }
    @keyframes toastIn {
      from {
        opacity: 0;
        transform: translateY(-12px) scale(.96);
      }
      to {
        opacity: 1;
        transform: none;
      }
    }
    @keyframes toastOut {
      to {
        opacity: 0;
        transform: translateY(-10px) scale(.97);
      }
    }
    /* ==================== 移动端遮罩 ==================== */
    #sidebarOverlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(8, 10, 16, .5);
      z-index: 55;
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s;
    }
    /* ==================== 响应式：平板 ==================== */
    @media (max-width: 860px) {
      #sidebar {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        transform: translateX(-100%);
        transition: transform .28s cubic-bezier(.3, .8, .3, 1);
        box-shadow: none;
        padding-top: env(safe-area-inset-top);
      }
      body.sidebar-open #sidebar {
        transform: translateX(0);
        box-shadow: var(--shadow-lg);
      }
      #sidebarOverlay {
        display: block;
      }
      body.sidebar-open #sidebarOverlay {
        opacity: 1;
        pointer-events: auto;
      }
      #btnMenu {
        display: inline-flex;
      }
      #btnCloseSidebar {
        display: inline-flex;
      }
      .msg {
        padding: 8px 14px;
      }
      .msg-user .msg-body {
        max-width: 84%;
      }
      #inputArea {
        padding-left: 12px;
        padding-right: 12px;
      }
      #btnScrollBottom {
        right: 16px;
        bottom: 130px;
      }
      .provider-grid {
        grid-template-columns: 1fr;
      }
      .empty {
        padding-top: 6vh;
      }
      .token-badge {
        margin-left: 0;
      }
    }
    /* ==================== 响应式：手机 ==================== */
    @media (max-width: 640px) {

  <script>
    (() => {
      'use strict';
      /* ==================================================================
       * 0. 常量配置
       * ================================================================== */
      const CONFIG = {
        STORAGE_KEY: 'web_ai_chat_state_v2',
        DEFAULT_SYSTEM_PROMPT: '你是一个可爱的有趣的有帮助的AI助手。',
        IMG_TOKEN_EST: 85,
        CODE_COLLAPSE_THRESHOLD: 15,
        MAX_TOKENS_MIN: 1,
        MAX_TOKENS_MAX: 393216,
        DEFAULT_MAX_TOKENS: 2048,
        INPUT_AUTOSIZE_MAX_LEN: 4000,
        PAINT_GAP: 40,          // 流式渲染节流间隔（普通文本）
        PAINT_GAP_LONG: 100,    // 流式渲染节流间隔（长文本）
        LONG_TEXT_THRESHOLD: 8000,
        IMG_MAX_EDGE: 1024,
        IMG_QUALITY: 0.85,
        QUOTA_WARN_INTERVAL: 30000,
        NEAR_BOTTOM_PX: 120,
      };
      const BUILTIN_PROVIDERS = [
        {
          name: 'llama-cpp',
          api_key: 'sk-123456789123456789',
          base_url: 'http://192.168.101.11:8888/v1',
          model: 'Qwen3.5-9B-Q4_K_M',
          api_mode: 'chat',
          temperature: 0.7,
          max_tokens: 32768,
          reasoning_effort: '',
        },
        {
          name: 'DeepSeek',
          api_key: '',
          base_url: 'https://api.deepseek.com/v1',
          model: 'deepseek-flash',
          api_mode: 'chat',
          temperature: 1.0,
          max_tokens: 393216,
          reasoning_effort: '',
        },
      ];
      const DEFAULT_PROVIDER = {
        name: '新服务商', api_key: '', base_url: 'https://api.openai.com/v1',
        model: 'gpt-4o-mini', api_mode: 'chat',
        temperature: 0.7, max_tokens: CONFIG.DEFAULT_MAX_TOKENS, reasoning_effort: '',
      };
      const REASONING_EFFORTS = ['low', 'medium', 'high'];
      const TYPING_HTML = '<div class="typing"><i></i><i></i><i></i></div>';
      const CHEVRON_SVG = '<svg class="think-chevron" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>';
      const CHEVRON_DOWN_SVG = '<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>';
      /* ==================================================================
       * 1. 通用工具
       * ================================================================== */
      const genId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
      const escapeHtml = s => String(s).replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
      }[c]));
      const clamp = (n, min, max) => Math.min(Math.max(n, min), max);
      const firstString = (...vals) => {
        for (const v of vals) if (typeof v === 'string' && v) return v;
        return '';
      };
      function fmtNum(n) {
        n = Math.round(Number(n) || 0);
        if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
        if (n >= 10000) return (n / 1000).toFixed(1) + 'k';
        return n.toLocaleString('en-US');
      }
      /** 简易 DOM 工厂 */
      function h(tag, props, ...children) {
        const el = document.createElement(tag);
        if (props) {
          for (const [k, v] of Object.entries(props)) {
            if (v === null || v === undefined || v === false) continue;
            if (k === 'class') el.className = v;
            else if (k === 'text') el.textContent = v;
            else if (k === 'html') el.innerHTML = v;
            else if (k === 'dataset') Object.assign(el.dataset, v);
            else if (k === 'value') el.value = v;
            else if (k.startsWith('on') && typeof v === 'function') {
              el.addEventListener(k.slice(2).toLowerCase(), v);
            } else {
              el.setAttribute(k, v === true ? '' : v);
            }
          }
        }
        for (const child of children.flat(Infinity)) {
          if (child === null || child === undefined || child === false) continue;
          el.append(child.nodeType ? child : String(child));
        }
        return el;
      }
      /* ==================================================================
       * 2. Token 估算
       * ================================================================== */
      function estimateTokens(text) {
        if (!text) return 0;
        const s = String(text);
        let cjk = 0, other = 0;
        for (const ch of s) {
          const c = ch.codePointAt(0);
          if (
            (c >= 0x4E00 && c <= 0x9FFF) ||
            (c >= 0x3400 && c <= 0x4DBF) ||
            (c >= 0x3040 && c <= 0x30FF) ||
            (c >= 0xAC00 && c <= 0xD7AF) ||
            (c >= 0xF900 && c <= 0xFAFF) ||
            (c >= 0x20000 && c <= 0x2FA1F)
          ) cjk++;
          else other++;
        }
        return Math.ceil(cjk + other / 4);
      }
      function nodeTokens(node) {
        if (!node) return 0;
        if (typeof node.tokens === 'number' && node.tokens >= 0) return node.tokens;
        let t = estimateTokens(node.content || '');
        if (Array.isArray(node.images) && node.images.length) {
          t += node.images.length * CONFIG.IMG_TOKEN_EST;
        }
        return t;
      }
      function nodeReasoningTokens(node) {
        if (!node || !node.reasoning) return 0;
        if (typeof node.reasoning_tokens === 'number') return node.reasoning_tokens;
        return estimateTokens(node.reasoning);
      }
      function clampMaxTokens(v) {
        if (v === '' || v === null || v === undefined) return null;
        const n = Number(v);
        if (!Number.isFinite(n)) return null;
        const int = Math.floor(n);
        if (int <= 0) return null;
        return clamp(int, CONFIG.MAX_TOKENS_MIN, CONFIG.MAX_TOKENS_MAX);
      }
      const isValidEffort = v => REASONING_EFFORTS.includes(v);
      /* ==================================================================
       * 3. 数据模型（消息树）
       * ================================================================== */
      function createConversation() {
        return {
          id: genId(),
          created_at: new Date().toISOString(),
          nodes: {},
          children: { root: [] },
          activeLeafId: null,
        };
      }
      function migrateConv(conv) {
        if (conv && conv.nodes && conv.children) {
          if (!conv.children.root) conv.children.root = [];
          return conv;
        }
        const oldMessages = (conv && conv.messages) || [];
        const nodes = {};
        const children = { root: [] };
        let parentId = 'root';
        let lastId = null;
        for (const m of oldMessages) {
          const id = genId();
          nodes[id] = {
            id,
            role: m.role,
            content: m.content || '',
            images: Array.isArray(m.images) ? m.images : [],
            parentId,
            createdAt: (conv && conv.created_at) || new Date().toISOString(),
          };
          children[id] = [];
          if (!children[parentId]) children[parentId] = [];
          children[parentId].push(id);
          parentId = id;
          lastId = id;
        }
        return {
          id: (conv && conv.id) || genId(),
          created_at: (conv && conv.created_at) || new Date().toISOString(),
          nodes,
          children,
          activeLeafId: lastId,
        };
      }
      function getPath(conv, leafId) {

      /* ==================================================================
       * 15. 图片处理

      async function compressImage(file) {
        let bmp;
        try {
          bmp = await createImageBitmap(file, { imageOrientation: 'from-image' });
        } catch (e) {
          bmp = await createImageBitmap(file);
        }
        let { width, height } = bmp;
        const MAX = CONFIG.IMG_MAX_EDGE;
        if (width > MAX || height > MAX) {
          const scale = MAX / Math.max(width, height);
          width = Math.max(1, Math.round(width * scale));
          height = Math.max(1, Math.round(height * scale));
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        canvas.getContext('2d').drawImage(bmp, 0, 0, width, height);
        if (typeof bmp.close === 'function') bmp.close();
        const mime = (file.type === 'image/png' || file.type === 'image/gif')
          ? 'image/png' : 'image/jpeg';
        return { data: canvas.toDataURL(mime, CONFIG.IMG_QUALITY) };
      }
      async function addImages(files) {

      /* ==================================================================
       * 16. 请求体构造

      function buildUserContent(text, images) {
        if (!images || !images.length) return text;
        const content = [{ type: 'text', text: text || '' }];
        for (const img of images) {
          content.push({ type: 'image_url', image_url: { url: img.data } });

        return content;
      }
      function toApiMessages(conv, leafId) {
        const path = getPath(conv, leafId);
        const msgs = [];
        const sys = (state.system_prompt || '').trim();
        if (sys) msgs.push({ role: 'system', content: sys });
        for (const node of path) {
          if (node.role === 'user') {
            msgs.push({ role: 'user', content: buildUserContent(node.content || '', node.images) });
          } else if (node.role === 'assistant' && node.content) {
            msgs.push({ role: 'assistant', content: node.content });
          }
        }
        return msgs;
      }
      function toResponsesInput(apiMessages) {
        let instructions = '';
        const input = [];
        for (const m of apiMessages) {
          if (m.role === 'system') {
            instructions = typeof m.content === 'string'
              ? m.content
              : (Array.isArray(m.content)
                ? m.content.map(p => (p && typeof p.text === 'string') ? p.text : '').join('')
                : '');
            continue;
          }
          if (m.role === 'user') {
            if (typeof m.content === 'string') {
              if (m.content) input.push({ role: 'user', content: m.content });
            } else if (Array.isArray(m.content)) {
              const parts = [];
              for (const part of m.content) {
                if (!part) continue;
                if (part.type === 'text' && typeof part.text === 'string') {
                  parts.push({ type: 'input_text', text: part.text });
                } else if (part.type === 'image_url' && part.image_url && part.image_url.url) {
                  parts.push({ type: 'input_image', image_url: part.image_url.url });
                }
              }
              if (parts.length) input.push({ role: 'user', content: parts });
            }
          } else if (m.role === 'assistant') {
            const text = typeof m.content === 'string' ? m.content : '';
            if (text) input.push({ role: 'assistant', content: text });
          }
        }
        return { instructions, input };
      }
      function extractResponsesOutput(json) {
        let content = '';
        let reasoning = '';
        let hasContent = false;
        const out = Array.isArray(json.output) ? json.output : [];
        for (const item of out) {
          if (!item) continue;
          if (item.type === 'message') {
            for (const part of (Array.isArray(item.content) ? item.content : [])) {
              if (!part) continue;
              if (part.type === 'output_text' && typeof part.text === 'string') {
                content += part.text;
                hasContent = true;
              } else if (part.type === 'refusal' && typeof part.refusal === 'string') {
                content += part.refusal;
                hasContent = true;
              }
            }
          } else if (item.type === 'reasoning') {
            for (const s of (Array.isArray(item.summary) ? item.summary : [])) {
              if (s && s.type === 'summary_text' && typeof s.text === 'string') reasoning += s.text;
            }
            for (const c of (Array.isArray(item.content) ? item.content : [])) {
              if (c && c.type === 'reasoning_text' && typeof c.text === 'string') reasoning += c.text;
            }
          }
        }
        if (!hasContent && typeof json.output_text === 'string') content = json.output_text;
        return { content, reasoning };

      /* ==================================================================
       * 17. SSE 读取（两种接口共用）
       * ================================================================== */
      function parseSseLine(line) {
        const t = line.trim();
        if (!t || t.startsWith(':') || !t.startsWith('data:')) return null;
        const data = t.slice(5).trim();
        if (!data || data === '[DONE]') return null;
        try { return JSON.parse(data); } catch (e) { return null; }
      }
      async function* readEventStream(res) {
        if (!res.body) throw new Error('当前浏览器不支持流式响应读取');
        const reader = res.body.getReader();
        const decoder = new TextDecoder('utf-8');
        let buf = '';
        try {
          for (; ;) {
            const { done, value } = await reader.read();
            if (done) break;
            buf += decoder.decode(value, { stream: true });
            const lines = buf.split(/\r?\n/);
            buf = lines.pop() || '';
            for (const line of lines) {
              const ev = parseSseLine(line);
              if (ev) yield ev;
            }
          }
          const last = parseSseLine(buf);
          if (last) yield last;
        } finally {
          try { reader.releaseLock(); } catch (e) { /* 忽略 */ }
        }
      }
      /* ==================================================================
       * 18. API 适配器（统一「请求 → 增量」的抽象）
       * ================================================================== */
      function applySamplingParams(body, p, maxTokensKey) {
        const temp = Number(p.temperature);
        if (Number.isFinite(temp)) body.temperature = clamp(temp, 0, 2);
        const mt = clampMaxTokens(p.max_tokens);
        if (mt !== null) body[maxTokensKey] = mt;
      }
      const API_ADAPTERS = {
        chat: {
          path: '/chat/completions',
          buildBody(p, messages) {
            const body = { model: p.model, messages, stream: true };
            applySamplingParams(body, p, 'max_tokens');
            if (isValidEffort(p.reasoning_effort)) body.reasoning_effort = p.reasoning_effort;
            return body;
          },
          readDelta(choice) {
            if (!choice) return {};
            const d = choice.delta || choice.message || {};
            return {
              reasoning: firstString(d.reasoning_content, d.reasoning),
              content: typeof d.content === 'string'
                ? d.content
                : Array.isArray(d.content)
                  ? d.content.map(x => (x && typeof x.text === 'string') ? x.text : '').join('')
                  : (typeof choice.text === 'string' ? choice.text : ''),
            };
          },
          fromResponse(json) {
            return this.readDelta(json && json.choices && json.choices[0]);
          },
          fromEvent(json) {
            return this.readDelta(json && json.choices && json.choices[0]);
          },
        },
        responses: {
          path: '/responses',
          buildBody(p, messages) {
            const { instructions, input } = toResponsesInput(messages);
            if (!input.length) throw new Error('Responses 接口请求体为空：没有可发送的消息');
            const body = { model: p.model, input, stream: true };
            if (instructions) body.instructions = instructions;
            if (isValidEffort(p.reasoning_effort)) body.reasoning = { effort: p.reasoning_effort };
            applySamplingParams(body, p, 'max_output_tokens');
            return body;
          },
          fromResponse(json) {
            return extractResponsesOutput(json);
          },
          fromEvent(json) {
            const type = json.type || '';
            if (type === 'response.output_text.delta' || type === 'response.refusal.delta') {
              return { content: typeof json.delta === 'string' ? json.delta : '' };
            }
            if (type === 'response.reasoning_summary_text.delta' ||
              type === 'response.reasoning_text.delta') {
              return { reasoning: typeof json.delta === 'string' ? json.delta : '' };
            }
            if (type === 'response.failed' || type === 'error') {
              const msg =
                (json.response && json.response.error && json.response.error.message) ||
                (json.error && json.error.message) || json.message ||
                'Responses API 返回错误';

            }

      /* ==================================================================
       * 19. 底层请求
       * ================================================================== */
      function requireProvider() {
        const p = provider();
        if (!p) throw new Error('未配置服务商');
        if (!p.base_url) throw new Error('请先在设置中填写 Base URL');
        if (!p.model) throw new Error('请先在设置中填写模型名称');
        return p;
      }
      function buildHeaders(p) {
        const headers = { 'Content-Type': 'application/json' };
        if (p.api_key) headers['Authorization'] = 'Bearer ' + p.api_key;
        return headers;
      }
      async function describeHttpError(res) {
        let detail = '';
        try {
          const txt = await res.text();
          try {
            const j = JSON.parse(txt);
            detail = (j && j.error && j.error.message) || (j && j.message) || '';
          } catch (e) {
            detail = txt.slice(0, 200);
          }
        } catch (e) { /* 忽略 */ }
        if (/max_tokens/i.test(detail)) {
          return `HTTP ${res.status} - 服务端拒绝 max_tokens（有效范围 ${CONFIG.MAX_TOKENS_MIN}~${CONFIG.MAX_TOKENS_MAX}）：${detail}\n` +
            '请在「设置 → 服务商 → Max Tokens」中调低该值或清空使用服务端默认值。';
        }
        return `HTTP ${res.status}${detail ? ' - ' + detail : ''}`;
      }
      /**
       * 统一流式请求：自动适配 chat / responses 两种接口。
       * @param {Array} apiMessages
       * @param {AbortSignal} signal
       * @param {{onDelta?:Function, onReasoning?:Function}} handlers
       */
      async function streamRequest(apiMessages, signal, handlers) {
        const p = requireProvider();
        const adapter = API_ADAPTERS[p.api_mode] || API_ADAPTERS.chat;
        const url = p.base_url.replace(/\/+$/, '') + adapter.path;
        const body = adapter.buildBody(p, apiMessages);
        const res = await fetch(url, {
          method: 'POST',
          headers: buildHeaders(p),
          body: JSON.stringify(body),
          signal,
        });
        if (!res.ok) throw new Error(await describeHttpError(res));
        const emit = ({ content, reasoning }) => {
          if (reasoning && handlers.onReasoning) handlers.onReasoning(reasoning);
          if (content && handlers.onDelta) handlers.onDelta(content);
        };
        const ct = (res.headers.get('content-type') || '').toLowerCase();
        if (!ct.includes('event-stream') && !ct.includes('ndjson')) {
          let json;
          try { json = await res.json(); } catch (e) { throw new Error('响应不是有效的 JSON'); }
          emit(adapter.fromResponse(json));
          return;
        }
        for await (const ev of readEventStream(res)) {
          emit(adapter.fromEvent(ev));
        }

      /* ==================================================================
       * 20. 完成流程（流式渲染 + 落库）

      function setBusyUI(on) {

      function renderFinalContent(view, raw) {

      /** 把已完成的 assistant 节点挂到 UI 上（复制 / 重新生成 / 分支导航 / token） */
      function attachFinalActions(view, conv, node, raw) {

      async function runCompletion(conv, fromNodeId) {

        view.body.innerHTML = TYPING_HTML;
        els.messages.appendChild(view.el);
        stickToBottom = true;
        scrollToBottom();
        let think = null;
        let raw = '';
        let reasoning = '';
        let reasoningTokens = 0;
        let reasoningFinished = false;
        let finished = false;

        let lastPaintAt = 0;
        const ensureThink = () => {

          return think;
        };
        const markReasoningDone = () => {
          if (reasoningFinished) return;
          reasoningFinished = true;
          if (!reasoning || !think) return;
          think.finish();
        };
        const paint = () => {
          if (finished) return;

            view.body.replaceChildren(md);
            const pres = md.querySelectorAll('.code-block.streaming pre');
            const lastPre = pres[pres.length - 1];

          paintTimer = null;
          if (finished) return;
          lastPaintAt = performance.now();
          paint();
        };

          if (finished || paintTimer !== null) return;
          const now = performance.now();
          const gap = raw.length > CONFIG.LONG_TEXT_THRESHOLD
            ? CONFIG.PAINT_GAP_LONG
            : CONFIG.PAINT_GAP;
          const elapsed = now - lastPaintAt;
          if (elapsed >= gap) {

          await streamRequest(
            toApiMessages(conv, fromNodeId),
            abortController.signal,

                schedule();
              },
              onReasoning(delta) {

          t.setText(reasoning);
          t.setTokens(reasoningTokens);
          markReasoningDone();

          renderFinalContent(view, raw);

            content: raw,
            reasoning: reasoning || null,

          const node = appendNode(conv, fromNodeId, {
            role: 'assistant',
            content: '',
            reasoning,
            reasoningTokens,
            tokens: 0,
          });

          view.body.innerHTML = errorMsg
            ? `<div class="msg-error">请求失败：${escapeHtml(errorMsg)}</div>`
            : '<div class="msg-error">模型只返回了思考过程，没有输出正文。</div>';
          if (errorMsg) toast('请求失败：' + errorMsg.split('\n')[0], 'error', 4200);
          saveState();
          renderConvList();
          updateTokenStats();
        } else if (errorMsg) {
          view.body.innerHTML = `<div class="msg-error">请求失败：${escapeHtml(errorMsg)}</div>`;
          toast('请求失败：' + errorMsg.split('\n')[0], 'error', 4200);
        } else {
          view.el.dataset.nodeId = '';
          view.body.innerHTML = '<div class="msg-error">模型没有返回任何内容。请检查服务商配置，或稍后重试。</div>';
          toast('模型没有返回任何内容', 'warn', 3200);
        }
