user  nginx;
worker_processes  auto;
# error_log  /var/log/nginx/error.log notice; #修改
error_log  /dev/null crit; #修改
pid        /run/nginx.pid;

# Load dynamic modules. See /usr/share/doc/nginx/README.dynamic. #修改
include /usr/share/nginx/modules/*.conf; #修改

events {
    worker_connections  4096; #修改
}


# ================ SNI 分流 修改============
stream {
    # ===== 关闭 stream 日志 =====
    access_log off;
    error_log  /dev/null crit;

    map $ssl_preread_server_name $backend {
        [WWWUSER].[WWWURL]  127.0.0.1:4443;   # ocserv
        default             127.0.0.1:8443;   # 后端 nginx https
    }

    server {
        listen      443;
        listen      [::]:443;
        ssl_preread on;
        proxy_pass  $backend;
        proxy_protocol on;
        proxy_connect_timeout 10s;
        proxy_timeout 1h;
    }
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log off;
    error_log  /dev/null crit;

    ssl_certificate     /etc/pki/ocs/server-cert.pem;
    ssl_certificate_key /etc/pki/ocs/server-key.pem;
    #include /etc/letsencrypt/options-ssl-nginx.conf;
    #ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 2048;
    server_tokens       off;
    #gzip  on;
    #include /etc/nginx/conf.d/*.conf;

    # ========== 所有域名都落到这里 ==========
    server {
        listen      127.0.0.1:8443 ssl proxy_protocol default_server;
        server_name _;

        # 还原真实客户端 IP（由 stream 的 PROXY 协议传入）
        set_real_ip_from 127.0.0.1;
        real_ip_header   proxy_protocol;

        location / {
            root  /usr/share/nginx/html;
            index index.html;
        }
    }
    # HTTP->HTTPS
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;
        return 301 https://$host$request_uri;
    }
}
