user  nginx;
worker_processes  auto;

events {
    # events 块必须存在，但可留空以使用默认配置
}

http {
    # 启用 sendfile 零拷贝传输模式
    sendfile  on;
    # 启用 TCP_NOPUSH（仅 sendfile 开启时有效）
    tcp_nopush  on;
    # 引入额外的配置文件（推荐将 server 块拆分到独立文件）
    # include  /etc/nginx/conf.d/*.conf;

    server {
        # 监听端口
        listen  80 default_server;
        listen  [::]:80 default_server;
        # 虚拟主机域名
        server_name  _;
        # 将所有 HTTP 请求永久重定向到 HTTPS
        return  301  https://$host$request_uri;
    }

    server {
        # 监听 443 端口并启用 SSL
        listen  127.0.0.1:8443 ssl proxy_protocol default_server;
        listen  [::1]:8443 ssl proxy_protocol default_server;
        # 虚拟主机域名
        server_name  _;

        # 还原真实客户端 IP（由 stream 的 PROXY 协议传入）
        set_real_ip_from 127.0.0.1;
        set_real_ip_from ::1;
        real_ip_header   proxy_protocol;

        # 证书路径
        ssl_certificate     /etc/pki/ocs/server-cert.pem;
        ssl_certificate_key /etc/pki/ocs/server-key.pem;
        #include /etc/letsencrypt/options-ssl-nginx.conf;
        #ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

        # 开启 OCSP Stapling（减少 SSL 握手延迟）
        # ssl_stapling on;
        # ssl_stapling_verify on;
        # ssl_trusted_certificate /etc/nginx/ssl/chain.pem;

        # SSL 会话缓存（可按 server 单独设置，也可在 http 块中全局设置）
        ssl_session_cache  shared:SSL:10m;
        ssl_session_timeout  10m;

        # 网站根目录
        root  /usr/share/nginx/html;
        # 默认首页文件
        index  index.html  index.htm;
        # 字符集
        charset  utf-8;

        # 错误页面配置
        # 语法：error_page code ... [=[response]] uri;
        # 上下文：http, server, location, if in location
        error_page  404  /404.html;
        error_page  500 502 503 504  /50x.html;

        location = /404.html {
            root  /usr/share/nginx/html;
            internal;  # internal 表示该 location 只能被内部请求访问
        }

        location = /50x.html {
            root  /usr/share/nginx/html;
            internal;
        }

        # 根路径 location
        location / {
            # 尝试按顺序查找文件：先找 $uri，再找 $uri/，最后回退到 /index.html
            try_files  $uri  $uri/  /index.html;
        }
    }
}
stream {
    # 将 upstream 和 server 配置拆分到独立文件中，便于维护
    # include  /etc/nginx/stream.d/*.conf;

    # IPv4 入口
    server {
        listen 443 default_server;
        ssl_preread on;
        proxy_pass 127.0.0.1:$name;
        proxy_protocol on;
    }

    # IPv6 入口
    server {
        listen [::]:443 default_server;
        ssl_preread on;
        proxy_pass [::1]:$name;
        proxy_protocol on;
    }

    # 根据 SNI 选择上游服务器
    map  $ssl_preread_server_name  $name {
        [WWWUSER].[WWWURL] 4443;   # ocserv
        default            8443;   # nginx 自身 HTTPS
    }
}
