
user  nginx;
worker_processes  auto;

error_log  /dev/null crit;
pid        /run/nginx.pid;


events {
    worker_connections  1024;
}

# ================ SNI 分流 ================
stream {
    # ===== 关闭 stream 日志 =====
    access_log off;
    error_log  /dev/null crit;

    map $ssl_preread_server_name $backend {
        abc.xyz   127.0.0.1:4443;   # ocserv
        default             127.0.0.1:8443;   # 后端 nginx https
    }

    server {
        listen      443;
        listen      [::]:443;
        ssl_preread on;
        proxy_pass  $backend;
        proxy_protocol on;
        proxy_connect_timeout 10s;
        proxy_timeout 1h;
    }
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log off;
    error_log  /dev/null crit;

    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 2048;
    server_tokens       off;

    #gzip  on;

    server {
        listen       80;
        server_name  localhost;

        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
        }

        #error_page  404              /404.html;

        # redirect server error pages to the static page /50x.html
        #
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }
    }
    server {
        listen      127.0.0.1:8443 ssl proxy_protocol default_server;
        server_name _;

        # 还原真实客户端 IP（由 stream 的 PROXY 协议传入）
        set_real_ip_from 127.0.0.1;
        real_ip_header   proxy_protocol;

        # 自签名证书
        ssl_certificate     /etc/pki/ocserv/public/server.crt;
        ssl_certificate_key /etc/pki/ocserv/private/server.key;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

        location / {
            root  /usr/share/nginx/html;
            index index.html;
        }
    }
}
