user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /run/nginx.pid;

# Rocky 8 AppStream 的 nginx 已内置 stream 模块，无需 load_module
# 如果报 "unknown directive stream"，取消下面注释：
# include /usr/share/nginx/modules/*.conf;

events {
    worker_connections  2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens off;

    # ---------- 80 端口：全部 301 跳转到 443 ----------
    server {
        listen       80 default_server;
        listen       [::]:80 default_server;
        server_name  _;
        return 301 https://$host$request_uri;
    }

    # ---------- 8443：Nginx 自身的 HTTPS 站点（其他域名走这里）----------
    # 被 stream 层从 443 转发进来，只监听 127.0.0.1，不直接对外
    server {
        listen       127.0.0.1:8443 ssl default_server;
        server_name  _;

        ssl_certificate     /etc/ssl/certs/server.crt;
        ssl_certificate_key /etc/ssl/private/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        root   /usr/share/nginx/html;
        index  index.html index.htm;

        location / {
            try_files $uri $uri/ =404;
        }
    }

    include /etc/nginx/conf.d/*.conf;
}

# ================= stream 层：443 SNI 分流 =================
stream {
    log_format  stream  '$remote_addr [$time_local] '
                        '$ssl_preread_server_name -> $upstream_addr '
                        '$status $bytes_sent $bytes_received $session_time';
    access_log  /var/log/nginx/stream.log  stream;

    map $ssl_preread_server_name $backend {
        abc.785118406.xyz   127.0.0.1:4443;   # ocserv
        default             127.0.0.1:8443;   # nginx 自身 HTTPS
    }

    server {
        listen        443;
        listen        [::]:443;
        proxy_pass    $backend;
        ssl_preread   on;

        proxy_timeout         12h;   # VPN 长连接
        proxy_connect_timeout 10s;
        proxy_buffer_size     16k;
    }
}
