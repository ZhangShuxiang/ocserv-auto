# =============================================================================
# Nginx 主配置文件模板
# 参考文档：https://nginx.org/en/docs/
# 配置文件结构：main（全局）→ events（连接处理）→ http（HTTP 服务）→ server（虚拟主机）→ location（URI 匹配）
# =============================================================================


# =============================================================================
# 一、main（全局配置块）
# 作用：影响 Nginx 全局运行的指令，包括运行用户、进程数、日志路径等
# =============================================================================

# 指定 Nginx 运行的用户和用户组
# 语法：user user [group];
# 上下文：main
# 说明：建议使用权限较低的专用用户（如 nginx、www-data），避免使用 root
user  nginx;

# 指定 Nginx 工作进程数
# 语法：worker_processes number | auto;
# 默认值：1
# 上下文：main
# 说明：设置为 auto 将自动检测 CPU 核心数并启动相同数量的工作进程[reference:0]
worker_processes  auto;

# 设置 CPU 亲和力，将工作进程绑定到特定 CPU 核心
# 语法：worker_cpu_affinity cpumask ...;
# 上下文：main
# 说明：减少 CPU 上下文切换开销，提升性能。以下示例为 4 核 CPU
# worker_cpu_affinity 0001 0010 0100 1000;

# 指定错误日志路径和日志级别
# 语法：error_log file [level];
# 默认值：error_log logs/error.log error;
# 上下文：main, http, mail, stream, server, location
# 日志级别（从低到高）：debug, info, notice, warn, error, crit, alert, emerg
error_log  /var/log/nginx/error.log  warn;

# 指定 Nginx 主进程 PID 文件的存放路径
# 语法：pid file;
# 默认值：pid logs/nginx.pid;
# 上下文：main
pid  /var/run/nginx.pid;

# 限制单个工作进程可打开的最大文件描述符数量
# 语法：worker_rlimit_nofile number;
# 上下文：main
# 说明：应设置为系统 ulimit -n 的值，避免 "too many open files" 错误
worker_rlimit_nofile  65535;

# 设置 Nginx 是否以守护进程方式运行
# 语法：daemon on | off;
# 默认值：daemon on;
# 上下文：main
# 说明：主要用于开发调试，生产环境保持默认即可
# daemon on;


# =============================================================================
# 二、events（连接处理配置块）
# 作用：配置 Nginx 的事件驱动模型和连接数上限
# =============================================================================

events {
    # 指定事件驱动模型
    # 语法：use method;
    # 上下文：events
    # Linux 推荐 epoll，FreeBSD 推荐 kqueue
    # 如不指定，Nginx 会自动选择最优模型
    use  epoll;

    # 单个工作进程允许的最大并发连接数
    # 语法：worker_connections number;
    # 默认值：512
    # 上下文：events
    # 说明：总连接数 = worker_processes × worker_connections[reference:1]
    worker_connections  10240;

    # 是否开启 accept_mutex（连接互斥锁）
    # 语法：accept_mutex on | off;
    # 默认值：off（1.11.3 之后）
    # 上下文：events
    # 说明：在支持 EPOLLEXCLUSIVE 或 reuseport 的系统上无需开启[reference:2]
    accept_mutex  off;

    # 是否启用多连接接受
    # 语法：multi_accept on | off;
    # 默认值：off
    # 上下文：events
    # 说明：开启后一个工作进程可同时接受多个新连接
    multi_accept  on;
}


# =============================================================================
# 三、http（HTTP 服务配置块）
# 作用：包含所有 HTTP 协议相关的配置，可嵌套 server、upstream、map 等块
# =============================================================================

http {
    # -------------------------------------------------------------------------
    # 3.1 MIME 类型与默认类型
    # -------------------------------------------------------------------------

    # 引入 MIME 类型映射文件
    # 语法：include file | mask;
    # 上下文：any
    include  /etc/nginx/mime.types;

    # 默认 MIME 类型（当无法识别文件扩展名时使用）
    # 语法：default_type mime-type;
    # 默认值：text/plain;
    # 上下文：http, server, location
    default_type  application/octet-stream;

    # -------------------------------------------------------------------------
    # 3.2 日志配置
    # -------------------------------------------------------------------------

    # 定义日志格式（log_format 只能定义在 http 块中）
    # 语法：log_format name [escape=default|json|none] string ...;
    # 上下文：http
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    # 定义 JSON 格式日志（便于日志系统采集与分析）
    log_format  json  escape=json '{'
                      '"time":"$time_iso8601",'
                      '"remote_addr":"$remote_addr",'
                      '"method":"$request_method",'
                      '"uri":"$request_uri",'
                      '"status":$status,'
                      '"body_bytes_sent":$body_bytes_sent,'
                      '"request_time":$request_time,'
                      '"upstream_addr":"$upstream_addr",'
                      '"upstream_response_time":"$upstream_response_time"'
                      '}';

    # 访问日志路径和格式
    # 语法：access_log path [format [buffer=size] [gzip[=level]] [flush=time]];
    # 上下文：http, server, location, if in location, limit_except
    access_log  /var/log/nginx/access.log  main buffer=32k flush=5s;

    # -------------------------------------------------------------------------
    # 3.3 性能优化
    # -------------------------------------------------------------------------

    # 启用 sendfile 零拷贝传输模式
    # 语法：sendfile on | off;
    # 默认值：sendfile off;
    # 上下文：http, server, location
    # 说明：直接在内核空间传输文件，减少用户空间与内核空间的数据拷贝
    sendfile  on;

    # 启用 TCP_NOPUSH（仅 sendfile 开启时有效）
    # 语法：tcp_nopush on | off;
    # 默认值：tcp_nopush off;
    # 上下文：http, server, location
    # 说明：在发送响应头之前不发送数据包，提高网络传输效率
    tcp_nopush  on;

    # 启用 TCP_NODELAY
    # 语法：tcp_nodelay on | off;
    # 默认值：tcp_nodelay on;
    # 上下文：http, server, location
    # 说明：禁用 Nagle 算法，降低小数据包的传输延迟
    tcp_nodelay  on;

    # 长连接超时时间
    # 语法：keepalive_timeout timeout [header_timeout];
    # 默认值：keepalive_timeout 75s;
    # 上下文：http, server, location
    keepalive_timeout  65;

    # 单个长连接允许的最大请求数
    # 语法：keepalive_requests number;
    # 默认值：keepalive_requests 1000;
    # 上下文：http, server, location
    keepalive_requests  1000;

    # -------------------------------------------------------------------------
    # 3.4 客户端请求限制
    # -------------------------------------------------------------------------

    # 客户端请求头读取超时时间
    # 语法：client_header_timeout time;
    # 默认值：60s
    # 上下文：http, server
    client_header_timeout  15s;

    # 客户端请求体读取超时时间
    # 语法：client_body_timeout time;
    # 默认值：60s
    # 上下文：http, server, location
    client_body_timeout  15s;

    # 向客户端发送响应的超时时间
    # 语法：send_timeout time;
    # 默认值：60s
    # 上下文：http, server, location
    send_timeout  15s;

    # 允许客户端请求体的最大大小
    # 语法：client_max_body_size size;
    # 默认值：1m
    # 上下文：http, server, location
    # 说明：影响文件上传大小，需根据业务需求调整
    client_max_body_size  10m;

    # 请求头缓冲区大小
    # 语法：client_header_buffer_size size;
    # 默认值：1k
    # 上下文：http, server
    client_header_buffer_size  1k;

    # 大型请求头缓冲区
    # 语法：large_client_header_buffers number size;
    # 默认值：4 8k
    # 上下文：http, server
    large_client_header_buffers  4 8k;

    # -------------------------------------------------------------------------
    # 3.5 Gzip 压缩
    # -------------------------------------------------------------------------

    # 启用 gzip 压缩
    # 语法：gzip on | off;
    # 默认值：gzip off;
    # 上下文：http, server, location, if in location[reference:3]
    gzip  on;

    # 允许压缩的最小响应字节数
    # 语法：gzip_min_length length;
    # 默认值：20
    # 上下文：http, server, location
    gzip_min_length  1000;

    # gzip 压缩缓冲区大小
    # 语法：gzip_buffers number size;
    # 默认值：32 4k | 16 8k;
    # 上下文：http, server, location
    gzip_buffers  4 32k;

    # 压缩级别（1-9，1 最快，9 压缩率最高）
    # 语法：gzip_comp_level level;
    # 默认值：1
    # 上下文：http, server, location
    gzip_comp_level  5;

    # 需要压缩的 MIME 类型
    # 语法：gzip_types mime-type ...;
    # 默认值：gzip_types text/html;
    # 上下文：http, server, location
    gzip_types  text/plain text/css text/xml text/javascript
                application/json application/javascript application/xml
                application/xml+rss image/svg+xml;

    # 在响应头中添加 Vary: Accept-Encoding
    # 语法：gzip_vary on | off;
    # 默认值：gzip_vary off;
    # 上下文：http, server, location
    gzip_vary  on;

    # 禁用 gzip 的 User-Agent（匹配 IE6 等不支持 gzip 的浏览器）
    # 语法：gzip_disable regex ...;
    # 上下文：http, server, location
    gzip_disable  "msie6";

    # -------------------------------------------------------------------------
    # 3.6 安全相关
    # -------------------------------------------------------------------------

    # 隐藏 Nginx 版本号
    # 语法：server_tokens on | off | build | string;
    # 默认值：server_tokens on;
    # 上下文：http, server, location
    server_tokens  off;

    # 忽略不合法的 HTTP 头部
    # 语法：ignore_invalid_headers on | off;
    # 默认值：ignore_invalid_headers on;
    # 上下文：http, server[reference:4]
    ignore_invalid_headers  on;

    # 限制请求方法（仅允许 GET、HEAD、POST）
    # 语法：limit_except method ... { ... }
    # 上下文：location
    # 注：具体配置在 server/location 块中使用

    # 文件类型哈希表最大大小
    # 语法：types_hash_max_size number;
    # 默认值：1024
    # 上下文：http, server, location
    types_hash_max_size  2048;

    # -------------------------------------------------------------------------
    # 3.7 SSL/TLS 全局配置
    # -------------------------------------------------------------------------

    # SSL 会话缓存
    # 语法：ssl_session_cache off | none | [builtin[:size]] [shared:name:size];
    # 默认值：ssl_session_cache none;
    # 上下文：http, server
    # 说明：1MB 共享缓存约存储 4000 个会话[reference:5]
    ssl_session_cache  shared:SSL:10m;

    # SSL 会话超时时间
    # 语法：ssl_session_timeout time;
    # 默认值：5m
    # 上下文：http, server
    ssl_session_timeout  10m;

    # SSL 协议版本（默认即为 TLSv1.2 TLSv1.3，显式声明更清晰）
    # 语法：ssl_protocols [SSLv2] [SSLv3] [TLSv1] [TLSv1.1] [TLSv1.2] [TLSv1.3];
    # 默认值：TLSv1.2 TLSv1.3
    # 上下文：http, server[reference:6]
    ssl_protocols  TLSv1.2 TLSv1.3;

    # SSL 加密套件
    # 语法：ssl_ciphers ciphers;
    # 默认值：HIGH:!aNULL:!MD5;
    # 上下文：http, server[reference:7]
    ssl_ciphers  HIGH:!aNULL:!MD5;

    # 优先使用服务端指定的加密套件
    # 语法：ssl_prefer_server_ciphers on | off;
    # 默认值：off
    # 上下文：http, server
    ssl_prefer_server_ciphers  on;

    # -------------------------------------------------------------------------
    # 3.8 反向代理通用配置
    # -------------------------------------------------------------------------

    # 代理连接超时
    # 语法：proxy_connect_timeout time;
    # 默认值：60s
    # 上下文：http, server, location
    proxy_connect_timeout  30s;

    # 代理发送请求超时
    # 语法：proxy_send_timeout time;
    # 默认值：60s
    # 上下文：http, server, location
    proxy_send_timeout  60s;

    # 代理读取响应超时
    # 语法：proxy_read_timeout time;
    # 默认值：60s
    # 上下文：http, server, location
    proxy_read_timeout  60s;

    # 代理缓冲区
    # 语法：proxy_buffers number size;
    # 默认值：8 4k|8k;
    # 上下文：http, server, location
    proxy_buffers  8 32k;

    # 代理缓冲区大小（响应头）
    # 语法：proxy_buffer_size size;
    # 默认值：4k|8k;
    # 上下文：http, server, location
    proxy_buffer_size  32k;

    # 代理响应头中默认隐藏的头部（不传递给客户端）
    # 语法：proxy_hide_header field;
    # 上下文：http, server, location
    # proxy_hide_header X-Powered-By;

    # -------------------------------------------------------------------------
    # 3.9 upstream 负载均衡配置块
    # 作用：定义后端服务器组，供 proxy_pass 引用[reference:8]
    # -------------------------------------------------------------------------

    # 示例 1：加权轮询（默认策略）
    upstream backend_api {
        # 后端服务器 1，权重为 3
        # 语法：server address [parameters];
        # 参数：weight=数字, max_fails=数字, fail_timeout=时间, backup 等[reference:9]
        server  10.0.0.1:8080  weight=3  max_fails=3  fail_timeout=30s;

        # 后端服务器 2，权重为 1（默认值）
        server  10.0.0.2:8080  weight=1  max_fails=3  fail_timeout=30s;

        # 备份服务器（仅当主服务器全部不可用时启用）
        server  10.0.0.3:8080  backup;

        # 与后端保持长连接的数量
        # 语法：keepalive connections;
        # 上下文：upstream
        keepalive  32;

        # 长连接超时时间
        keepalive_timeout  60s;

        # 每次长连接可处理的请求数
        keepalive_requests  100;
    }

    # 示例 2：IP 哈希策略（同一客户端 IP 固定分配到同一后端）
    # upstream backend_session {
    #     ip_hash;
    #     server 10.0.1.1:8080;
    #     server 10.0.1.2:8080;
    # }

    # 示例 3：一致性哈希策略
    # upstream backend_cache {
    #     hash $request_uri consistent;
    #     server 10.0.2.1:8080;
    #     server 10.0.2.2:8080;
    # }

    # -------------------------------------------------------------------------
    # 3.10 限流配置（可选）
    # -------------------------------------------------------------------------

    # 定义限流区域（基于客户端 IP）
    # 语法：limit_req_zone key zone=name:size rate=rate;
    # 上下文：http
    limit_req_zone  $binary_remote_addr  zone=req_limit:10m  rate=10r/s;

    # 定义连接数限制区域
    # 语法：limit_conn_zone key zone=name:size;
    # 上下文：http
    limit_conn_zone  $binary_remote_addr  zone=conn_limit:10m;

    # 客户端请求体临时文件路径
    client_body_temp_path  /var/cache/nginx/client_temp;

    # 代理临时文件路径
    proxy_temp_path  /var/cache/nginx/proxy_temp;

    # FastCGI 临时文件路径（如需 PHP 支持）
    fastcgi_temp_path  /var/cache/nginx/fastcgi_temp;

    # uwsgi 临时文件路径
    uwsgi_temp_path  /var/cache/nginx/uwsgi_temp;

    # SCGI 临时文件路径
    scgi_temp_path  /var/cache/nginx/scgi_temp;

    # 引入额外的配置文件（推荐将 server 块拆分到独立文件）
    # 语法：include file | mask;
    # 上下文：any
    include  /etc/nginx/conf.d/*.conf;


    # =========================================================================
    # 四、server（虚拟主机配置块）
    # 作用：定义一个虚拟服务器，处理特定域名或 IP 的 HTTP 请求[reference:10]
    # 说明：可在 http 块中定义多个 server，各自独立处理不同域名的请求
    # =========================================================================

    # -------------------------------------------------------------------------
    # 4.1 HTTP 服务器（端口 80，重定向到 HTTPS）
    # -------------------------------------------------------------------------
    server {
        # 监听端口
        # 语法：listen address[:port] [default_server] [ssl] [http2] ...;
        # 上下文：server
        # default_server：将该 server 设为默认虚拟主机[reference:11]
        listen  80  default_server;

        # 监听 IPv6
        listen  [::]:80  default_server;

        # 虚拟主机域名
        # 语法：server_name name ...;
        # 上下文：server
        # 匹配顺序：精确名称 → 以 * 开头的最长通配符 → 以 * 结尾的最长通配符 → 正则表达式
        server_name  example.com  www.example.com;

        # 将所有 HTTP 请求永久重定向到 HTTPS
        # 301 为永久重定向，302 为临时重定向
        return  301  https://$host$request_uri;
    }

    # -------------------------------------------------------------------------
    # 4.2 HTTPS 服务器（端口 443）
    # -------------------------------------------------------------------------
    server {
        # 监听 443 端口并启用 SSL
        # ssl 参数用于在监听套接字上启用 SSL 协议[reference:12]
        listen  443  ssl  http2  default_server;
        listen  [::]:443  ssl  http2  default_server;

        server_name  example.com  www.example.com;

        # SSL 证书路径
        # 语法：ssl_certificate file;
        # 上下文：http, server
        ssl_certificate  /etc/nginx/ssl/example.com.crt;

        # SSL 私钥路径
        # 语法：ssl_certificate_key file;
        # 上下文：http, server
        # 说明：私钥文件应设置严格的文件权限，但必须对 Nginx master 进程可读[reference:13]
        ssl_certificate_key  /etc/nginx/ssl/example.com.key;

        # 开启 OCSP Stapling（减少 SSL 握手延迟）
        # ssl_stapling on;
        # ssl_stapling_verify on;
        # ssl_trusted_certificate /etc/nginx/ssl/chain.pem;

        # SSL 会话缓存（可按 server 单独设置，也可在 http 块中全局设置）
        ssl_session_cache  shared:SSL:10m;
        ssl_session_timeout  10m;

        # 安全响应头
        # 语法：add_header name value [always];
        # 上下文：http, server, location, if in location
        add_header  X-Content-Type-Options  "nosniff"  always;
        add_header  X-Frame-Options  "SAMEORIGIN"  always;
        add_header  X-XSS-Protection  "1; mode=block"  always;
        add_header  Referrer-Policy  "strict-origin-when-cross-origin"  always;
        # HSTS（HTTP 严格传输安全），启用后浏览器将强制使用 HTTPS
        add_header  Strict-Transport-Security  "max-age=31536000; includeSubDomains"  always;

        # 网站根目录
        # 语法：root path;
        # 上下文：http, server, location, if in location
        root  /var/www/html;

        # 默认首页文件
        # 语法：index file ...;
        # 默认值：index index.html;
        # 上下文：http, server, location
        index  index.html  index.htm;

        # 字符集
        # 语法：charset charset | off;
        # 默认值：charset off;
        # 上下文：http, server, location, if in location
        charset  utf-8;

        # 错误页面配置
        # 语法：error_page code ... [=[response]] uri;
        # 上下文：http, server, location, if in location
        error_page  404  /404.html;
        error_page  500 502 503 504  /50x.html;

        location = /404.html {
            root  /var/www/html;
            internal;  # internal 表示该 location 只能被内部请求访问
        }

        location = /50x.html {
            root  /var/www/html;
            internal;
        }


        # =====================================================================
        # 五、location（URI 匹配配置块）
        # 作用：根据请求的 URI 匹配不同的处理规则[reference:14]
        # 匹配语法：
        #   =  /uri     精确匹配（优先级最高）
        #   ^~ /uri     前缀匹配（匹配后停止搜索正则）
        #   ~  /uri     正则匹配（区分大小写）
        #   ~* /uri     正则匹配（不区分大小写）
        #   /uri        普通前缀匹配
        #   @name       命名 location（仅用于内部重定向）
        # =====================================================================

        # ---------------------------------------------------------------------
        # 5.1 静态资源处理
        # ---------------------------------------------------------------------

        # 根路径 location
        location / {
            # 尝试按顺序查找文件：先找 $uri，再找 $uri/，最后回退到 /index.html
            # 语法：try_files file ... uri | file ... =code;
            # 上下文：server, location
            try_files  $uri  $uri/  /index.html;
        }

        # 静态资源目录（带缓存策略）
        # ^~ 前缀匹配：匹配 /static/ 后停止搜索正则 location
        location ^~ /static/ {
            # 设置静态资源目录
            root  /var/www/static;

            # 设置缓存过期时间
            # 语法：expires [modified] time | epoch | max | off;
            # 上下文：http, server, location, if in location
            expires  30d;

            # 添加缓存控制头部
            add_header  Cache-Control  "public, immutable"  always;

            # 关闭访问日志（静态资源日志通常不需要记录）
            access_log  off;
        }

        # 图片资源目录
        location ~* \.(jpg|jpeg|png|gif|ico|svg|webp)$ {
            root  /var/www/static/images;
            expires  90d;
            add_header  Cache-Control  "public, immutable"  always;
            access_log  off;
        }

        # CSS/JS 文件
        location ~* \.(css|js)$ {
            root  /var/www/static/assets;
            expires  30d;
            add_header  Cache-Control  "public"  always;
        }

        # ---------------------------------------------------------------------
        # 5.2 反向代理配置
        # ---------------------------------------------------------------------

        # API 代理（转发到 upstream 后端服务器组）
        location /api/ {
            # 代理转发地址
            # 语法：proxy_pass URL;
            # 上下文：location, if in location, limit_except
            # 说明：当 location 使用 URI 前缀时，proxy_pass 的路径会被替换[reference:15]
            proxy_pass  http://backend_api;

            # 设置传递给后端的请求头
            # 语法：proxy_set_header field value;
            # 上下文：http, server, location
            proxy_set_header  Host  $host;
            proxy_set_header  X-Real-IP  $remote_addr;
            proxy_set_header  X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_set_header  X-Forwarded-Proto  $scheme;

            # 代理连接超时
            proxy_connect_timeout  30s;
            proxy_send_timeout  60s;
            proxy_read_timeout  60s;

            # 代理重定向处理
            # 语法：proxy_redirect default | off | redirect replacement;
            # 默认值：proxy_redirect default;
            # 上下文：http, server, location
            proxy_redirect  off;

            # 启用代理缓冲
            proxy_buffering  on;
            proxy_buffers  8  32k;
            proxy_buffer_size  32k;
        }

        # WebSocket 代理
        location /ws/ {
            proxy_pass  http://backend_api;
            proxy_http_version  1.1;
            proxy_set_header  Upgrade  $http_upgrade;
            proxy_set_header  Connection  "upgrade";
            proxy_set_header  Host  $host;
            proxy_read_timeout  3600s;  # WebSocket 需要较长的超时时间
        }

        # ---------------------------------------------------------------------
        # 5.3 限流应用
        # ---------------------------------------------------------------------

        location /login/ {
            # 应用请求频率限制
            # 语法：limit_req zone=name [burst=number] [nodelay | delay=number];
            # 上下文：http, server, location
            limit_req  zone=req_limit  burst=5  nodelay;

            # 应用连接数限制
            # 语法：limit_conn zone_name number;
            # 上下文：http, server, location
            limit_conn  conn_limit  10;

            # 超过限制时返回的状态码
            # 语法：limit_req_status code;
            # 默认值：503
            # 上下文：http, server, location
            limit_req_status  429;

            proxy_pass  http://backend_api;
        }

        # ---------------------------------------------------------------------
        # 5.4 拒绝访问敏感文件
        # ---------------------------------------------------------------------

        # 拒绝访问隐藏文件（如 .htaccess、.git 等）
        location ~ /\. {
            deny  all;
            access_log  off;
            log_not_found  off;
        }

        # 拒绝访问备份和临时文件
        location ~* \.(bak|sql|log|tar|gz|zip)$ {
            deny  all;
        }

        # ---------------------------------------------------------------------
        # 5.5 状态页（仅限内网访问）
        # ---------------------------------------------------------------------

        location /nginx_status {
            # 启用 stub_status 模块
            # 需要编译时包含 --with-http_stub_status_module
            stub_status  on;

            # 仅允许内网访问
            allow  127.0.0.1;
            allow  10.0.0.0/8;
            deny  all;

            access_log  off;
        }
    }


    # =========================================================================
    # 六、额外虚拟主机示例（多站点配置）
    # =========================================================================

    # server {
    #     listen  80;
    #     server_name  blog.example.com;
    #
    #     root  /var/www/blog;
    #     index  index.html;
    #
    #     location / {
    #         try_files  $uri  $uri/  /index.html;
    #     }
    # }
}


# =============================================================================
# 七、stream（TCP/UDP 代理配置块，可选）
# 作用：用于四层（TCP/UDP）协议的代理和负载均衡，如 MySQL、Redis 等
# =============================================================================

# stream {
#     upstream mysql_cluster {
#         server  10.0.10.1:3306  weight=1  max_fails=3  fail_timeout=30s;
#         server  10.0.10.2:3306  weight=1  max_fails=3  fail_timeout=30s;
#     }
#
#     server {
#         listen  3306;
#         proxy_pass  mysql_cluster;
#         proxy_connect_timeout  10s;
#         proxy_timeout  300s;
#     }
# }
# =============================================================================
# Nginx stream 模块配置文件模板
# 参考文档：https://nginx.org/en/docs/stream/
#
# 说明：
#   stream 模块用于在传输层（四层）对 TCP、UDP 及 UNIX 域套接字流量进行
#   代理和负载均衡，不解析应用层协议。适用于 MySQL、Redis、DNS、SMTP 等场景。
#
#   该模块默认不编译，需在编译时添加 --with-stream 参数。
#   SSL 预读功能需额外添加 --with-stream_ssl_preread_module。
#
#   配置文件结构：stream（全局）→ upstream（后端服务器组）
#                              → server（监听与转发）
#                              → map（变量映射，用于动态路由）
# =============================================================================


# =============================================================================
# 一、stream 全局配置块
# 作用：包含所有 TCP/UDP 代理相关的配置，与 http 块同级
# =============================================================================

stream {

    # -------------------------------------------------------------------------
    # 1.1 日志配置
    # 模块：ngx_stream_log_module（1.11.4）
    # -------------------------------------------------------------------------

    # 定义日志格式（log_format 只能定义在 stream 上下文中）
    # 语法：log_format name [escape=default|json|none] string ...;
    # 上下文：stream
    # 可用变量参见 ngx_stream_log_module 文档中的 Embedded Variables
    log_format  basic  '$remote_addr [$time_local] '
                       '$protocol $status $bytes_sent $bytes_received '
                       '$session_time';

    # 扩展日志格式：包含上游服务器信息
    log_format  proxy  '$remote_addr [$time_local] '
                       '$protocol $status $bytes_sent $bytes_received '
                       '$session_time "$upstream_addr" '
                       '"$upstream_bytes_sent" "$upstream_bytes_received" '
                       '"$upstream_connect_time"';

    # JSON 格式日志（escape=json 自动转义特殊字符，便于日志系统采集）
    log_format  json  escape=json '{'
                       '"time":"$time_local",'
                       '"remote_addr":"$remote_addr",'
                       '"protocol":"$protocol",'
                       '"status":$status,'
                       '"bytes_sent":$bytes_sent,'
                       '"bytes_received":$bytes_received,'
                       '"session_time":$session_time,'
                       '"upstream_addr":"$upstream_addr",'
                       '"upstream_connect_time":"$upstream_connect_time"'
                       '}';

    # 访问日志路径、格式及缓冲配置
    # 语法：access_log path format [buffer=size] [gzip[=level]]
    #                          [flush=time] [if=condition];
    #       access_log off;
    # 默认值：access_log off;
    # 上下文：stream, server
    # 说明：
    #   - buffer=size 启用缓冲写入，提高性能
    #   - flush=time  缓冲数据超过指定时间后强制写入磁盘
    #   - gzip=level  压缩日志（需编译时包含 zlib 库），级别 1-9
    #   - if=condition 条件日志记录，条件为 0 或空字符串时不记录
    access_log  /var/log/nginx/stream.log  proxy  buffer=32k  flush=5s;

    # 日志到 syslog（通过 syslog: 前缀指定）
    # access_log syslog:server=unix:/dev/log,facility=local7,tag=nginx_stream basic;

    # -------------------------------------------------------------------------
    # 1.2 DNS 解析器配置（Nginx Plus / 动态解析场景）
    # 模块：ngx_stream_core_module
    # -------------------------------------------------------------------------

    # 指定 DNS 解析器地址
    # 语法：resolver address ... [valid=time] [ipv4=on|off] [ipv6=on|off] [status_zone=zone];
    # 上下文：stream, server
    # 说明：当 upstream 中使用 resolve 参数动态解析域名时需要此配置。
    #       推荐使用本地可信解析器而非公共 DNS。
    # resolver  127.0.0.53  valid=10s;
    # resolver_timeout  10s;

    # -------------------------------------------------------------------------
    # 1.3 连接数限制
    # 模块：ngx_stream_limit_conn_module（1.9.3）
    # -------------------------------------------------------------------------

    # 定义连接数限制共享内存区域（基于客户端 IP）
    # 语法：limit_conn_zone key zone=name:size;
    # 上下文：stream
    # 说明：
    #   - $binary_remote_addr 使用二进制格式存储客户端 IP，节省内存
    #   - 10m 约可存储 160,000 个独立地址的状态
    #   - 该区域定义后，需在 server 块中使用 limit_conn 指令引用
    limit_conn_zone  $binary_remote_addr  zone=conn_limit:10m;

    # -------------------------------------------------------------------------
    # 1.4 引入额外配置文件
    # -------------------------------------------------------------------------

    # 将 upstream 和 server 配置拆分到独立文件中，便于维护
    # include  /etc/nginx/stream.d/*.conf;


    # =========================================================================
    # 二、server 块（监听与转发）
    # 作用：定义监听端口，将接收到的 TCP/UDP 连接转发到后端服务器
    # 文档：https://nginx.org/en/docs/stream/ngx_stream_core_module.html
    # =========================================================================

    # -------------------------------------------------------------------------
    # 2.1 基础 TCP 代理
    # 说明：监听 TCP 端口，将流量转发到 upstream 组
    # -------------------------------------------------------------------------
    server {
        # 监听地址和端口
        # 语法：listen address:port [default_server] [ssl] [udp]
        #        [proxy_protocol] [fastopen=number] [backlog=number]
        #        [rcvbuf=size] [sndbuf=size] [bind] [ipv6only=on|off]
        #        [reuseport] [so_keepalive=on|off|[keepidle]:[keepintvl]:[keepcnt]];
        # 上下文：server
        # 说明：
        #   - 可仅指定端口（如 listen 3306），等价于监听所有地址
        #   - IPv6 地址使用方括号，如 listen [::]:3306
        #   - default_server 将该 server 设为默认虚拟服务器
        #   - 支持端口范围，如 listen 3306-3308;
        listen  3306;

        # 转发到后端服务器组（引用 upstream 名称）
        # 语法：proxy_pass address;
        # 上下文：stream, server
        # 说明：address 可以是 upstream 名称、IP:端口、域名或 UNIX 套接字路径
        proxy_pass  mysql_backend;

        # 后端连接建立超时
        # 语法：proxy_connect_timeout time;
        # 默认值：proxy_connect_timeout 60s;
        # 上下文：stream, server
        proxy_connect_timeout  10s;

        # 会话保持超时（两个方向均适用）
        # 语法：proxy_timeout time;
        # 默认值：proxy_timeout 10m;
        # 上下文：stream, server
        # 说明：数据库等长连接场景需调大此值
        proxy_timeout  600s;

        # 代理缓冲区大小（从后端读取数据及从客户端读取数据的缓冲区）
        # 语法：proxy_buffer_size size;
        # 默认值：proxy_buffer_size 16k;
        # 上下文：stream, server
        proxy_buffer_size  16k;

        # 连接数限制应用（引用 limit_conn_zone 定义的区域）
        # 语法：limit_conn zone_name number;
        # 上下文：stream, server
        # 说明：同一 IP 最多允许 20 个并发连接
        limit_conn  conn_limit  20;
    }


    # -------------------------------------------------------------------------
    # 2.2 UDP 代理（以 DNS 为例）
    # 说明：监听 UDP 端口，转发数据报
    # -------------------------------------------------------------------------
    server {
        # udp 参数标记为数据报；reuseport 使多个 worker 进程共享端口
        # 注意：UDP 代理必须配合 reuseport 使用，确保同一会话的包被同一进程处理
        listen  53  udp  reuseport;

        proxy_pass  dns_backend;

        # UDP 会话超时（DNS 查询通常很短）
        proxy_timeout  5s;

        # 每个客户端数据报期望收到的响应包数量
        # 语法：proxy_responses number;
        # 默认值：proxy_responses 1;
        # 上下文：stream, server
        # 说明：
        #   - 对于 DNS 查询，设为 1（等待 1 个响应）
        #   - 设为 0 表示不期望任何响应（如单向 syslog 转发）
        #   - 超过此数量后 Nginx 将关闭连接
        proxy_responses  1;
    }


    # -------------------------------------------------------------------------
    # 2.3 SSL 终止代理
    # 模块：ngx_stream_ssl_module
    # 说明：客户端与 Nginx 之间使用 SSL/TLS 加密，Nginx 解密后转发给后端
    # -------------------------------------------------------------------------
    server {
        listen  12345  ssl;

        # SSL 证书与私钥
        # 语法：ssl_certificate file;
        #       ssl_certificate_key file;
        # 上下文：stream, server
        ssl_certificate      /etc/nginx/ssl/stream.crt;
        ssl_certificate_key  /etc/nginx/ssl/stream.key;

        # SSL 协议版本
        # 语法：ssl_protocols [SSLv2] [SSLv3] [TLSv1] [TLSv1.1] [TLSv1.2] [TLSv1.3];
        # 默认值：TLSv1.2 TLSv1.3
        # 上下文：stream, server
        ssl_protocols  TLSv1.2  TLSv1.3;

        # SSL 加密套件
        # 语法：ssl_ciphers ciphers;
        # 默认值：HIGH:!aNULL:!MD5;
        # 上下文：stream, server
        ssl_ciphers  HIGH:!aNULL:!MD5;

        # SSL 会话缓存
        # 语法：ssl_session_cache off | none | [builtin[:size]] [shared:name:size];
        # 默认值：ssl_session_cache none;
        # 上下文：stream, server
        ssl_session_cache  shared:SSL:10m;

        # SSL 会话超时
        # 语法：ssl_session_timeout time;
        # 默认值：ssl_session_timeout 5m;
        # 上下文：stream, server
        ssl_session_timeout  10m;

        proxy_pass  mysql_backend;
    }


    # -------------------------------------------------------------------------
    # 2.4 SSL 预读路由（SNI 透传）
    # 模块：ngx_stream_ssl_preread_module（1.11.5）
    # 说明：在不终止 SSL/TLS 的情况下读取 ClientHello 中的 SNI 信息，
    #       实现基于域名的透传路由，保留端到端加密。
    #       需编译时添加 --with-stream_ssl_preread_module
    # -------------------------------------------------------------------------
    server {
        listen  443;

        # 启用 ClientHello 预读
        # 语法：ssl_preread on | off;
        # 默认值：ssl_preread off;
        # 上下文：stream, server
        ssl_preread  on;

        # 根据 SNI 动态选择后端（$name 由下方 map 块定义）
        proxy_pass  $name;

        proxy_connect_timeout  10s;
        proxy_timeout  300s;
    }


    # -------------------------------------------------------------------------
    # 2.5 接收 PROXY 协议头（真实客户端 IP 透传）
    # 模块：ngx_stream_realip_module（1.11.4）
    # 说明：当前端有 L4 负载均衡器时，通过 PROXY 协议头获取真实客户端 IP
    # -------------------------------------------------------------------------
    server {
        # proxy_protocol 参数使该端口接收 PROXY 协议头
        # 语法：listen address:port proxy_protocol;
        # 上下文：server
        listen  12345  proxy_protocol;

        # 设置可信代理地址（仅信任来自这些地址的 PROXY 协议头）
        # 语法：set_real_ip_from address | CIDR | unix:;
        # 上下文：stream, server
        set_real_ip_from  10.0.0.0/8;
        set_real_ip_from  172.16.0.0/12;
        set_real_ip_from  192.168.0.0/16;

        proxy_pass  backend;

        # 向后端转发时也附加 PROXY 协议头
        # 语法：proxy_protocol on | off;
        # 默认值：proxy_protocol off;
        # 上下文：stream, server
        # 注意：后端服务必须支持解析 PROXY 协议头，否则连接会异常
        proxy_protocol  on;
    }


    # =========================================================================
    # 三、upstream 块（后端服务器组）
    # 作用：定义一组提供相同服务的后端服务器，供 proxy_pass 引用
    # 文档：https://nginx.org/en/docs/stream/ngx_stream_upstream_module.html
    # =========================================================================

    # -------------------------------------------------------------------------
    # 3.1 MySQL 后端组（最少连接数策略 + 会话保持）
    # -------------------------------------------------------------------------
    upstream mysql_backend {
        # 负载均衡策略（三选一，不写则默认加权轮询）
        # 可选值：
        #   least_conn;                    最少连接数（适合数据库等长连接场景）
        #   hash $remote_addr consistent;  客户端 IP 一致性哈希（会话保持）
        #   random two least_conn;         随机选择两台中最少连接的（Nginx Plus）
        least_conn;

        # 后端服务器定义
        # 语法：server address [parameters];
        # 上下文：upstream
        # 参数说明：
        #   weight=number      权重，默认 1
        #   max_conns=number   最大并发连接数，0 表示不限制（1.11.5）
        #   max_fails=number   失败次数阈值，达到后标记为不可用，默认 1
        #   fail_timeout=time  失败判定时间窗口及不可用持续时间，默认 10s
        #   backup             备份服务器，仅主服务器全部不可用时启用
        #   down               手动标记为永久不可用
        #   resolve            动态解析域名（需配合 resolver 指令，Nginx Plus）
        #   slow_start=time    慢启动时间（Nginx Plus）
        server  10.0.0.1:3306  weight=3  max_fails=3  fail_timeout=30s;
        server  10.0.0.2:3306  weight=1  max_fails=3  fail_timeout=30s;
        server  10.0.0.3:3306  backup;

        # 与后端保持长连接的数量（开源版需显式配置，用于复用 TCP 连接）
        # 语法：keepalive connections;
        # 上下文：upstream
        # 说明：设置每个 worker 进程缓存的长连接数量上限
        keepalive  32;

        # 长连接空闲超时
        keepalive_timeout  60s;

        # 每个长连接可复用的最大请求数
        keepalive_requests  100;
    }


    # -------------------------------------------------------------------------
    # 3.2 DNS 后端组（UDP 轮询）
    # -------------------------------------------------------------------------
    upstream dns_backend {
        server  8.8.8.8:53;
        server  8.8.4.4:53;
    }


    # -------------------------------------------------------------------------
    # 3.3 Redis 后端组（IP 哈希实现会话粘性）
    # -------------------------------------------------------------------------
    upstream redis_backend {
        # 基于客户端 IP 的一致性哈希，确保同一客户端固定分配到同一后端
        # consistent 参数在节点增删时最小化键的重新映射
        hash  $remote_addr  consistent;

        server  10.0.1.1:6379  max_fails=3  fail_timeout=30s;
        server  10.0.1.2:6379  max_fails=3  fail_timeout=30s;
        server  10.0.1.3:6379  backup;
    }


    # -------------------------------------------------------------------------
    # 3.4 动态可配置后端组（Nginx Plus）
    # 说明：使用 zone 指令定义共享内存区域，支持动态增删后端和主动健康检查
    #       健康检查模块 ngx_stream_upstream_hc_module 要求服务器组驻留在共享内存中
    # -------------------------------------------------------------------------
    upstream dynamic_backend {
        # 定义共享内存区域（动态配置和健康检查必需）
        # 语法：zone name [size];
        # 上下文：upstream
        # 说明：64k 约可存储 128 台服务器的状态
        zone  dynamic_backend 64k;

        server  10.0.2.1:8080  weight=5;
        server  10.0.2.2:8080  max_fails=3  fail_timeout=5s  slow_start=30s;
        server  10.0.2.3:8080  backup;
    }


    # =========================================================================
    # 四、map 块（变量映射，用于动态路由）
    # 作用：根据变量的值选择不同的后端，配合 ssl_preread 实现 SNI 路由
    # 文档：https://nginx.org/en/docs/stream/ngx_stream_ssl_preread_module.html
    # =========================================================================

    # 根据 SNI 选择上游服务器
    # 语法：map $source $variable { ... }
    # 上下文：stream
    map  $ssl_preread_server_name  $name {
        default              backend_default;
        api.example.com      backend_api;
        blog.example.com     backend_blog;
        mysql.example.com    mysql_backend;
    }

    # 根据 ALPN 协议选择上游（如 HTTP/2 与 HTTP/1.1 分流）
    # map  $ssl_preread_alpn_protocols  $alpn_backend {
    #     ~\bh2\b        127.0.0.1:8001;
    #     ~\bhttp/1.1\b  127.0.0.1:8002;
    #     default        127.0.0.1:8000;
    # }

    # 根据 SSL 协议版本选择上游（同一端口同时支持 SSH 和 HTTPS）
    # map  $ssl_preread_protocol  $proto_backend {
    #     ""             ssh.example.com:22;
    #     "TLSv1.2"      new.example.com:443;
    #     default        tls.example.com:443;
    # }


    # =========================================================================
    # 五、SSL 预读路由专用 upstream 组
    # =========================================================================

    upstream backend_api     { server  10.0.1.1:443; }
    upstream backend_blog    { server  10.0.1.2:443; }
    upstream backend_default { server  10.0.1.3:443; }


    # =========================================================================
    # 六、主动健康检查（Nginx Plus）
    # 模块：ngx_stream_upstream_hc_module（1.9.0）
    # 说明：要求 upstream 组驻留在共享内存中（使用 zone 指令）
    #       开源版仅支持被动健康检查（通过 max_fails/fail_timeout）
    # =========================================================================

    # 主动健康检查的服务器块示例
    # server {
    #     listen  12346;
    #     proxy_pass  dynamic_backend;
    #
    #     # 启用主动健康检查
    #     # 语法：health_check [parameters];
    #     # 上下文：server
    #     # 参数：
    #     #   interval=time    检查间隔，默认 5s
    #     #   jitter=time      随机延迟范围，避免所有检查同时触发
    #     #   fails=number     连续失败次数阈值，默认 1
    #     #   passes=number    连续通过次数阈值，默认 1
    #     #   mandatory        初始状态为 "checking"，首次检查完成前不转发流量
    #     #   persistent       重载后保持之前的状态
    #     #   match=name       引用 match 块进行内容检查
    #     health_check  interval=10s  jitter=2s  fails=3  passes=2;
    #
    #     # 健康检查超时
    #     health_check_timeout  5s;
    #
    #     # 慢启动（服务器恢复后逐步增加流量）
    #     # slow_start  30s;
    # }

    # UDP 健康检查示例
    # server {
    #     listen  53  udp;
    #     proxy_pass  dns_backend;
    #     health_check  udp  interval=5s  fails=3  passes=2;
    #     # UDP 检查方式：发送 "nginx health check" 字符串，
    #     # 期望不收到 ICMP "Destination Unreachable" 响应
    # }


    # =========================================================================
    # 七、proxy_ssl 系列指令（Nginx 与后端之间的加密）
    # 模块：ngx_stream_proxy_module
    # 说明：在 server 块中启用，使 Nginx 与后端之间的连接也使用 SSL/TLS
    # =========================================================================

    # server {
    #     listen  12345;
    #     proxy_pass  backend;
    #
    #     # 启用与后端之间的 SSL
    #     # 语法：proxy_ssl on | off;
    #     # 默认值：proxy_ssl off;
    #     # 上下文：stream, server
    #     proxy_ssl  on;
    #
    #     # 客户端证书（后端要求双向认证时使用）
    #     proxy_ssl_certificate      /etc/ssl/certs/backend.crt;
    #     proxy_ssl_certificate_key  /etc/ssl/certs/backend.key;
    #
    #     # SSL 协议版本与加密套件
    #     proxy_ssl_protocols  TLSv1.2  TLSv1.3;
    #     proxy_ssl_ciphers    HIGH:!aNULL:!MD5;
    #
    #     # 验证后端证书
    #     proxy_ssl_verify  on;
    #     proxy_ssl_verify_depth  2;
    #     proxy_ssl_trusted_certificate  /etc/ssl/certs/trusted_ca.crt;
    #
    #     # 指定验证后端证书时使用的 SNI 名称
    #     proxy_ssl_name  backend.example.com;
    #     proxy_ssl_server_name  on;
    # }
}


# =============================================================================
# 八、stream 模块可用变量参考
# 说明：以下变量可在 log_format、map 等指令中使用
# =============================================================================

# $binary_remote_addr        客户端地址的二进制形式（用于 limit_conn_zone）
# $bytes_received            从客户端接收的字节数
# $bytes_sent                发送给客户端的字节数
# $connection                连接序列号
# $hostname                  主机名
# $msec                      当前时间（秒，毫秒精度）
# $nginx_version             Nginx 版本
# $pid                       worker 进程 PID
# $protocol                  使用的协议：TCP 或 UDP
# $proxy_protocol_addr       PROXY 协议头中的客户端地址（需 listen proxy_protocol）
# $proxy_protocol_port       PROXY 协议头中的客户端端口
# $remote_addr               客户端地址
# $remote_port               客户端端口
# $server_addr               服务器地址
# $server_port               服务器端口
# $session_time              会话持续时间（秒，毫秒精度）
# $status                    会话状态（200 正常，其他为错误码）
# $time_iso8601              ISO 8601 格式的本地时间
# $time_local                本地时间（通用日志格式）
# $upstream_addr             上游服务器地址
# $upstream_bytes_received   从上游服务器接收的字节数
# $upstream_bytes_sent       发送给上游服务器的字节数
# $upstream_connect_time     与上游服务器建立连接所花时间
# $ssl_preread_protocol      客户端支持的最高 SSL 协议版本（1.15.2）
# $ssl_preread_server_name   通过 SNI 请求的服务器名称
# $ssl_preread_alpn_protocols 客户端通过 ALPN 声明的协议列表（逗号分隔）


# =============================================================================
# 九、使用说明
# =============================================================================
# 1. 编译要求：
#    stream 模块默认不编译，需添加 --with-stream 参数。
#    使用 SSL 功能需 --with-stream_ssl_module。
#    使用 SSL 预读需 --with-stream_ssl_preread_module。
#    使用 PROXY 协议真实 IP 需 --with-stream_realip_module。
#
# 2. 配置检查与重载：
#    修改配置后执行 nginx -t 检查语法，无误后执行 nginx -s reload 平滑重载。
#
# 3. 开源版与 Nginx Plus 的区别：
#    - 主动健康检查（health_check）仅 Nginx Plus 支持
#    - 动态 upstream 配置（zone + resolve）仅 Nginx Plus 支持
#    - 慢启动（slow_start）仅 Nginx Plus 支持
#    - 开源版通过 max_fails/fail_timeout 实现被动健康检查
#
# 4. 日志变量说明：
#    $status 为 200 表示会话正常，其他值对应错误码。
#    $session_time 为会话总持续时间，可用于分析连接质量。
#    $upstream_connect_time 反映后端连接建立速度。
#
# 5. 常见场景推荐配置：
#    - 数据库（MySQL/PostgreSQL）：least_conn + keepalive + proxy_timeout 600s
#    - Redis：hash $remote_addr consistent + proxy_timeout 300s
#    - DNS：udp + reuseport + proxy_responses 1 + proxy_timeout 5s
#    - WebSocket：proxy_timeout 3600s（长连接场景）
#    - SSL 透传：ssl_preread on + map $ssl_preread_server_name
#    - 前端有 L4 LB：listen proxy_protocol + set_real_ip_from
