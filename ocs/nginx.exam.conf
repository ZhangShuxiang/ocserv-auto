# =============================================================================
# Nginx 主配置文件模板
# 参考文档：https://nginx.org/en/docs/
# 配置文件结构：main（全局）→ events（连接处理）→ http（HTTP 服务）→ server（虚拟主机）→ location（URI 匹配）
# =============================================================================


# =============================================================================
# 一、main（全局配置块）
# 作用：影响 Nginx 全局运行的指令，包括运行用户、进程数、日志路径等
# =============================================================================

# 指定 Nginx 运行的用户和用户组
# 语法：user user [group];
# 上下文：main
# 说明：建议使用权限较低的专用用户（如 nginx、www-data），避免使用 root
user  nginx;

# 指定 Nginx 工作进程数
# 语法：worker_processes number | auto;
# 默认值：1
# 上下文：main
# 说明：设置为 auto 将自动检测 CPU 核心数并启动相同数量的工作进程[reference:0]
worker_processes  auto;

# 设置 CPU 亲和力，将工作进程绑定到特定 CPU 核心
# 语法：worker_cpu_affinity cpumask ...;
# 上下文：main
# 说明：减少 CPU 上下文切换开销，提升性能。以下示例为 4 核 CPU
# worker_cpu_affinity 0001 0010 0100 1000;

# 指定错误日志路径和日志级别
# 语法：error_log file [level];
# 默认值：error_log logs/error.log error;
# 上下文：main, http, mail, stream, server, location
# 日志级别（从低到高）：debug, info, notice, warn, error, crit, alert, emerg
error_log  /var/log/nginx/error.log  warn;

# 指定 Nginx 主进程 PID 文件的存放路径
# 语法：pid file;
# 默认值：pid logs/nginx.pid;
# 上下文：main
pid  /var/run/nginx.pid;

# 限制单个工作进程可打开的最大文件描述符数量
# 语法：worker_rlimit_nofile number;
# 上下文：main
# 说明：应设置为系统 ulimit -n 的值，避免 "too many open files" 错误
worker_rlimit_nofile  65535;

# 设置 Nginx 是否以守护进程方式运行
# 语法：daemon on | off;
# 默认值：daemon on;
# 上下文：main
# 说明：主要用于开发调试，生产环境保持默认即可
# daemon on;


# =============================================================================
# 二、events（连接处理配置块）
# 作用：配置 Nginx 的事件驱动模型和连接数上限
# =============================================================================

events {
    # 指定事件驱动模型
    # 语法：use method;
    # 上下文：events
    # Linux 推荐 epoll，FreeBSD 推荐 kqueue
    # 如不指定，Nginx 会自动选择最优模型
    use  epoll;

    # 单个工作进程允许的最大并发连接数
    # 语法：worker_connections number;
    # 默认值：512
    # 上下文：events
    # 说明：总连接数 = worker_processes × worker_connections[reference:1]
    worker_connections  10240;

    # 是否开启 accept_mutex（连接互斥锁）
    # 语法：accept_mutex on | off;
    # 默认值：off（1.11.3 之后）
    # 上下文：events
    # 说明：在支持 EPOLLEXCLUSIVE 或 reuseport 的系统上无需开启[reference:2]
    accept_mutex  off;

    # 是否启用多连接接受
    # 语法：multi_accept on | off;
    # 默认值：off
    # 上下文：events
    # 说明：开启后一个工作进程可同时接受多个新连接
    multi_accept  on;
}


# =============================================================================
# 三、http（HTTP 服务配置块）
# 作用：包含所有 HTTP 协议相关的配置，可嵌套 server、upstream、map 等块
# =============================================================================

http {
    # -------------------------------------------------------------------------
    # 3.1 MIME 类型与默认类型
    # -------------------------------------------------------------------------

    # 引入 MIME 类型映射文件
    # 语法：include file | mask;
    # 上下文：any
    include  /etc/nginx/mime.types;

    # 默认 MIME 类型（当无法识别文件扩展名时使用）
    # 语法：default_type mime-type;
    # 默认值：text/plain;
    # 上下文：http, server, location
    default_type  application/octet-stream;

    # -------------------------------------------------------------------------
    # 3.2 日志配置
    # -------------------------------------------------------------------------

    # 定义日志格式（log_format 只能定义在 http 块中）
    # 语法：log_format name [escape=default|json|none] string ...;
    # 上下文：http
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    # 定义 JSON 格式日志（便于日志系统采集与分析）
    log_format  json  escape=json '{'
                      '"time":"$time_iso8601",'
                      '"remote_addr":"$remote_addr",'
                      '"method":"$request_method",'
                      '"uri":"$request_uri",'
                      '"status":$status,'
                      '"body_bytes_sent":$body_bytes_sent,'
                      '"request_time":$request_time,'
                      '"upstream_addr":"$upstream_addr",'
                      '"upstream_response_time":"$upstream_response_time"'
                      '}';

    # 访问日志路径和格式
    # 语法：access_log path [format [buffer=size] [gzip[=level]] [flush=time]];
    # 上下文：http, server, location, if in location, limit_except
    access_log  /var/log/nginx/access.log  main buffer=32k flush=5s;

    # -------------------------------------------------------------------------
    # 3.3 性能优化
    # -------------------------------------------------------------------------

    # 启用 sendfile 零拷贝传输模式
    # 语法：sendfile on | off;
    # 默认值：sendfile off;
    # 上下文：http, server, location
    # 说明：直接在内核空间传输文件，减少用户空间与内核空间的数据拷贝
    sendfile  on;

    # 启用 TCP_NOPUSH（仅 sendfile 开启时有效）
    # 语法：tcp_nopush on | off;
    # 默认值：tcp_nopush off;
    # 上下文：http, server, location
    # 说明：在发送响应头之前不发送数据包，提高网络传输效率
    tcp_nopush  on;

    # 启用 TCP_NODELAY
    # 语法：tcp_nodelay on | off;
    # 默认值：tcp_nodelay on;
    # 上下文：http, server, location
    # 说明：禁用 Nagle 算法，降低小数据包的传输延迟
    tcp_nodelay  on;

    # 长连接超时时间
    # 语法：keepalive_timeout timeout [header_timeout];
    # 默认值：keepalive_timeout 75s;
    # 上下文：http, server, location
    keepalive_timeout  65;

    # 单个长连接允许的最大请求数
    # 语法：keepalive_requests number;
    # 默认值：keepalive_requests 1000;
    # 上下文：http, server, location
    keepalive_requests  1000;

    # -------------------------------------------------------------------------
    # 3.4 客户端请求限制
    # -------------------------------------------------------------------------

    # 客户端请求头读取超时时间
    # 语法：client_header_timeout time;
    # 默认值：60s
    # 上下文：http, server
    client_header_timeout  15s;

    # 客户端请求体读取超时时间
    # 语法：client_body_timeout time;
    # 默认值：60s
    # 上下文：http, server, location
    client_body_timeout  15s;

    # 向客户端发送响应的超时时间
    # 语法：send_timeout time;
    # 默认值：60s
    # 上下文：http, server, location
    send_timeout  15s;

    # 允许客户端请求体的最大大小
    # 语法：client_max_body_size size;
    # 默认值：1m
    # 上下文：http, server, location
    # 说明：影响文件上传大小，需根据业务需求调整
    client_max_body_size  10m;

    # 请求头缓冲区大小
    # 语法：client_header_buffer_size size;
    # 默认值：1k
    # 上下文：http, server
    client_header_buffer_size  1k;

    # 大型请求头缓冲区
    # 语法：large_client_header_buffers number size;
    # 默认值：4 8k
    # 上下文：http, server
    large_client_header_buffers  4 8k;

    # -------------------------------------------------------------------------
    # 3.5 Gzip 压缩
    # -------------------------------------------------------------------------

    # 启用 gzip 压缩
    # 语法：gzip on | off;
    # 默认值：gzip off;
    # 上下文：http, server, location, if in location[reference:3]
    gzip  on;

    # 允许压缩的最小响应字节数
    # 语法：gzip_min_length length;
    # 默认值：20
    # 上下文：http, server, location
    gzip_min_length  1000;

    # gzip 压缩缓冲区大小
    # 语法：gzip_buffers number size;
    # 默认值：32 4k | 16 8k;
    # 上下文：http, server, location
    gzip_buffers  4 32k;

    # 压缩级别（1-9，1 最快，9 压缩率最高）
    # 语法：gzip_comp_level level;
    # 默认值：1
    # 上下文：http, server, location
    gzip_comp_level  5;

    # 需要压缩的 MIME 类型
    # 语法：gzip_types mime-type ...;
    # 默认值：gzip_types text/html;
    # 上下文：http, server, location
    gzip_types  text/plain text/css text/xml text/javascript
                application/json application/javascript application/xml
                application/xml+rss image/svg+xml;

    # 在响应头中添加 Vary: Accept-Encoding
    # 语法：gzip_vary on | off;
    # 默认值：gzip_vary off;
    # 上下文：http, server, location
    gzip_vary  on;

    # 禁用 gzip 的 User-Agent（匹配 IE6 等不支持 gzip 的浏览器）
    # 语法：gzip_disable regex ...;
    # 上下文：http, server, location
    gzip_disable  "msie6";

    # -------------------------------------------------------------------------
    # 3.6 安全相关
    # -------------------------------------------------------------------------

    # 隐藏 Nginx 版本号
    # 语法：server_tokens on | off | build | string;
    # 默认值：server_tokens on;
    # 上下文：http, server, location
    server_tokens  off;

    # 忽略不合法的 HTTP 头部
    # 语法：ignore_invalid_headers on | off;
    # 默认值：ignore_invalid_headers on;
    # 上下文：http, server[reference:4]
    ignore_invalid_headers  on;

    # 限制请求方法（仅允许 GET、HEAD、POST）
    # 语法：limit_except method ... { ... }
    # 上下文：location
    # 注：具体配置在 server/location 块中使用

    # 文件类型哈希表最大大小
    # 语法：types_hash_max_size number;
    # 默认值：1024
    # 上下文：http, server, location
    types_hash_max_size  2048;

    # -------------------------------------------------------------------------
    # 3.7 SSL/TLS 全局配置
    # -------------------------------------------------------------------------

    # SSL 会话缓存
    # 语法：ssl_session_cache off | none | [builtin[:size]] [shared:name:size];
    # 默认值：ssl_session_cache none;
    # 上下文：http, server
    # 说明：1MB 共享缓存约存储 4000 个会话[reference:5]
    ssl_session_cache  shared:SSL:10m;

    # SSL 会话超时时间
    # 语法：ssl_session_timeout time;
    # 默认值：5m
    # 上下文：http, server
    ssl_session_timeout  10m;

    # SSL 协议版本（默认即为 TLSv1.2 TLSv1.3，显式声明更清晰）
    # 语法：ssl_protocols [SSLv2] [SSLv3] [TLSv1] [TLSv1.1] [TLSv1.2] [TLSv1.3];
    # 默认值：TLSv1.2 TLSv1.3
    # 上下文：http, server[reference:6]
    ssl_protocols  TLSv1.2 TLSv1.3;

    # SSL 加密套件
    # 语法：ssl_ciphers ciphers;
    # 默认值：HIGH:!aNULL:!MD5;
    # 上下文：http, server[reference:7]
    ssl_ciphers  HIGH:!aNULL:!MD5;

    # 优先使用服务端指定的加密套件
    # 语法：ssl_prefer_server_ciphers on | off;
    # 默认值：off
    # 上下文：http, server
    ssl_prefer_server_ciphers  on;

    # -------------------------------------------------------------------------
    # 3.8 反向代理通用配置
    # -------------------------------------------------------------------------

    # 代理连接超时
    # 语法：proxy_connect_timeout time;
    # 默认值：60s
    # 上下文：http, server, location
    proxy_connect_timeout  30s;

    # 代理发送请求超时
    # 语法：proxy_send_timeout time;
    # 默认值：60s
    # 上下文：http, server, location
    proxy_send_timeout  60s;

    # 代理读取响应超时
    # 语法：proxy_read_timeout time;
    # 默认值：60s
    # 上下文：http, server, location
    proxy_read_timeout  60s;

    # 代理缓冲区
    # 语法：proxy_buffers number size;
    # 默认值：8 4k|8k;
    # 上下文：http, server, location
    proxy_buffers  8 32k;

    # 代理缓冲区大小（响应头）
    # 语法：proxy_buffer_size size;
    # 默认值：4k|8k;
    # 上下文：http, server, location
    proxy_buffer_size  32k;

    # 代理响应头中默认隐藏的头部（不传递给客户端）
    # 语法：proxy_hide_header field;
    # 上下文：http, server, location
    # proxy_hide_header X-Powered-By;

    # -------------------------------------------------------------------------
    # 3.9 upstream 负载均衡配置块
    # 作用：定义后端服务器组，供 proxy_pass 引用[reference:8]
    # -------------------------------------------------------------------------

    # 示例 1：加权轮询（默认策略）
    upstream backend_api {
        # 后端服务器 1，权重为 3
        # 语法：server address [parameters];
        # 参数：weight=数字, max_fails=数字, fail_timeout=时间, backup 等[reference:9]
        server  10.0.0.1:8080  weight=3  max_fails=3  fail_timeout=30s;

        # 后端服务器 2，权重为 1（默认值）
        server  10.0.0.2:8080  weight=1  max_fails=3  fail_timeout=30s;

        # 备份服务器（仅当主服务器全部不可用时启用）
        server  10.0.0.3:8080  backup;

        # 与后端保持长连接的数量
        # 语法：keepalive connections;
        # 上下文：upstream
        keepalive  32;

        # 长连接超时时间
        keepalive_timeout  60s;

        # 每次长连接可处理的请求数
        keepalive_requests  100;
    }

    # 示例 2：IP 哈希策略（同一客户端 IP 固定分配到同一后端）
    # upstream backend_session {
    #     ip_hash;
    #     server 10.0.1.1:8080;
    #     server 10.0.1.2:8080;
    # }

    # 示例 3：一致性哈希策略
    # upstream backend_cache {
    #     hash $request_uri consistent;
    #     server 10.0.2.1:8080;
    #     server 10.0.2.2:8080;
    # }

    # -------------------------------------------------------------------------
    # 3.10 限流配置（可选）
    # -------------------------------------------------------------------------

    # 定义限流区域（基于客户端 IP）
    # 语法：limit_req_zone key zone=name:size rate=rate;
    # 上下文：http
    limit_req_zone  $binary_remote_addr  zone=req_limit:10m  rate=10r/s;

    # 定义连接数限制区域
    # 语法：limit_conn_zone key zone=name:size;
    # 上下文：http
    limit_conn_zone  $binary_remote_addr  zone=conn_limit:10m;

    # 客户端请求体临时文件路径
    client_body_temp_path  /var/cache/nginx/client_temp;

    # 代理临时文件路径
    proxy_temp_path  /var/cache/nginx/proxy_temp;

    # FastCGI 临时文件路径（如需 PHP 支持）
    fastcgi_temp_path  /var/cache/nginx/fastcgi_temp;

    # uwsgi 临时文件路径
    uwsgi_temp_path  /var/cache/nginx/uwsgi_temp;

    # SCGI 临时文件路径
    scgi_temp_path  /var/cache/nginx/scgi_temp;

    # 引入额外的配置文件（推荐将 server 块拆分到独立文件）
    # 语法：include file | mask;
    # 上下文：any
    include  /etc/nginx/conf.d/*.conf;


    # =========================================================================
    # 四、server（虚拟主机配置块）
    # 作用：定义一个虚拟服务器，处理特定域名或 IP 的 HTTP 请求[reference:10]
    # 说明：可在 http 块中定义多个 server，各自独立处理不同域名的请求
    # =========================================================================

    # -------------------------------------------------------------------------
    # 4.1 HTTP 服务器（端口 80，重定向到 HTTPS）
    # -------------------------------------------------------------------------
    server {
        # 监听端口
        # 语法：listen address[:port] [default_server] [ssl] [http2] ...;
        # 上下文：server
        # default_server：将该 server 设为默认虚拟主机[reference:11]
        listen  80  default_server;

        # 监听 IPv6
        listen  [::]:80  default_server;

        # 虚拟主机域名
        # 语法：server_name name ...;
        # 上下文：server
        # 匹配顺序：精确名称 → 以 * 开头的最长通配符 → 以 * 结尾的最长通配符 → 正则表达式
        server_name  example.com  www.example.com;

        # 将所有 HTTP 请求永久重定向到 HTTPS
        # 301 为永久重定向，302 为临时重定向
        return  301  https://$host$request_uri;
    }

    # -------------------------------------------------------------------------
    # 4.2 HTTPS 服务器（端口 443）
    # -------------------------------------------------------------------------
    server {
        # 监听 443 端口并启用 SSL
        # ssl 参数用于在监听套接字上启用 SSL 协议[reference:12]
        listen  443  ssl  http2  default_server;
        listen  [::]:443  ssl  http2  default_server;

        server_name  example.com  www.example.com;

        # SSL 证书路径
        # 语法：ssl_certificate file;
        # 上下文：http, server
        ssl_certificate  /etc/nginx/ssl/example.com.crt;

        # SSL 私钥路径
        # 语法：ssl_certificate_key file;
        # 上下文：http, server
        # 说明：私钥文件应设置严格的文件权限，但必须对 Nginx master 进程可读[reference:13]
        ssl_certificate_key  /etc/nginx/ssl/example.com.key;

        # 开启 OCSP Stapling（减少 SSL 握手延迟）
        # ssl_stapling on;
        # ssl_stapling_verify on;
        # ssl_trusted_certificate /etc/nginx/ssl/chain.pem;

        # SSL 会话缓存（可按 server 单独设置，也可在 http 块中全局设置）
        ssl_session_cache  shared:SSL:10m;
        ssl_session_timeout  10m;

        # 安全响应头
        # 语法：add_header name value [always];
        # 上下文：http, server, location, if in location
        add_header  X-Content-Type-Options  "nosniff"  always;
        add_header  X-Frame-Options  "SAMEORIGIN"  always;
        add_header  X-XSS-Protection  "1; mode=block"  always;
        add_header  Referrer-Policy  "strict-origin-when-cross-origin"  always;
        # HSTS（HTTP 严格传输安全），启用后浏览器将强制使用 HTTPS
        add_header  Strict-Transport-Security  "max-age=31536000; includeSubDomains"  always;

        # 网站根目录
        # 语法：root path;
        # 上下文：http, server, location, if in location
        root  /var/www/html;

        # 默认首页文件
        # 语法：index file ...;
        # 默认值：index index.html;
        # 上下文：http, server, location
        index  index.html  index.htm;

        # 字符集
        # 语法：charset charset | off;
        # 默认值：charset off;
        # 上下文：http, server, location, if in location
        charset  utf-8;

        # 错误页面配置
        # 语法：error_page code ... [=[response]] uri;
        # 上下文：http, server, location, if in location
        error_page  404  /404.html;
        error_page  500 502 503 504  /50x.html;

        location = /404.html {
            root  /var/www/html;
            internal;  # internal 表示该 location 只能被内部请求访问
        }

        location = /50x.html {
            root  /var/www/html;
            internal;
        }


        # =====================================================================
        # 五、location（URI 匹配配置块）
        # 作用：根据请求的 URI 匹配不同的处理规则[reference:14]
        # 匹配语法：
        #   =  /uri     精确匹配（优先级最高）
        #   ^~ /uri     前缀匹配（匹配后停止搜索正则）
        #   ~  /uri     正则匹配（区分大小写）
        #   ~* /uri     正则匹配（不区分大小写）
        #   /uri        普通前缀匹配
        #   @name       命名 location（仅用于内部重定向）
        # =====================================================================

        # ---------------------------------------------------------------------
        # 5.1 静态资源处理
        # ---------------------------------------------------------------------

        # 根路径 location
        location / {
            # 尝试按顺序查找文件：先找 $uri，再找 $uri/，最后回退到 /index.html
            # 语法：try_files file ... uri | file ... =code;
            # 上下文：server, location
            try_files  $uri  $uri/  /index.html;
        }

        # 静态资源目录（带缓存策略）
        # ^~ 前缀匹配：匹配 /static/ 后停止搜索正则 location
        location ^~ /static/ {
            # 设置静态资源目录
            root  /var/www/static;

            # 设置缓存过期时间
            # 语法：expires [modified] time | epoch | max | off;
            # 上下文：http, server, location, if in location
            expires  30d;

            # 添加缓存控制头部
            add_header  Cache-Control  "public, immutable"  always;

            # 关闭访问日志（静态资源日志通常不需要记录）
            access_log  off;
        }

        # 图片资源目录
        location ~* \.(jpg|jpeg|png|gif|ico|svg|webp)$ {
            root  /var/www/static/images;
            expires  90d;
            add_header  Cache-Control  "public, immutable"  always;
            access_log  off;
        }

        # CSS/JS 文件
        location ~* \.(css|js)$ {
            root  /var/www/static/assets;
            expires  30d;
            add_header  Cache-Control  "public"  always;
        }

        # ---------------------------------------------------------------------
        # 5.2 反向代理配置
        # ---------------------------------------------------------------------

        # API 代理（转发到 upstream 后端服务器组）
        location /api/ {
            # 代理转发地址
            # 语法：proxy_pass URL;
            # 上下文：location, if in location, limit_except
            # 说明：当 location 使用 URI 前缀时，proxy_pass 的路径会被替换[reference:15]
            proxy_pass  http://backend_api;

            # 设置传递给后端的请求头
            # 语法：proxy_set_header field value;
            # 上下文：http, server, location
            proxy_set_header  Host  $host;
            proxy_set_header  X-Real-IP  $remote_addr;
            proxy_set_header  X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_set_header  X-Forwarded-Proto  $scheme;

            # 代理连接超时
            proxy_connect_timeout  30s;
            proxy_send_timeout  60s;
            proxy_read_timeout  60s;

            # 代理重定向处理
            # 语法：proxy_redirect default | off | redirect replacement;
            # 默认值：proxy_redirect default;
            # 上下文：http, server, location
            proxy_redirect  off;

            # 启用代理缓冲
            proxy_buffering  on;
            proxy_buffers  8  32k;
            proxy_buffer_size  32k;
        }

        # WebSocket 代理
        location /ws/ {
            proxy_pass  http://backend_api;
            proxy_http_version  1.1;
            proxy_set_header  Upgrade  $http_upgrade;
            proxy_set_header  Connection  "upgrade";
            proxy_set_header  Host  $host;
            proxy_read_timeout  3600s;  # WebSocket 需要较长的超时时间
        }

        # ---------------------------------------------------------------------
        # 5.3 限流应用
        # ---------------------------------------------------------------------

        location /login/ {
            # 应用请求频率限制
            # 语法：limit_req zone=name [burst=number] [nodelay | delay=number];
            # 上下文：http, server, location
            limit_req  zone=req_limit  burst=5  nodelay;

            # 应用连接数限制
            # 语法：limit_conn zone_name number;
            # 上下文：http, server, location
            limit_conn  conn_limit  10;

            # 超过限制时返回的状态码
            # 语法：limit_req_status code;
            # 默认值：503
            # 上下文：http, server, location
            limit_req_status  429;

            proxy_pass  http://backend_api;
        }

        # ---------------------------------------------------------------------
        # 5.4 拒绝访问敏感文件
        # ---------------------------------------------------------------------

        # 拒绝访问隐藏文件（如 .htaccess、.git 等）
        location ~ /\. {
            deny  all;
            access_log  off;
            log_not_found  off;
        }

        # 拒绝访问备份和临时文件
        location ~* \.(bak|sql|log|tar|gz|zip)$ {
            deny  all;
        }

        # ---------------------------------------------------------------------
        # 5.5 状态页（仅限内网访问）
        # ---------------------------------------------------------------------

        location /nginx_status {
            # 启用 stub_status 模块
            # 需要编译时包含 --with-http_stub_status_module
            stub_status  on;

            # 仅允许内网访问
            allow  127.0.0.1;
            allow  10.0.0.0/8;
            deny  all;

            access_log  off;
        }
    }


    # =========================================================================
    # 六、额外虚拟主机示例（多站点配置）
    # =========================================================================

    # server {
    #     listen  80;
    #     server_name  blog.example.com;
    #
    #     root  /var/www/blog;
    #     index  index.html;
    #
    #     location / {
    #         try_files  $uri  $uri/  /index.html;
    #     }
    # }
}


