# ============================================================
# 最简 Nginx 配置：支持 HTTP 和 HTTPS，HTTP 全部重定向到 HTTPS
# 仅保留必需指令，非必须选项一律省略，使用 Nginx 默认值
# ============================================================

events {
    # events 块必须存在，但可留空以使用默认配置
    # 默认事件模型自动选择，默认 worker_connections 为 512
}

http {
    # ---------- HTTP 服务器：监听 80 端口，强制跳转 HTTPS ----------
    server {
        listen 80;
        server_name example.com;          # 替换为你的域名

        # 301 永久重定向，保留原始 URI 与查询参数
        return 301 https://$host$request_uri;
    }

    # ---------- HTTPS 服务器：监听 443 端口，启用 SSL ----------
    server {
        listen 443 ssl;
        server_name example.com;          # 替换为你的域名

        # SSL 证书与私钥（必须配置）
        ssl_certificate     /etc/nginx/ssl/example.com.crt;  # 替换为证书路径
        ssl_certificate_key /etc/nginx/ssl/example.com.key;  # 替换为私钥路径

        # 以下为网站内容配置示例，按需取消注释即可
        # root  /var/www/html;            # 网站根目录
        # index index.html;               # 默认首页
        # location / {
        #     try_files $uri $uri/ =404;  # 先找文件，再找目录，最后 404
        # }
    }
}
